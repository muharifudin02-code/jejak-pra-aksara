  const App = J.App = {
    st:null, cur:null, chapter:null,

    init(){
      const d=J.store.load();
      App.st = Object.assign({mode:null, auto:true, rate:1, amb:true, sfx:true, prog:{}}, d);
      J.store.data=App.st;
      N.auto=App.st.auto; N.rate=App.st.rate; S.on=App.st.sfx; S.ambOn=App.st.amb;
      A.installDefs();
      const ss=J.getSession();
      if(ss && ss.role==='siswa' && J.findStudent(ss.id)){ App.st.player=ss.nm; App.topbar(); App.splash(); }
      else { J.clearSession(); App.login(); }
      // Audio di peramban baru boleh berbunyi setelah sentuhan pertama
      const un=()=>{ S.unlock && S.unlock(); document.removeEventListener('pointerdown',un); };
      document.addEventListener('pointerdown',un);
      document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ N.stop(); const m=$('.modal.open'); if(m && App.st.mode) App.closeModes(); } });
    },
    save(){ J.store.data=App.st; J.store.save(); },
    prog(ch){ const m=App.st.mode||'beginner'; App.st.prog[m]=App.st.prog[m]||{}; return App.st.prog[m][ch]=App.st.prog[m][ch]||{stars:{}}; },

    /* ---------- perpindahan layar ---------- */
    screen(id, cls=''){
      const main=$('#main'), old=App.cur;
      if(old){ old.classList.remove('active'); (old._cleanup||[]).forEach(f=>f()); setTimeout(()=>old.remove(),700); }
      N.stop(); J.Quiz && J.Quiz.ov && !J.Quiz.ov.isConnected && (J.Quiz.ov=null);
      const s=el('section',{class:'screen '+cls,id,'aria-live':'polite'}); main.appendChild(s); App.cur=s; s._cleanup=[];
      requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('active')));
      document.body.classList.toggle('on-splash',id==='splash');
      document.body.classList.toggle('ramah-mode',App.st.mode==='ramah');
      return s;
    },
    diorama(host,key,opts){ const d=new J.Diorama(host,key,opts); App.cur._cleanup.push(()=>d.destroy()); return d; },

    /* ---------- bar atas ---------- */
    topbar(){
      const tb=$('#topbar'); tb.innerHTML='';
      const brand=el('button',{class:'brand',type:'button','aria-label':'Kembali ke halaman pembuka'},`${J.LOGO}<span><b>Jejak Pra-Aksara<br>Nusantara</b><small>Museum waktu interaktif</small></span>`);
      brand.onclick=()=>{ S.click(); App.splash(); };
      const nav=el('nav',{class:'chapters','aria-label':'Lima Bab'});
      J.CHAPTERS.forEach(c=>{
        const done=c.ready && App.chapterDone(c.id), lock=c.ready && !App.unlocked(c.id), prev=J.CHAPTERS[c.n-2];
        const b=el('button',{class:'chap'+(c.ready&&!lock?'':' locked')+(done?' done':'')+(App.chapter===c.id?' active':''),type:'button',
          title:`Bab ${c.n}: ${c.name} (${c.sub})`,'aria-label':`Bab ${c.n}: ${c.name}${!c.ready?'. Segera hadir':lock?`. Terkunci, selesaikan Bab ${prev.n} dulu`:''}`},
          `<span class="num">${done?J.ICON.check:lock?J.ICON.lock:c.n}</span><span class="lbl">${c.name}${!c.ready?'<span class="soon">Segera hadir</span>':lock?`<span class="soon">Selesaikan Bab ${prev.n} dulu</span>`:''}</span>`);
        b.onclick=()=>{ if(lock){ S.soft(); const t=`Bab ${c.n} masih terkunci. Selesaikan Bab ${prev.n} dulu, ya.`; J.toast(t); N.say(t); return; } S.click(); if(c.ready) App.openChapter(c.id); else App.soon(c); };
        nav.appendChild(b);
      });
      const tools=el('div',{class:'tools audio-panel'});
      const mode=el('button',{class:'tbtn mode',type:'button','aria-label':'Ganti mode belajar'},`${J.ICON.book}<span class="t">${App.st.mode?J.MODES[App.st.mode].name:'Pilih mode'}</span>`);
      mode.onclick=()=>{ S.click(); App.openModes(); };
      const tg=(icon,label,key,apply,txt)=>{ const b=el('button',{class:'tbtn'+(App.st[key]?' on':''),type:'button','aria-pressed':String(!!App.st[key]),'aria-label':label,title:label},`${icon}<span class="t">${txt}</span>`);
        b.onclick=()=>{ App.st[key]=!App.st[key]; apply(App.st[key]); App.save(); b.classList.toggle('on',App.st[key]); b.setAttribute('aria-pressed',String(App.st[key])); S.click();
          J.toast(`${label}: ${App.st[key]?'nyala':'mati'}`,1600); }; return b; };
      const auto=tg(J.ICON.auto,'Auto-Baca','auto',v=>{ N.auto=v; if(!v) N.stop(); },'Auto-Baca');
      const speed=el('button',{class:'tbtn',type:'button','aria-label':'Kecepatan suara narator'},'');
      const paintSpeed=()=>{ const slow=App.st.rate<1; speed.innerHTML=`${slow?J.ICON.turtle:J.ICON.rabbit}<span class="t">${slow?'Pelan 0,75×':'Normal 1×'}</span>`; speed.classList.toggle('on',slow); };
      speed.onclick=()=>{ App.st.rate=App.st.rate<1?1:.75; N.rate=App.st.rate; App.save(); paintSpeed(); S.click(); N.say(App.st.rate<1?'Suara pelan.':'Suara normal.'); };
      paintSpeed();
      const amb=tg(J.ICON.leaf,'Suara alam','amb',v=>S.setAmb(v),'Suara alam');
      const fx=tg(J.ICON.bell,'Efek suara','sfx',v=>{ S.on=v; },'Efek suara');
      const ss=J.getSession();
      if(ss && ss.role==='siswa'){ const who=el('button',{class:'tbtn',type:'button','aria-label':`Masuk sebagai ${ss.nm}, kelas ${ss.k}. Tekan untuk ganti siswa`,title:'Ganti siswa'},`${J.ICON.retry}<span class="t">${ss.k} · Ganti siswa</span>`); who.onclick=()=>App.logout(); tools.append(who); }
      tools.append(mode,auto,speed,amb,fx);
      tb.append(brand,nav,tools);
    },
    chapterDone(id){ if(!App.st.mode) return false; const ch=J.chapters[id]; return ch && ch.isDone && ch.isDone(); },


    /* ---------- masuk siswa: pilih kelas lalu nama ---------- */
    login(){
      App.chapter=null; $('#topbar').innerHTML='';
      const s=App.screen('login','login-screen');
      const kelas=[...new Set(J.STUDENTS.map(x=>x.k))].sort((a,b)=>parseInt(a.split('-')[1])-parseInt(b.split('-')[1]));
      const card=el('div',{class:'login-card'},`<div style="text-align:center">${J.LOGO}</div><h2>Selamat datang!</h2><p>Pilih kelasmu, lalu pilih namamu.</p>
        <div class="field"><label for="lgK">Kelas</label><select id="lgK"><option value="">Pilih kelas</option>${kelas.map(k=>`<option>${k}</option>`).join('')}</select></div>
        <div class="field"><label for="lgN">Nama</label><select id="lgN" disabled><option value="">Pilih kelas dulu</option></select></div>
        <div class="login-err" role="alert"></div>`);
      const go=el('button',{class:'btn',type:'button',style:'width:100%'},`${J.ICON.play||''} Masuk`);
      card.appendChild(go);
      const wrap=el('div',{class:'login-wrap'}); wrap.appendChild(card); s.appendChild(wrap);
      const k=$('#lgK',card), n=$('#lgN',card), err=$('.login-err',card);
      k.onchange=()=>{ const l=J.STUDENTS.filter(x=>x.k===k.value).sort((a,b)=>a.a-b.a);
        n.innerHTML=`<option value="">${k.value?'Pilih namamu':'Pilih kelas dulu'}</option>`+l.map(x=>`<option value="${J.sid(x)}">${x.a}. ${x.nm}</option>`).join('');
        n.disabled=!k.value; err.textContent=''; S.click(); };
      go.onclick=()=>{ const st=J.findStudent(n.value);
        if(!st){ S.soft(); err.textContent=k.value?'Pilih namamu dulu, ya.':'Pilih kelasmu dulu, ya.'; N.say(err.textContent); return; }
        J.setSession({role:'siswa',id:J.sid(st),nm:st.nm,k:st.k,at:Date.now()});
        App.st.player=st.nm.replace(/\w\S*/g,w=>w[0]+w.slice(1).toLowerCase()); App.save();
        S.ok(); J.toast(`Halo, ${App.st.player}!`,1800); App.topbar(); App.splash(); };
      N.autoSeq && N.autoSeq([{text:'Selamat datang! Pilih kelasmu, lalu pilih namamu. Setelah itu tekan tombol Masuk.',el:card}]);
    },
    logout(){ J.clearSession(); App.st.player=''; App.save(); S.click(); App.login(); },

    /* ---------- pemilih mode ---------- */
    openModes(after){

      const sheet=el('div',{class:'sheet card paper'});
      sheet.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="kicker">Langkah pertama</div><h2 id="modesTitle" style="margin:.1em 0">Pilih cara belajarmu</h2></div></div>`;
      const head=$('.row',sheet);
      const icons={ramah:A.icon.thumbUp, beginner:A.icon.tree, medium:A.icon.bone, hard:A.icon.skull||A.icon.human};
      const grid=el('div',{class:'modes'});
      const items=[{text:'Pilih cara belajarmu.',el:$('h2',sheet)}];
      Object.entries(J.MODES).forEach(([k,v])=>{
        const c=el('button',{class:'mode-card'+(k==='ramah'?' ramah':'')+(App.st.mode===k?' sel':''),type:'button','data-mode':k},
          `${k==='ramah'?'<span class="tag2">Inklusif</span>':''}${icons[k]||A.icon.human}<b>${v.name}</b><span style="color:var(--ink2);font-size:15px">${v.sub}</span><span>${v.desc}</span>`);
        c.onclick=()=>{ S.ok(); App.setMode(k); App.closeModes(); after ? after() : App.refresh(); };
        grid.appendChild(c); items.push({text:`${v.name}. ${v.sub}. ${v.desc}`,el:c});
      });
      head.appendChild(N.button(()=>items,'Bacakan'));
      sheet.appendChild(grid);
      if(App.st.mode){ const x=el('div',{class:'row',style:'justify-content:flex-end;margin-top:16px'}); const cl=el('button',{class:'btn ghost',type:'button'},'Tutup'); cl.onclick=()=>{S.click();App.closeModes();}; x.appendChild(cl); sheet.appendChild(x); }
      m.appendChild(sheet); document.body.appendChild(m);
      m.addEventListener('click',e=>{ if(e.target===m && App.st.mode) App.closeModes(); });
      requestAnimationFrame(()=>m.classList.add('open'));
      N.autoSeq([items[0]]);
      setTimeout(()=>{ const f=$('.mode-card.sel',m)||$('.mode-card',m); f&&f.focus({preventScroll:true}); },300);
    },
    closeModes(){ const m=$('#modes'); if(!m) return; m.classList.remove('open'); N.stop(); setTimeout(()=>m.remove(),500); },
    setMode(k){ App.st.mode=k; App.save(); document.body.classList.toggle('ramah-mode',k==='ramah'); App.topbar(); J.toast(`Mode ${J.MODES[k].name} dipilih.`,1800); },
    refresh(){ if(App.chapter) App.openChapter(App.chapter); else App.splash(); },

    /* ---------- bab ---------- */
    openChapter(id){
      if(!App.st.mode){ App.openModes(()=>App.openChapter(id)); return; }
      if(!App.unlocked(id)){ const k=J.CHAPTERS.findIndex(c=>c.id===id), prev=J.CHAPTERS[k-1]; J.toast(`Bab ${k+1} masih terkunci. Selesaikan Bab ${prev.n} dulu, ya.`);
        id=(J.CHAPTERS.find(c=>App.unlocked(c.id)&&!App.chapterDone(c.id))||J.CHAPTERS[0]).id; }
      App.chapter=id; App.topbar(); J.chapters[id].map();
    },
    /* Bab terbuka jika bab sebelumnya sudah selesai pada mode yang sedang dipakai */
    unlocked(id){ if(window.JPA_UNLOCK) return true; const k=J.CHAPTERS.findIndex(c=>c.id===id); return k<=0 || App.chapterDone(J.CHAPTERS[k-1].id); },
    soon(c){
      App.chapter=null; App.topbar();
      const s=App.screen('soon','contour');
      const icon={2:A.icon.skull||A.icon.bone,3:A.icon.fire,4:A.icon.fire,5:A.icon.sea}[c.n]||A.icon.timeline;
      const card=el('div',{class:'card paper soon-card'},`<div class="medal-big">${icon}</div><div class="kicker">Bab ${c.n}</div><h2>${c.name}</h2><p>${c.sub}.</p><p>Ruang pameran ini sedang disiapkan. Selesaikan Bab 1 dulu, ya!</p>`);
      const row=el('div',{class:'row',style:'justify-content:center'});
      const b=el('button',{class:'btn',type:'button'},`${J.ICON.map} Ke Bab 1`); b.onclick=()=>{S.click();App.openChapter('bab1');};
      row.append(b,N.button(()=>({text:`Bab ${c.n}, ${c.name}. Ruang pameran ini sedang disiapkan. Selesaikan Bab 1 dulu, ya!`,el:card}),'Bacakan'));
      card.appendChild(row); const wrap=el('div',{class:'center'}); wrap.appendChild(card); s.appendChild(wrap);
      N.autoSeq([{text:`Bab ${c.n}, ${c.name}, segera hadir.`,el:card}]);
    }
  };
// Hook skor kuis ke penyimpanan admin
(function(){
  if(!J.Quiz || J.Quiz.__hooked) return;
  const _open = J.Quiz.open;
  J.Quiz.open = function(opts){
    const orig = opts && opts.onDone;
    if(opts){
      opts.onDone = function(r){
        try{
          const sess = J.getSession && J.getSession();
          if(sess && sess.role==='siswa'){
            const qid = (opts.title||'kuis').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
            J.recordScore(sess.id, qid, opts.title||'Kuis', r.score, r.total);
          }
        }catch(e){}
        return orig && orig(r);
      };
    }
    return _open.call(this, opts);
  };
  J.Quiz.__hooked = true;
})();
  J.chapters = {};
})(window.JPA);

<script>
/* Bab 1 "Lahirnya Bumi": peta stasiun → cerita diorama → misi jelajah → kuis → hasil; ditutup mini-game Susun Garis Waktu. */
(function(J){
  const N=J.narrator, S=J.sfx, A=J.art, App=J.App, $=J.$, el=J.el, B=J.BAB1;
  const ST=B.stations;
  /* posisi stasiun di peta (persen), jalur berkelok seperti jalan setapak museum */
  const POS=[[9,68],[25,30],[42,70],[58,30],[75,68],[91,32]];

  const C = J.chapters.bab1 = {
    p(){ return App.prog('bab1'); },
    isDone(){ return ST.every(s=>C.p().stars[s.id]!=null); },
    nextIdx(){ const i=ST.findIndex(s=>C.p().stars[s.id]==null); return i<0?ST.length:i; },
    mode(){ return App.st.mode; },

    /* ================= PETA ================= */
    map(){
      const s=App.screen('bab1-map','contour'), p=C.p(), nx=C.nextIdx(), ramah=C.mode()==='ramah';
      const wrap=el('div',{class:'mapwrap'});
      const head=el('div',{class:'card paper maphead'});
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      head.innerHTML=`<div><div class="kicker">Bab 1 · Ruang Pameran Pertama</div><h2>Lahirnya Bumi</h2>
        <p class="lead">${ramah?'Ketuk lingkaran yang bersinar untuk mulai.':'Ikuti jalur waktu: dari Big Bang sampai munculnya manusia purba. Setiap stasiun terbuka setelah stasiun sebelumnya selesai.'}</p></div>`;
      const right=el('div',{class:'row'});
      const mc=el('button',{class:'mode-chip',type:'button'},`${J.ICON.book} Mode ${J.MODES[C.mode()].name}`); mc.onclick=()=>{S.click();App.openModes();};
      right.append(el('span',{class:'chip'},`${J.star(true)} <span>${total} / ${ST.length*3} bintang</span>`), mc,
        N.button(()=>[{text:'Bab 1. Lahirnya Bumi.',el:$('h2',head)},{text:J.plain($('.lead',head).innerHTML),el:$('.lead',head)}],'Bacakan'));
      $('.chip',right).firstChild.style.cssText='width:22px;height:22px';
      head.appendChild(right); wrap.appendChild(head);

      const map=el('div',{class:'map'});
      const d=POS.map(([x,y],i)=>i?`S ${(POS[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      const dDone=POS.slice(0,Math.min(nx+1,POS.length)).map(([x,y],i,arr)=>i?`S ${(arr[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      map.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="#e6d0a8" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:16px"/>
        <path d="${d}" fill="none" stroke="#fffaf0" stroke-dasharray="2 8" vector-effect="non-scaling-stroke" style="stroke-width:4px" stroke-linecap="round"/>
        ${nx>0?`<path d="${dDone}" fill="none" stroke="#d9a441" vector-effect="non-scaling-stroke" style="stroke-width:6px" stroke-linecap="round" opacity=".85"/>`:''}</svg>`;
      ST.forEach((st,i)=>{
        const done=p.stars[st.id]!=null, open=i<=nx, next=i===nx;
        const b=el('button',{class:'station'+(done?' done':'')+(open?' open':' locked')+(next?' next':''),type:'button',style:`left:${POS[i][0]}%;top:${POS[i][1]}%`,
          'aria-label':`${st.name}. ${done?'Selesai':open?'Terbuka':'Terkunci'}`},
          `<span class="medal">${J.scenes.medal[st.id]}${done?`<span class="badge">${J.ICON.check}</span>`:''}${!open?`<span class="lock">${J.ICON.lock}</span>`:''}</span>
           <span>${ramah?st.short:st.name}</span><small>${st.time}</small>
           <span class="stars">${[1,2,3].map(k=>J.star(done&&p.stars[st.id]>=k)).join('')}</span>`);
        const lk=$('.lock svg',b); if(lk) lk.style.cssText='width:44px;height:44px;color:#6a5340';
        const bd=$('.badge svg',b); if(bd) bd.style.cssText='width:22px;height:22px';
        b.onclick=()=>{ if(!open){ S.soft(); J.toast('Selesaikan stasiun sebelumnya dulu, ya.'); N.say('Selesaikan stasiun sebelumnya dulu, ya.'); return; }
          S.page(); st.id==='timeline'?C.timeline():C.era(st); };
        b.addEventListener('focus',()=>{}); map.appendChild(b);
      });
      wrap.appendChild(map);
      if(C.isDone()){ const r=el('div',{class:'row',style:'justify-content:center;margin-top:10px'}); const b=el('button',{class:'btn green',type:'button'},`${J.ICON.check} Bab 1 selesai! Lihat sertifikat`); b.onclick=()=>{S.click();C.complete();}; r.appendChild(b); wrap.appendChild(r); }
      s.appendChild(wrap);
      S.ambience(null);
      N.autoSeq([{text: nx<ST.length?`Bab 1, Lahirnya Bumi. Stasiun berikutnya: ${ST[nx].short}.`:'Bab 1 selesai. Hebat!',el:head}]);
      setTimeout(()=>{ const f=$('.station.next',map); f&&f.focus({preventScroll:true}); },700);
    },

    /* ================= STASIUN ZAMAN ================= */
    era(st){
      const mode=C.mode(), ramah=mode==='ramah';
      const cards = ramah ? st.cards.ramah : ((st.cards && st.cards.other) || st.build(mode));
      const s=App.screen('era-'+st.id);
      const grid=el('div',{class:'era'});
      const host=el('div'); grid.appendChild(host);
      const sc=J.scenes[st.scene], hsList=(sc.hotspots||[]);
      const found=new Set(); let exploring=false;
      const dio=App.diorama(host, st.scene, { onHotspot:(id,g)=>{
        const h=hsList.find(x=>x.id===id); if(!h) return;
        dio.showTag(g,h.label); N.say(h.say);
        if(exploring && !found.has(id)){ found.add(id); g.classList.add('found'); S.discover(); paintMission(); }
        else S.click();
      }});
      host.appendChild(el('div',{class:'plate'},`<b>${st.short}</b><span class="pt"> · ${st.time}</span>`));

      const side=el('div',{class:'side'});
      const card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 1 · ${st.time}</span>
        <button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button></div>
        <h2>${st.name}</h2><div class="story"></div><div class="navrow"><div class="dots" aria-hidden="true"></div><div class="row nav"></div></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); grid.appendChild(side); s.appendChild(grid);
      const story=$('.story',card), dots=$('.dots',card), nav=$('.nav',card);
      dots.innerHTML=cards.map(()=>'<i></i>').join('')+(hsList.length?'<i></i>':'');
      let i=0;

      const showCard=()=>{
        const c=cards[i]; exploring=false; dio.explore(false);
        dio.setPhase(c.phase||0); if(c.cam) dio.setCam(c.cam); else dio.setCam([.5,.5,1]);
        story.innerHTML='';
        const row=el('div',{class:'storyrow'});
        if(c.icon && A.icon[c.icon]){ const ic=el('div',{class:'story-icon enter'},A.icon[c.icon]); row.appendChild(ic); }
        const tx=el('div',{style:'flex:1'});
        if(c.stamp) tx.appendChild(el('span',{class:'stamp'},c.stamp));
        if(c.info) tx.appendChild(el('span',{class:'info-flag'},'Info tambahan'));
        const p=el('p',{class:'txt enter'},c.t); tx.appendChild(p); row.appendChild(tx); story.appendChild(row);
        story.appendChild(N.button(()=>({text:J.plain(c.t),el:p}),'Bacakan'));
        J.$$('i',dots).forEach((d,k)=>{ d.className=k===i?'on':k<i?'seen':''; });
        nav.innerHTML='';
        const prev=el('button',{class:'btn ghost',type:'button','aria-label':'Sebelumnya'},`${J.ICON.prev}${ramah?'':' Kembali'}`); prev.disabled=i===0;
        prev.onclick=()=>{ S.page(); i--; showCard(); };
        const last=i===cards.length-1;
        const nx=el('button',{class:'btn'+(last?' green':''),type:'button'},last?(hsList.length?`${J.ICON.search} Ayo jelajahi`:`${J.ICON.check} Selesai`):`Lanjut ${J.ICON.next}`);
        nx.onclick=()=>{ S.page(); if(!last){ i++; showCard(); } else if(hsList.length) mission(); else finishStation(3); };
        nav.append(prev,nx);
        N.autoSeq([{text:J.plain(c.t),el:p}]);
        story.scrollTop=0;
      };

      /* Misi jelajah: temukan semua benda bersinar di diorama */
      const mission=()=>{
        exploring=true; dio.explore(true);
        const maxPh=Math.max(...cards.map(c=>c.phase||0)); dio.setPhase(maxPh); dio.setCam([.5,.5,1]);
        J.$$('i',dots).forEach((d,k)=>{ d.className=k===cards.length?'on':'seen'; });
        story.innerHTML=''; nav.innerHTML='';
        const ms=el('div',{class:'mission'},`${A.icon.search||J.ICON.search}<div><b>Misi Jelajah</b><br><span class="mtx">${ramah?'Ketuk benda yang bersinar.':'Ketuk setiap benda yang bersinar di diorama untuk mendengar penjelasannya.'}</span> <span class="hs-count"></span></div>`);
        $('svg',ms).style.cssText='width:44px;height:44px;color:var(--forest)';
        story.append(ms, el('div',{class:'found-list'}), N.button(()=>({text:J.plain($('.mtx',ms).innerHTML),el:ms}),'Bacakan'));
        paintMission();
        N.autoSeq([{text:'Misi jelajah. '+J.plain($('.mtx',ms).innerHTML)+` Ada ${hsList.length} benda.`,el:ms}]);
        const back=el('button',{class:'btn ghost',type:'button'},`${J.ICON.prev}${ramah?'':' Cerita'}`); back.onclick=()=>{ S.page(); i=cards.length-1; showCard(); };
        nav.appendChild(back);
      };
      const paintMission=()=>{
        const cnt=$('.hs-count',story), fl=$('.found-list',story); if(!cnt) return;
        cnt.textContent=`(${found.size} dari ${hsList.length} ditemukan)`;
        fl.innerHTML=hsList.filter(h=>found.has(h.id)).map(h=>`<span>${h.label}</span>`).join('');
        if(found.size===hsList.length && !$('[data-act=quiz]',nav)){
          setTimeout(()=>{ S.win(); J.celebrate(40); },400);
          const q=el('button',{class:'btn green big',type:'button','data-act':'quiz'},`${J.ICON.play} Mulai kuis`);
          q.onclick=()=>{ S.page(); quiz(); };
          nav.appendChild(q);
          setTimeout(()=>{ N.seq([{text:'Hebat! Semua benda sudah ditemukan. Sekarang, ayo kerjakan kuis.',el:q}]); q.focus({preventScroll:true}); },1600);
        }
      };

      /* Kuis stasiun */
      const quiz=()=>{
        N.stop(); exploring=false; dio.explore(false);
        const qs=C.questions(st,mode), M=J.MODES[mode];
        J.Quiz.open({host:s,title:`Kuis ${st.short}`,questions:qs,mode,pass:M.pass,onDone:r=>{ J.Quiz.close(); result(r); }});
      };
      const result=r=>{
        const stars = r.pass ? (r.pct>=.9?3:r.pct>=.65?2:1) : 0;
        const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'});
        const pctTxt = mode==='ramah' ? '' : `<p>Benar ${J.fmt(r.score)} dari ${r.total} soal (${Math.round(r.pct*100)}%). Batas lulus ${Math.round(J.MODES[mode].pass*100)}%.</p>`;
        if(r.pass){
          c.innerHTML=`<div class="medal-big">${J.scenes.medal[st.id]}</div><div class="kicker">Stasiun selesai</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][stars]} Kamu mendapat ${stars} bintang</h2>
            <div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>${pctTxt}<p class="msg">${st.short} sudah kamu jelajahi. Ayo lanjut ke stasiun berikutnya!</p><div class="row"></div>`;
          const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.map} Lanjut ke peta`); go.onclick=()=>{ S.page(); C.map(); };
          const again=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Ulangi kuis`); again.onclick=()=>{ S.click(); ov.remove(); quiz(); };
          $('.row',c).append(go,again,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
          const p=C.p(); p.stars[st.id]=Math.max(p.stars[st.id]||0,stars); App.save(); App.topbar();
          setTimeout(()=>{ S.win(); J.celebrate(120); },300);
        } else {
          c.innerHTML=`<div class="medal-big">${A.face(false)}</div><div class="kicker">Hampir berhasil</div><h2>Hampir tepat! Yuk kita dengarkan ceritanya lagi</h2>${pctTxt}
            <p class="msg">Tidak apa-apa. Baca lagi ceritanya pelan-pelan, lalu coba kuisnya sekali lagi. Kamu pasti bisa!</p><div class="row"></div>`;
          const rd=el('button',{class:'btn',type:'button'},`${J.ICON.book} Dengarkan cerita lagi`); rd.onclick=()=>{ S.page(); ov.remove(); i=0; showCard(); };
          const again=el('button',{class:'btn green',type:'button'},`${J.ICON.retry} Coba kuis lagi`); again.onclick=()=>{ S.click(); ov.remove(); quiz(); };
          $('.row',c).append(rd,again,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
          S.soft();
        }
        ov.appendChild(c); s.appendChild(ov);
        N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
        setTimeout(()=>{ const f=$('.btn',c); f&&f.focus({preventScroll:true}); },500);
      };
      const finishStation=stars=>{ const p=C.p(); p.stars[st.id]=Math.max(p.stars[st.id]||0,stars); App.save(); App.topbar(); S.win(); J.celebrate(60);
        J.toast('Stasiun selesai! Kamu mendapat 3 bintang.'); setTimeout(()=>C.map(),900); };

      showCard();
    },

    /* Memilih soal: Ramah memakai soal bergambar; mode lain mengambil dari bank dengan variasi tipe soal */
    questions(st,mode){
      if(mode==='ramah') return J.shuffle(B.ramahQuiz[st.id]||[]).slice(0,Math.max(3,J.MODES.ramah.n)).map(q=>({...q}));
      const n=J.MODES[mode].n, pool=[...((J.BANK[st.bank]||{})[mode]||[])];
      const forced=[]; if(st.id==='neozoikum' && B.kuarterQuiz[mode]) forced.push(J.shuffle(B.kuarterQuiz[mode])[0]);
      const groups={}; J.shuffle(pool).forEach(q=>(groups[q.t]=groups[q.t]||[]).push(q));
      const keys=J.shuffle(Object.keys(groups)), out=[...forced];
      while(out.length<n && keys.some(k=>groups[k].length)) for(const k of keys){ if(out.length>=n) break; const q=groups[k].shift(); if(q) out.push(q); }
      return J.shuffle(out).map(q=>({...q}));
    },

    /* ================= MINI-GAME: SUSUN GARIS WAKTU ================= */
    timeline(){
      const s=App.screen('bab1-timeline','contour'), ramah=C.mode()==='ramah';
      const ERAS=ST.slice(1,5);
      const w=el('div',{class:'tl-wrap'});
      const head=el('div',{class:'card paper'});
      head.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 1 · Mini-game</span>
        <button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button></div>
        <h2 style="margin:.1em 0">Susun Garis Waktu</h2><p class="ins" style="margin:0">${ramah?'Ketuk gambar yang <b>paling tua</b> dulu.':'Ketuk kartu zaman dari yang <b>paling tua</b> sampai yang <b>paling muda</b>. Kartu akan masuk ke kotak bernomor.'}</p>
        <div class="row tlbtns" style="margin-top:10px"></div><div class="fb tl-hint" aria-live="polite"></div>`;
      $('[data-act=map]',head).onclick=()=>{ S.click(); C.map(); };
      const hintBtn=el('button',{class:'btn ghost',type:'button'},`${J.ICON.search} Petunjuk`);
      $('.tlbtns',head).append(N.button(()=>({text:J.plain($('.ins',head).innerHTML),el:$('.ins',head)}),'Bacakan'),hintBtn);
      const slots=el('div',{class:'tl-slots'}), cardsBox=el('div',{class:'tl-cards'});
      ERAS.forEach((_,k)=>slots.appendChild(el('div',{class:'slot'},`<span class="n">${k+1}</span><span>${k===0?'Paling tua':k===3?'Paling muda':''}</span>`)));
      let step=0, miss=0;
      const fb=$('.fb',head);
      const hint=(soft)=>{ const t=(soft?'Hampir tepat! Yuk kita dengarkan petunjuknya lagi. ':'Petunjuk: ')+B.timelineHints[step];
        fb.className='fb show try'; fb.innerHTML=`${A.face(!soft)}<div class="body"><p style="margin:0">${t}</p></div>`; N.say(t,fb); };
      hintBtn.onclick=()=>{ S.click(); hint(false); };
      J.shuffle(ERAS.map((e,k)=>({e,k}))).forEach(({e,k})=>{
        const c=el('button',{class:'tl-card',type:'button','aria-label':e.short},`${J.scenes.medal[e.id]}<span>${e.short}</span>${ramah?'':`<small>${e.time}</small>`}`);
        c.onclick=()=>{
          if(k===step){
            S.ok(); c.classList.add('used');
            const sl=slots.children[step]; sl.classList.add('filled'); sl.innerHTML=`<span class="n">${step+1}</span><div>${J.scenes.medal[e.id]}<b>${e.short}</b></div>`;
            N.say(`${step+1}. ${e.short}. ${e.time}.`, sl);
            fb.className='fb'; step++;
            if(step===ERAS.length) setTimeout(done,900);
          } else { miss++; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); S.soft(); hint(true); }
        };
        cardsBox.appendChild(c);
      });
      const done=()=>{
        const stars=miss===0?3:miss<=2?2:1, p=C.p(); p.stars.timeline=Math.max(p.stars.timeline||0,stars); App.save(); App.topbar();
        S.win(); J.celebrate(140);
        const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'},`<div class="medal-big">${A.icon.timeline}</div><div class="kicker">Garis waktu tersusun</div>
          <h2>Hebat! Urutannya tepat</h2><div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>
          <p class="msg">Arkaekum, lalu Paleozoikum, lalu Mesozoikum, lalu Neozoikum. Kamu sudah menyelesaikan Bab 1!</p><div class="row"></div>`);
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.check} Lihat sertifikat Bab 1`); go.onclick=()=>{ S.page(); C.complete(); };
        $('.row',c).append(go,N.button(()=>({text:'Hebat! Urutannya tepat. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        ov.appendChild(c); s.appendChild(ov);
        N.autoSeq([{text:'Hebat! Urutannya tepat. '+J.plain($('.msg',c).innerHTML),el:c}]);
      };
      w.append(head,slots,cardsBox); s.appendChild(w);
      N.autoSeq([{text:'Susun garis waktu. '+J.plain($('.ins',head).innerHTML),el:$('.ins',head)}]);
    },

    /* ================= PENUTUP BAB ================= */
    complete(){
      const s=App.screen('bab1-done','contour'), p=C.p();
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      const c=el('div',{class:'card paper result'},`<div class="medal-big">${J.LOGO}</div><div class="kicker">Sertifikat Penjelajah</div>
        <h2>Bab 1 "Lahirnya Bumi" selesai!</h2><div class="stars">${J.star(true)}</div><p><b>${total}</b> dari ${ST.length*3} bintang · Mode ${J.MODES[C.mode()].name}</p>
        <p class="msg">Kamu sudah menjelajah dari Big Bang, Arkaekum, Paleozoikum, Mesozoikum, sampai Neozoikum. Bab 2 "Lapisan Tanah & Manusia Purba" segera hadir.</p><div class="row"></div>`);
      const m=el('button',{class:'btn',type:'button'},`${J.ICON.map} Kembali ke peta`); m.onclick=()=>{ S.click(); C.map(); };
      const mo=el('button',{class:'btn ghost',type:'button'},`${J.ICON.book} Coba mode lain`); mo.onclick=()=>{ S.click(); App.openModes(); };
      $('.row',c).append(m,mo,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
      const wr=el('div',{class:'center'}); wr.appendChild(c); s.appendChild(wr);
      S.win(); J.celebrate(160);
      N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
    }
  };
})(window.JPA);

</script>
<script>
/* Bab 2 "Lapisan Tanah & Manusia Purba": peta → (1) cerita lapisan + Gali Fosil + kuis → (2) cerita tengkorak + Lab Tengkorak + kuis → (3) Kelompokkan Fosil. */
(function(J){
  const N=J.narrator, S=J.sfx, A=J.art, App=J.App, $=J.$, el=J.el, B=J.BAB2, LY=J.LAYERS;
  const ST=B.stations, POS=[[16,64],[50,30],[84,64]];
  const ramahM=()=>App.st.mode==='ramah', mode=()=>App.st.mode, lvl=()=>ramahM()?'beginner':mode();
  const say=(t,e)=>N.say(t,e);

  const C = J.chapters.bab2 = {
    p(){ return App.prog('bab2'); },
    isDone(){ return ST.every(s=>C.p().stars[s.id]!=null); },
    nextIdx(){ const i=ST.findIndex(s=>C.p().stars[s.id]==null); return i<0?ST.length:i; },
    award(id,stars){ const p=C.p(); p.stars[id]=Math.max(p.stars[id]||0,stars); App.save(); App.topbar(); },

    /* ================= PETA ================= */
    map(){
      const s=App.screen('bab2-map','contour'), p=C.p(), nx=C.nextIdx(), ramah=ramahM();
      const wrap=el('div',{class:'mapwrap'}), head=el('div',{class:'card paper maphead'});
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      head.innerHTML=`<div><div class="kicker">Bab 2 · Ruang Pameran Kedua</div><h2>Lapisan Tanah &amp; Manusia Purba</h2>
        <p class="lead">${ramah?'Ayo menggali fosil! Ketuk lingkaran yang bersinar.':'Gali fosil dari empat lapisan tanah Jawa, bandingkan tengkorak manusia purba, lalu kelompokkan temuanmu.'}</p></div>`;
      const right=el('div',{class:'row'});
      const mc=el('button',{class:'mode-chip',type:'button'},`${J.ICON.book} Mode ${J.MODES[mode()].name}`); mc.onclick=()=>{S.click();App.openModes();};
      right.append(el('span',{class:'chip'},`${J.star(true)} <span>${total} / ${ST.length*3} bintang</span>`), mc,
        N.button(()=>[{text:'Bab 2. Lapisan Tanah dan Manusia Purba.',el:$('h2',head)},{text:J.plain($('.lead',head).innerHTML),el:$('.lead',head)}],'Bacakan'));
      head.appendChild(right); wrap.appendChild(head);
      const map=el('div',{class:'map'});
      const pth=pts=>pts.map(([x,y],i)=>i?`S ${(pts[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      map.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="${pth(POS)}" fill="none" stroke="#e6d0a8" vector-effect="non-scaling-stroke" style="stroke-width:16px" stroke-linecap="round"/>
        <path d="${pth(POS)}" fill="none" stroke="#fffaf0" stroke-dasharray="2 8" vector-effect="non-scaling-stroke" style="stroke-width:4px" stroke-linecap="round"/>
        ${nx>0?`<path d="${pth(POS.slice(0,Math.min(nx+1,3)))}" fill="none" stroke="#d9a441" vector-effect="non-scaling-stroke" style="stroke-width:6px" stroke-linecap="round" opacity=".85"/>`:''}</svg>`;
      ST.forEach((st,i)=>{
        const done=p.stars[st.id]!=null, open=i<=nx, next=i===nx;
        const b=el('button',{class:'station'+(done?' done':'')+(open?' open':' locked')+(next?' next':''),type:'button',style:`left:${POS[i][0]}%;top:${POS[i][1]}%`,'aria-label':`${st.name}. ${done?'Selesai':open?'Terbuka':'Terkunci'}`},
          `<span class="medal">${J.scenes.medal[st.id]}${done?`<span class="badge">${J.ICON.check}</span>`:''}${!open?`<span class="lock">${J.ICON.lock}</span>`:''}</span>
           <span>${ramah?st.short:st.name}</span><small>${st.time}</small><span class="stars">${[1,2,3].map(k=>J.star(done&&p.stars[st.id]>=k)).join('')}</span>`);
        const lk=$('.lock svg',b); if(lk) lk.style.cssText='width:44px;height:44px;color:#6a5340';
        const bd=$('.badge svg',b); if(bd) bd.style.cssText='width:22px;height:22px';
        b.onclick=()=>{ if(!open){ S.soft(); J.toast('Selesaikan stasiun sebelumnya dulu, ya.'); say('Selesaikan stasiun sebelumnya dulu, ya.'); return; }
          S.page(); ({strata:C.strata,anatomi:C.anatomi,susun:C.susun})[st.id](st); };
        map.appendChild(b);
      });
      wrap.appendChild(map);
      if(C.isDone()){ const r=el('div',{class:'row',style:'justify-content:center;margin-top:10px'}); const b=el('button',{class:'btn green',type:'button'},`${J.ICON.check} Bab 2 selesai! Lihat sertifikat`); b.onclick=()=>{S.click();C.complete();}; r.appendChild(b); wrap.appendChild(r); }
      s.appendChild(wrap); S.ambience(null);
      N.autoSeq([{text: nx<ST.length?`Bab 2, Lapisan Tanah dan Manusia Purba. Stasiun berikutnya: ${ST[nx].short}.`:'Bab 2 selesai. Hebat!',el:head}]);
      setTimeout(()=>{ const f=$('.station.next',map); f&&f.focus({preventScroll:true}); },700);
    },

    /* ---------- kerangka layar stasiun: visual kiri + kartu cerita kanan ---------- */
    frame(st,id){
      const s=App.screen(id), grid=el('div',{class:'era'}), host=el('div'), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 2 · ${st.time}</span>
        <button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button></div>
        <h2>${st.name}</h2><div class="story"></div><div class="navrow"><div class="dots" aria-hidden="true"></div><div class="row nav"></div></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); grid.append(host,side); s.appendChild(grid);
      return {s,host,card,story:$('.story',card),dots:$('.dots',card),nav:$('.nav',card)};
    },
    /* kartu cerita bergilir; onCard(c) mengatur visual; finish() dipanggil setelah kartu terakhir */
    storyRunner(f,cards,onCard,lastLabel,finish){
      let i=0; f.dots.innerHTML=cards.map(()=>'<i></i>').join('')+'<i></i>';
      const show=()=>{
        const c=cards[i]; onCard(c,i); f.story.innerHTML='';
        const row=el('div',{class:'storyrow'});
        if(c.icon && A.icon[c.icon]) row.appendChild(el('div',{class:'story-icon enter'},A.icon[c.icon]));
        const p=el('p',{class:'txt enter'},c.t); const tx=el('div',{style:'flex:1'}); tx.appendChild(p); row.appendChild(tx); f.story.appendChild(row);
        f.story.appendChild(N.button(()=>({text:J.plain(c.t),el:p}),'Bacakan'));
        J.$$('i',f.dots).forEach((d,k)=>{ d.className=k===i?'on':k<i?'seen':''; });
        f.nav.innerHTML='';
        const prev=el('button',{class:'btn ghost',type:'button','aria-label':'Sebelumnya'},`${J.ICON.prev}${ramahM()?'':' Kembali'}`); prev.disabled=i===0; prev.onclick=()=>{ S.page(); i--; show(); };
        const last=i===cards.length-1;
        const nx=el('button',{class:'btn'+(last?' green':''),type:'button'},last?lastLabel:`Lanjut ${J.ICON.next}`);
        nx.onclick=()=>{ S.page(); if(!last){ i++; show(); } else { J.$$('i',f.dots).forEach((d,k)=>d.className=k===cards.length?'on':'seen'); finish(); } };
        f.nav.append(prev,nx); N.autoSeq([{text:J.plain(c.t),el:p}]);
      };
      show(); return { restart(){ i=0; show(); }, back(){ i=cards.length-1; show(); } };
    },
    pick(pool,n){
      const groups={}; J.shuffle(pool).forEach(q=>(groups[q.t]=groups[q.t]||[]).push(q));
      const keys=J.shuffle(Object.keys(groups)), out=[];
      while(out.length<n && keys.some(k=>groups[k].length)) for(const k of keys){ if(out.length>=n) break; const q=groups[k].shift(); if(q) out.push(q); }
      return J.shuffle(out).map(q=>({...q}));
    },
    quiz(st,host,again){
      const m=mode(), M=J.MODES[m], qs=C.pick(st.pool(m), m==='ramah'?3:M.n);
      J.Quiz.open({host,title:`Kuis ${st.short}`,questions:qs,mode:m,pass:M.pass,onDone:r=>{ J.Quiz.close(); C.result(st,host,r,again,()=>C.quiz(st,host,again)); }});
    },
    result(st,host,r,again,retryQuiz){
      const m=mode(), stars=r.pass?(r.pct>=.9?3:r.pct>=.65?2:1):0;
      const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'});
      const pctTxt = m==='ramah'?'':`<p>Benar ${J.fmt(r.score)} dari ${r.total} soal (${Math.round(r.pct*100)}%). Batas lulus ${Math.round(J.MODES[m].pass*100)}%.</p>`;
      if(r.pass){
        c.innerHTML=`<div class="medal-big">${J.scenes.medal[st.id]}</div><div class="kicker">Stasiun selesai</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][stars]} Kamu mendapat ${stars} bintang</h2>
          <div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>${pctTxt}<p class="msg">${st.name} selesai. Ayo lanjut ke stasiun berikutnya!</p><div class="row"></div>`;
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.map} Lanjut ke peta`); go.onclick=()=>{ S.page(); C.map(); };
        const re=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Ulangi kuis`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(go,re,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        C.award(st.id,stars); setTimeout(()=>{ S.win(); J.celebrate(120); },300);
      } else {
        c.innerHTML=`<div class="medal-big">${A.face(false)}</div><div class="kicker">Hampir berhasil</div><h2>Hampir tepat! Yuk kita dengarkan ceritanya lagi</h2>${pctTxt}
          <p class="msg">Tidak apa-apa. Baca lagi ceritanya pelan-pelan, lalu coba kuisnya sekali lagi. Kamu pasti bisa!</p><div class="row"></div>`;
        const rd=el('button',{class:'btn',type:'button'},`${J.ICON.book} Dengarkan cerita lagi`); rd.onclick=()=>{ S.page(); ov.remove(); again(); };
        const re=el('button',{class:'btn green',type:'button'},`${J.ICON.retry} Coba kuis lagi`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(rd,re,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        S.soft();
      }
      ov.appendChild(c); host.appendChild(ov);
      N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
      setTimeout(()=>{ const f=$('.btn',c); f&&f.focus({preventScroll:true}); },500);
    },

    /* ================= STASIUN 1: LAPISAN TANAH ================= */
    strata(st){
      const f=C.frame(st,'bab2-strata'), cards=st.cards[ramahM()?'ramah':mode()];
      const dio=App.diorama(f.host,'strata',{});
      f.host.appendChild(el('div',{class:'plate'},`<b>Sangiran – Bengawan Solo</b><span class="pt"> · Jawa</span>`));
      C.storyRunner(f,cards,c=>{ dio.setPhase(c.phase||0); dio.setCam(B.camL(c.phase||0)); },`${J.ICON.search} Ayo menggali`,()=>C.dig(st));
    },

    dig(st){
      const s=App.screen('bab2-dig'), ramah=ramahM(), m=mode();
      const items=B.FOSSILS.filter(x=> m==='ramah'?x.ramah : m==='beginner'?x.beginner : true);
      const wrap=el('div',{class:'digwrap'}), site=el('div',{class:'digsite'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 2 · Mini-game</span>
        <button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button></div>
        <h2>Gali Fosil</h2><div class="mission"><div class="msv"></div><div><span class="mtx">${ramah?'Sapu atau ketuk tanah yang menggunung. Temukan fosilnya!':'Sapu (geser) atau ketuk setiap gundukan tanah sampai fosilnya terlihat. Narator akan menyebut nama fosil dan lapisannya.'}</span> <span class="hs-count"></span></div></div>
        <div class="row rbtn"></div><div class="found-fossils" aria-live="polite"></div><div class="row nav" style="justify-content:flex-end"></div>`;
      $('.msv',card).innerHTML=A.icon.strata; $('.msv',card).style.cssText='width:56px;height:56px;flex:none';
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      $('.rbtn',card).appendChild(N.button(()=>({text:J.plain($('.mtx',card).innerHTML),el:$('.mission',card)}),'Bacakan'));
      side.appendChild(card); wrap.append(site,side); s.appendChild(wrap);
      const cv=el('canvas',{class:'dust'}); let found=0;
      const count=()=>{ $('.hs-count',card).textContent=`(${found} dari ${items.length} ditemukan)`; }; count();

      const build=()=>{
        const r=site.getBoundingClientRect(), portrait=r.width<700;
        const W=portrait?480:1000, H=Math.round(W*r.height/Math.max(1,r.width)), top=portrait?18:30, bands=[0.2,0.27,0.27,0.26].map(x=>x*(H-top));
        let y=top; const geo=[3,2,1,0].map((li,k)=>{ const g={li,y,h:bands[k]}; y+=bands[k]; return g; });
        let svg=`<svg class="dig-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="group" aria-label="Penampang empat lapisan tanah">
          <defs>${LY.map(l=>`<linearGradient id="dg_${l.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l.col[0]}"/><stop offset="1" stop-color="${l.col[1]}"/></linearGradient>`).join('')}</defs>
          <rect x="0" y="0" width="${W}" height="${top+6}" fill="url(#gGrass)"/>${Array.from({length:Math.round(W/40)},(_,k)=>`<path d="M${k*40+10} ${top+4} l4 -18 l4 18" fill="#5d8a3e"/>`).join('')}`;
        geo.forEach(g=>{ const l=LY[g.li];
          svg+=`<rect x="0" y="${g.y}" width="${W}" height="${g.h+1}" fill="url(#dg_${l.id})"/>`;
          svg+=Array.from({length:26},(_,k)=>`<ellipse cx="${(k*97+g.li*41)%W}" cy="${g.y+8+((k*53)%Math.max(8,g.h-16))}" rx="${3+k%4}" ry="${2+k%3}" fill="${l.dot}" opacity=".4"/>`).join('');
          svg+=`<path d="M0 ${g.y} ${Array.from({length:21},(_,k)=>`L${k*W/20} ${g.y+Math.sin(k*1.3+g.li)*3}`).join(' ')}" stroke="rgba(60,40,20,.35)" stroke-width="2" fill="none"/>`;
          svg+=`<g class="dlabel"><rect x="10" y="${g.y+8}" width="${((ramah?l.short:l.short+' · '+l.name).length+3)*(portrait?9.6:10.4)+24}" height="${portrait?30:34}" rx="12" fill="rgba(255,250,240,.92)"/><text x="22" y="${g.y+(portrait?29:31)}" font-size="${portrait?17:18}" font-weight="700" fill="#553923">${l.n}. ${ramah?l.short:l.short+' · '+l.name}</text></g>`;
        });
        items.forEach((it,k)=>{ const g=geo.find(x=>x.li===it.layer), row=items.filter(x=>x.layer===it.layer), j=row.indexOf(it);
          const slot=W/row.length, cx=slot*(j+.5), cy=g.y+g.h*.58, rr=Math.min(g.h*.36, slot*.36, 90);
          it._g={cx,cy,rr};
          svg+=`<g class="dig" data-i="${k}" tabindex="0" role="button" aria-label="Gundukan tanah di lapisan ${LY[it.layer].short}. Ketuk untuk menyapu.">
            <circle class="dhalo" cx="${cx}" cy="${cy}" r="${rr*1.15}"/>
            <ellipse cx="${cx}" cy="${cy+rr*.78}" rx="${rr*1.35}" ry="${rr*.16}" fill="rgba(40,25,10,.25)"/>
            ${[2,1,0].map(lv=>{ const k2=1-lv*.16, r2=rr*k2, by=cy+rr*.75, tone=['rgba(255,240,210,.22)','rgba(255,240,210,.08)','rgba(60,40,20,.12)'][lv];
              const d=`M${cx-r2*1.38} ${by} C${cx-r2*1.25} ${by-r2*.55} ${cx-r2*.95} ${by-r2*1.25} ${cx-r2*.45} ${by-r2*1.35} C${cx-r2*.2} ${by-r2*1.85} ${cx+r2*.35} ${by-r2*1.8} ${cx+r2*.55} ${by-r2*1.4} C${cx+r2*1} ${by-r2*1.3} ${cx+r2*1.3} ${by-r2*.6} ${cx+r2*1.38} ${by}Z`;
              return `<g class="dirt lv${lv}" style="transform-origin:${cx}px ${by}px"><path d="${d}" fill="url(#dg_${LY[it.layer].id})"/><path d="${d}" fill="${tone}"/>
                <path d="M${cx-r2*.9} ${by-r2*.9} C${cx-r2*.5} ${by-r2*1.25} ${cx} ${by-r2*1.4} ${cx+r2*.3} ${by-r2*1.35}" stroke="rgba(255,246,225,.45)" stroke-width="${rr*.07}" fill="none" stroke-linecap="round"/>
                ${[0,1,2,3,4].map(q=>`<ellipse cx="${cx+(q-2)*r2*.5}" cy="${by-r2*(.25+((q*7)%3)*.28)}" rx="${rr*.09}" ry="${rr*.06}" fill="${LY[it.layer].dot}" opacity=".55"/>`).join('')}</g>`; }).join('')}
            <g class="fos" transform="translate(${cx} ${cy}) scale(${(rr/74).toFixed(3)})">${A.fossil(it.art)}</g>
            <text class="fname" x="${Math.min(W-(portrait?70:150),Math.max(cx, portrait?70:150))}" y="${Math.min(cy+rr*1.18, g.y+g.h-6)}" text-anchor="middle" font-size="${portrait?14:17}" font-weight="700" fill="#2e2216">${ramah?it.simple.split(' ').slice(0,2).join(' '):(portrait?it.name.split(' ')[0]:it.name.split(' (')[0])}</text>
            <circle cx="${cx}" cy="${cy}" r="${rr*1.25}" fill="transparent"/></g>`;
        });
        svg+='</svg>';
        site.innerHTML=svg; site.appendChild(cv);
        J.$$('.dig',site).forEach(gEl=>{ const it=items[+gEl.dataset.i]; if(it._lv==null) it._lv=0; for(let q=0;q<it._lv;q++){ $('.dirt.lv'+q,gEl).classList.add('gone'); gEl.classList.add('l'+(q+1)); } if(it._lv>=3) gEl.classList.add('found'); hook(gEl,it); });
      };
      /* debu beterbangan */
      const P=[]; let raf=0;
      const dust=(x,y,col,n=16)=>{ const r=site.getBoundingClientRect(); for(let i=0;i<n;i++) P.push({x:x-r.left,y:y-r.top,vx:J.rand(-90,90),vy:J.rand(-160,-40),life:1,s:J.rand(2,6),c:col}); if(!raf) raf=requestAnimationFrame(tick); };
      let last=0; const tick=ts=>{ const r=site.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
        const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,r.width,r.height); const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts;
        for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=260*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.1; if(p.life<=0){P.splice(i,1);continue;} c.globalAlpha=p.life*.8; c.fillStyle=p.c; c.beginPath(); c.arc(p.x,p.y,p.s*(1.4-p.life*.4),0,7); c.fill(); }
        raf=P.length?requestAnimationFrame(tick):0; if(!raf){ last=0; c.clearRect(0,0,r.width,r.height); } };
      s._cleanup.push(()=>{ cancelAnimationFrame(raf); P.length=0; window.removeEventListener('resize',onRs); });

      const reveal=(gEl,it)=>{
        gEl.classList.add('found'); found++; count(); S.discover(); J.celebrate(18);
        const l=LY[it.layer];
        const t= ramah ? `${it.simple}! Dari lapisan ${l.short}.` : `Kamu menemukan ${it.name}: ${it.what}. Lapisan ${l.n}, ${l.name}, ${l.fauna}.`;
        const row=el('div',{class:'ffos'},`<span class="ic">${A.icon[it.icon]}</span><span><b>${ramah?it.simple:it.name}</b><small>Lapisan ${l.n} · ${l.short}</small></span>`);
        row.appendChild(N.button(()=>({text:t,el:row}),'Bacakan',true)); $('.found-fossils',card).prepend(row);
        say(t,row);
        if(found===items.length) setTimeout(allDone,1400);
      };
      const scrub=(gEl,it,x,y)=>{ if(it._lv>=3) return; const lv=it._lv++; const d=$('.dirt.lv'+lv,gEl); d.classList.add('gone'); gEl.classList.add('l'+it._lv); S.click();
        const b=gEl.getBoundingClientRect(); dust(x??b.left+b.width/2, y??b.top+b.height/2, LY[it.layer].col[0]); if(it._lv>=3) reveal(gEl,it); };
      const hook=(gEl,it)=>{
        let acc=0,lx=0,ly=0,down=false;
        gEl.addEventListener('pointerdown',e=>{ down=true; acc=0; lx=e.clientX; ly=e.clientY; try{gEl.setPointerCapture(e.pointerId);}catch(_){} scrub(gEl,it,e.clientX,e.clientY); e.preventDefault(); });
        gEl.addEventListener('pointermove',e=>{ if(!down) return; acc+=Math.hypot(e.clientX-lx,e.clientY-ly); lx=e.clientX; ly=e.clientY; if(acc>55){ acc=0; scrub(gEl,it,e.clientX,e.clientY); } });
        const up=()=>{ down=false; }; gEl.addEventListener('pointerup',up); gEl.addEventListener('pointercancel',up);
        gEl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); scrub(gEl,it); } });
      };
      const allDone=()=>{
        S.win(); J.celebrate(120);
        const nav=$('.nav',card); nav.innerHTML='';
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,s,()=>C.strata(st)); };
        nav.appendChild(q); say('Hebat! Semua fosil sudah ditemukan. Sekarang, ayo kerjakan kuis.',q); q.focus({preventScroll:true});
      };
      let rsT; const onRs=()=>{ clearTimeout(rsT); rsT=setTimeout(build,250); }; window.addEventListener('resize',onRs);
      requestAnimationFrame(()=>requestAnimationFrame(build));
      N.autoSeq([{text:'Gali fosil. '+J.plain($('.mtx',card).innerHTML),el:$('.mission',card)}]);
    },

    /* ================= STASIUN 2: BANDINGKAN TENGKORAK ================= */
    stage(host){
      host.classList.add('skull-stage'); host.innerHTML='';
      const types=['mega','pithe','homo'];
      types.forEach(t=>{ const d=B.SKULLS[t];
        const c=el('button',{class:'skull-card',type:'button','data-sk':t,'aria-label':d.name},`${A.skullBox(t)}<span class="pedestal"></span><span class="sk-name">${d.name}</span><span class="sk-val"></span>`);
        host.appendChild(c); });
      return host;
    },
    anatomi(st){
      const f=C.frame(st,'bab2-anatomi'), cards=st.cards[ramahM()?'ramah':mode()], stage=C.stage(f.host);
      const set=(focus,ft)=>{ stage.dataset.focus=focus||''; stage.dataset.ft=ft||''; };
      C.storyRunner(f,cards,c=>set(c.focus,c.ft),ramahM()?`${J.ICON.play} Ayo main`:`${J.ICON.search} Masuk lab tengkorak`,()=> ramahM()?C.challenge(st,f,stage):C.lab(st,f,stage));
      J.$$('.skull-card',stage).forEach(b=>b.onclick=()=>{ if(stage.classList.contains('pick')) return; const d=B.SKULLS[b.dataset.sk]; S.click(); say(ramahM()?`${d.name}. ${d.simple}.`:`${d.full}. Tinggi ${d.tinggi}. Volume otak ${d.otak}. ${d.dagu}.`,b); });
    },
    lab(st,f,stage){
      const m=mode(), seen=new Set();
      f.story.innerHTML=''; f.nav.innerHTML=''; stage.dataset.focus='';
      const intro=el('p',{class:'txt'},'Ketuk setiap ciri. Bagian tengkorak akan bersinar dan narator menjelaskan perbedaannya.');
      const grid=el('div',{class:'ftbtns'}), info=el('div',{class:'ftinfo'});
      f.story.append(intro,N.button(()=>({text:J.plain(intro.innerHTML),el:intro}),'Bacakan'),grid,info);
      B.FEATURES.forEach(ft=>{ const b=el('button',{class:'ftbtn',type:'button'},`<span>${ft.label}</span>`);
        b.onclick=()=>{ S.click(); seen.add(ft.id); J.$$('.ftbtn',grid).forEach(x=>x.classList.remove('on')); b.classList.add('on','seen');
          stage.dataset.ft=ft.id==='tinggi'?'':ft.id;
          J.$$('.skull-card',stage).forEach(c=>{ const d=B.SKULLS[c.dataset.sk]; $('.sk-val',c).textContent=d[ft.id]; c.classList.add('show-val'); });
          info.innerHTML=''; if(ft.id==='otak'||ft.id==='tinggi') info.appendChild(C.bars(ft.id));
          const p=el('p',{class:'ftsay'},ft.say[m]); info.appendChild(p); say(ft.say[m],p);
          if(seen.size===B.FEATURES.length && !$('[data-act=ch]',f.nav)){ const go=el('button',{class:'btn green big',type:'button','data-act':'ch'},`${J.ICON.play} Tantangan`); go.onclick=()=>{ S.page(); C.challenge(st,f,stage); }; f.nav.appendChild(go); S.discover(); }
        }; grid.appendChild(b); });
      N.autoSeq([{text:J.plain(intro.innerHTML),el:intro}]);
    },
    bars(kind){
      const d=B.SKULLS, max=kind==='otak'?1500:270, unit=kind==='otak'?'cc':'cm', key=kind==='otak'?'otakR':'tinggiR';
      const w=el('div',{class:'bars','aria-hidden':'true'});
      w.innerHTML=['mega','pithe','homo'].map(t=>{ const [a,b]=d[t][key]; return `<div class="bar"><span class="bl">${d[t].name}</span><span class="bt"><i style="left:${a/max*100}%;width:${(b-a)/max*100}%"></i></span><span class="bv">${d[t][kind]}</span></div>`; }).join('')+`<div class="bax"><span>0</span><span>${max} ${unit}</span></div>`;
      return w;
    },
    challenge(st,f,stage){
      const rounds=J.shuffle(B.challenge[ramahM()?'ramah':'other']); let k=0, miss=0;
      f.nav.innerHTML=''; stage.dataset.ft=''; stage.dataset.focus=''; stage.classList.add('pick');
      J.$$('.skull-card',stage).forEach(c=>c.classList.remove('show-val'));
      const ask=()=>{
        const r=rounds[k]; f.story.innerHTML='';
        const head=el('div',{class:'kicker'},`Tantangan ${k+1} dari ${rounds.length}`), p=el('p',{class:'txt'},r.q), fb=el('div',{class:'fb','aria-live':'polite'});
        f.story.append(head,p,N.button(()=>({text:r.q,el:p}),'Dengarkan lagi'),fb);
        N.autoSeq([{text:r.q,el:p}]);
        J.$$('.skull-card',stage).forEach(c=>{ c.classList.remove('ok','no'); c.onclick=()=>{
          if(c.dataset.sk===r.a){ S.ok(); c.classList.add('ok'); stage.dataset.focus=r.a; J.celebrate(30);
            const d=B.SKULLS[r.a]; fb.className='fb show ok'; fb.innerHTML=`${A.face(true)}<div class="body"><h4>Tepat! Itu ${d.name}.</h4></div>`; say(`Tepat! Itu ${d.name}.`,fb);
            J.$$('.skull-card',stage).forEach(x=>x.onclick=null);
            setTimeout(()=>{ stage.dataset.focus=''; k++; k<rounds.length?ask():end(); },1900);
          } else { miss++; S.soft(); c.classList.remove('no'); void c.offsetWidth; c.classList.add('no');
            fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><h4>Hampir tepat!</h4><p style="margin:0">Yuk kita dengarkan petunjuknya lagi. <b>${r.hint}</b></p></div>`;
            say('Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+r.hint,fb); } }; });
      };
      const end=()=>{ stage.classList.remove('pick'); J.$$('.skull-card',stage).forEach(x=>x.onclick=null);
        f.story.innerHTML=''; const p=el('p',{class:'txt'},'Hebat! Kamu sudah mengenali ketiga tengkorak. Sekarang, ayo kerjakan kuis.'); f.story.append(p);
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,f.s,()=>C.anatomi(st)); };
        f.nav.innerHTML=''; f.nav.appendChild(q); S.win(); say(J.plain(p.innerHTML),p); };
      ask();
    },

    /* ================= STASIUN 3: KELOMPOKKAN FOSIL ================= */
    susun(st){
      const s=App.screen('bab2-susun','contour'), ramah=ramahM(), m=mode();
      let deck = m==='ramah'? B.FOSSILS.filter(x=>x.ramah) : m==='beginner'? B.FOSSILS.filter(x=>x.beginner) : J.shuffle(B.FOSSILS).slice(0,8);
      deck=J.shuffle(deck); let k=0, miss=0;
      const HINT={jetis:'Lapisan paling bawah dan paling tua: tempat manusia purba raksasa dan harimau gigi pedang.',
        trinil:'Lapisan kedua, tempat Dubois menemukan Pithecanthropus erectus tahun 1891, bersama gajah Stegodon.',
        ngandong:'Lapisan ketiga di tepi Bengawan Solo: tempat Homo soloensis dan rusa purba.',
        holosen:'Lapisan paling atas, tempat manusia modern seperti kita.'};
      const w=el('div',{class:'sort-wrap'});
      const head=el('div',{class:'card paper'});
      head.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 2 · Mini-game penutup</span>
        <button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button></div>
        <h2 style="margin:.1em 0">Kelompokkan Fosil</h2><p class="ins" style="margin:0">${ramah?'Lihat gambarnya. Ketuk lapisan tempat fosil itu ditemukan.':'Masukkan setiap fosil ke lapisan tanah tempat ia ditemukan. Ketuk lapisan yang tepat.'}</p>`;
      $('[data-act=map]',head).onclick=()=>{ S.click(); C.map(); };
      head.appendChild(N.button(()=>({text:J.plain($('.ins',head).innerHTML),el:$('.ins',head)}),'Bacakan'));
      const area=el('div',{class:'sort-area'}), bins=el('div',{class:'bins'}), cardBox=el('div',{class:'sort-card card paper'});
      [3,2,1,0].forEach(li=>{ const l=LY[li]; const b=el('button',{class:'bin',type:'button','data-l':li,style:`--c1:${l.col[0]};--c2:${l.col[1]}`},`<span class="bn">${l.n}</span><span class="bt"><b>${l.short}</b>${ramah?'':`<small>${l.name}</small>`}</span><span class="chips"></span>`); bins.appendChild(b); });
      area.append(cardBox,bins); w.append(head,area); s.appendChild(w);
      const fb=el('div',{class:'fb','aria-live':'polite'});
      const show=()=>{ const it=deck[k];
        cardBox.innerHTML=`<div class="kicker">Fosil ${k+1} dari ${deck.length}</div><div class="sc-ic">${A.icon[it.icon]}</div><h3>${ramah?it.simple:it.name}</h3>`;
        cardBox.appendChild(N.button(()=>({text:ramah?it.simple:`${it.name}. ${it.what}.`,el:cardBox}),'Bacakan')); cardBox.appendChild(fb); fb.className='fb';
        cardBox.classList.remove('enter'); void cardBox.offsetWidth; cardBox.classList.add('enter');
        N.autoSeq([{text:(ramah?it.simple:it.name)+'. Ada di lapisan mana?',el:cardBox}]);
      };
      J.$$('.bin',bins).forEach(b=>b.onclick=()=>{ const it=deck[k]; if(!it) return;
        if(+b.dataset.l===it.layer){ S.ok(); const ch=el('span',{class:'chip2'},A.icon[it.icon]); $('.chips',b).appendChild(ch); b.classList.remove('good'); void b.offsetWidth; b.classList.add('good');
          say(`Benar! ${ramah?it.simple:it.name} dari lapisan ${LY[it.layer].short}.`); k++; if(k<deck.length) setTimeout(show,1200); else setTimeout(done,1300);
        } else { miss++; S.soft(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          const t='Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+HINT[LY[it.layer].id]; fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><p style="margin:0">${t}</p></div>`; say(t,fb); } });
      const done=()=>{
        const stars=miss===0?3:miss<=2?2:1; C.award('susun',stars); S.win(); J.celebrate(140);
        const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'},`<div class="medal-big">${A.icon.sortLayers}</div><div class="kicker">Semua fosil tersusun</div>
          <h2>Hebat! Semua fosil sudah di lapisannya</h2><div class="stars">${[1,2,3].map(q=>J.star(stars>=q)).join('')}</div>
          <p class="msg">Dari bawah ke atas: Jetis, Trinil, Ngandong, lalu Holosen. Kamu sudah menyelesaikan Bab 2!</p><div class="row"></div>`);
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.check} Lihat sertifikat Bab 2`); go.onclick=()=>{ S.page(); C.complete(); };
        $('.row',c).append(go,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        ov.appendChild(c); s.appendChild(ov); N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
      };
      show();
    },

    complete(){
      const s=App.screen('bab2-done','contour'), p=C.p(), total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      const c=el('div',{class:'card paper result'},`<div class="medal-big">${A.icon.compare}</div><div class="kicker">Sertifikat Penjelajah</div>
        <h2>Bab 2 "Lapisan Tanah &amp; Manusia Purba" selesai!</h2><div class="stars">${J.star(true)}</div><p><b>${total}</b> dari ${ST.length*3} bintang · Mode ${J.MODES[mode()].name}</p>
        <p class="msg">Kamu sudah menggali empat lapisan tanah Jawa dan membandingkan tengkorak Meganthropus, Pithecanthropus, dan Homo. Lanjutkan ke Bab 3 "Cara Hidup &amp; Alat Batu–Logam".</p><div class="row"></div>`);
      const m=el('button',{class:'btn',type:'button'},`${J.ICON.map} Kembali ke peta`); m.onclick=()=>{ S.click(); C.map(); };
      const n3=el('button',{class:'btn green',type:'button'},`Lanjut ke Bab 3 ${J.ICON.next}`); n3.onclick=()=>{ S.page(); App.openChapter('bab3'); };
      $('.row',c).append(n3,m,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
      const wr=el('div',{class:'center'}); wr.appendChild(c); s.appendChild(wr); S.win(); J.celebrate(160);
      N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
    }
  };
})(window.JPA);

</script>
<script>
/* Bab 3 "Cara Hidup & Alat Batu–Logam": peta → (1) diorama 4 corak kehidupan + kuis → (2) ruang pamer zaman batu + Bengkel Asah Batu + kuis
   → (3) Cocokkan Era & Kehidupan (beri alat yang tepat untuk diorama). */
(function(J){
  const N=J.narrator, S=J.sfx, A=J.art, App=J.App, $=J.$, el=J.el, B=J.BAB3;
  const ST=B.stations, POS=[[16,64],[50,30],[84,64]];
  const ramahM=()=>App.st.mode==='ramah', mode=()=>App.st.mode;
  const say=(t,e)=>N.say(t,e);
  const mapBtn=`<button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button>`;

  const C = J.chapters.bab3 = {
    p(){ return App.prog('bab3'); },
    isDone(){ return ST.every(s=>C.p().stars[s.id]!=null); },
    nextIdx(){ const i=ST.findIndex(s=>C.p().stars[s.id]==null); return i<0?ST.length:i; },
    award(id,stars){ const p=C.p(); p.stars[id]=Math.max(p.stars[id]||0,stars); App.save(); App.topbar(); },

    /* ================= PETA ================= */
    map(){
      const s=App.screen('bab3-map','contour'), p=C.p(), nx=C.nextIdx(), ramah=ramahM();
      const wrap=el('div',{class:'mapwrap'}), head=el('div',{class:'card paper maphead'});
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      head.innerHTML=`<div><div class="kicker">Bab 3 · Ruang Pameran Ketiga</div><h2>Cara Hidup &amp; Alat Batu–Logam</h2>
        <p class="lead">${ramah?'Ayo lihat cara hidup manusia purba dan alat-alatnya!':'Ikuti empat tahap corak kehidupan, asah batu dari kasar sampai mengilap, lalu bantu manusia purba memilih alat yang tepat.'}</p></div>`;
      const right=el('div',{class:'row'});
      const mc=el('button',{class:'mode-chip',type:'button'},`${J.ICON.book} Mode ${J.MODES[mode()].name}`); mc.onclick=()=>{S.click();App.openModes();};
      right.append(el('span',{class:'chip'},`${J.star(true)} <span>${total} / ${ST.length*3} bintang</span>`), mc,
        N.button(()=>[{text:'Bab 3. Cara Hidup dan Alat Batu sampai Logam.',el:$('h2',head)},{text:J.plain($('.lead',head).innerHTML),el:$('.lead',head)}],'Bacakan'));
      head.appendChild(right); wrap.appendChild(head);
      const map=el('div',{class:'map'});
      const pth=pts=>pts.map(([x,y],i)=>i?`S ${(pts[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      map.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="${pth(POS)}" fill="none" stroke="#e6d0a8" vector-effect="non-scaling-stroke" style="stroke-width:16px" stroke-linecap="round"/>
        <path d="${pth(POS)}" fill="none" stroke="#fffaf0" stroke-dasharray="2 8" vector-effect="non-scaling-stroke" style="stroke-width:4px" stroke-linecap="round"/>
        ${nx>0?`<path d="${pth(POS.slice(0,Math.min(nx+1,3)))}" fill="none" stroke="#d9a441" vector-effect="non-scaling-stroke" style="stroke-width:6px" stroke-linecap="round" opacity=".85"/>`:''}</svg>`;
      ST.forEach((st,i)=>{
        const done=p.stars[st.id]!=null, open=i<=nx, next=i===nx;
        const b=el('button',{class:'station'+(done?' done':'')+(open?' open':' locked')+(next?' next':''),type:'button',style:`left:${POS[i][0]}%;top:${POS[i][1]}%`,'aria-label':`${st.name}. ${done?'Selesai':open?'Terbuka':'Terkunci'}`},
          `<span class="medal">${J.scenes.medal[st.id]}${done?`<span class="badge">${J.ICON.check}</span>`:''}${!open?`<span class="lock">${J.ICON.lock}</span>`:''}</span>
           <span>${ramah?st.short:st.name}</span><small>${st.time}</small><span class="stars">${[1,2,3].map(k=>J.star(done&&p.stars[st.id]>=k)).join('')}</span>`);
        const lk=$('.lock svg',b); if(lk) lk.style.cssText='width:44px;height:44px;color:#6a5340';
        const bd=$('.badge svg',b); if(bd) bd.style.cssText='width:22px;height:22px';
        b.onclick=()=>{ if(!open){ S.soft(); J.toast('Selesaikan stasiun sebelumnya dulu, ya.'); say('Selesaikan stasiun sebelumnya dulu, ya.'); return; }
          S.page(); ({hidup:C.hidup,batu:C.batu,cocok:C.cocok})[st.id](st); };
        map.appendChild(b);
      });
      wrap.appendChild(map);
      if(C.isDone()){ const r=el('div',{class:'row',style:'justify-content:center;margin-top:10px'}); const b=el('button',{class:'btn green',type:'button'},`${J.ICON.check} Bab 3 selesai! Lihat sertifikat`); b.onclick=()=>{S.click();C.complete();}; r.appendChild(b); wrap.appendChild(r); }
      s.appendChild(wrap); S.ambience(null);
      N.autoSeq([{text: nx<ST.length?`Bab 3, Cara Hidup dan Alat Batu sampai Logam. Stasiun berikutnya: ${ST[nx].short}.`:'Bab 3 selesai. Hebat!',el:head}]);
      setTimeout(()=>{ const f=$('.station.next',map); f&&f.focus({preventScroll:true}); },700);
    },

    frame(st,id){
      const s=App.screen(id), grid=el('div',{class:'era'}), host=el('div'), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 3 · ${st.time}</span>${mapBtn}</div>
        <h2>${st.name}</h2><div class="story"></div><div class="navrow"><div class="dots" aria-hidden="true"></div><div class="row nav"></div></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); grid.append(host,side); s.appendChild(grid);
      return {s,host,card,story:$('.story',card),dots:$('.dots',card),nav:$('.nav',card)};
    },
    storyRunner(...a){ return J.chapters.bab2.storyRunner(...a); },
    pick(pool,n){ return J.chapters.bab2.pick(pool,n); },
    quiz(st,host,again){
      const m=mode(), M=J.MODES[m], qs=C.pick(st.pool(m), m==='ramah'?3:M.n);
      J.Quiz.open({host,title:`Kuis ${st.short}`,questions:qs,mode:m,pass:M.pass,onDone:r=>{ J.Quiz.close(); C.result(st,host,r,again,()=>C.quiz(st,host,again)); }});
    },
    result(st,host,r,again,retryQuiz){
      const m=mode(), stars=r.pass?(r.pct>=.9?3:r.pct>=.65?2:1):0;
      const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'});
      const pctTxt = m==='ramah'?'':`<p>Benar ${J.fmt(r.score)} dari ${r.total} soal (${Math.round(r.pct*100)}%). Batas lulus ${Math.round(J.MODES[m].pass*100)}%.</p>`;
      if(r.pass){
        c.innerHTML=`<div class="medal-big">${J.scenes.medal[st.id]}</div><div class="kicker">Stasiun selesai</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][stars]} Kamu mendapat ${stars} bintang</h2>
          <div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>${pctTxt}<p class="msg">${st.name} selesai. Ayo lanjut ke stasiun berikutnya!</p><div class="row"></div>`;
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.map} Lanjut ke peta`); go.onclick=()=>{ S.page(); C.map(); };
        const re=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Ulangi kuis`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(go,re,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        C.award(st.id,stars); setTimeout(()=>{ S.win(); J.celebrate(120); },300);
      } else {
        c.innerHTML=`<div class="medal-big">${A.face(false)}</div><div class="kicker">Hampir berhasil</div><h2>Hampir tepat! Yuk kita dengarkan ceritanya lagi</h2>${pctTxt}
          <p class="msg">Tidak apa-apa. Dengarkan lagi ceritanya pelan-pelan, lalu coba kuisnya sekali lagi. Kamu pasti bisa!</p><div class="row"></div>`;
        const rd=el('button',{class:'btn',type:'button'},`${J.ICON.book} Dengarkan cerita lagi`); rd.onclick=()=>{ S.page(); ov.remove(); again(); };
        const re=el('button',{class:'btn green',type:'button'},`${J.ICON.retry} Coba kuis lagi`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(rd,re,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        S.soft();
      }
      ov.appendChild(c); host.appendChild(ov);
      N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
      setTimeout(()=>{ const f=$('.btn',c); f&&f.focus({preventScroll:true}); },500);
    },

    /* kamera diorama melalui viewBox: fase 0 utuh, fase n menyorot zona ke-n (pas di layar lebar maupun HP) */
    zoomer(host,dio,cy){
      const svg=J.$('svg.scene',host); let cur=[0,0,1600,900], raf=0;
      J.$('.cam',host).style.transform='none';
      const target=n=>{ const r=host.getBoundingClientRect(), asp=Math.max(.4,r.height/Math.max(1,r.width));
        if(!n) return [0,0,1600,900];
        /* tampilkan seluruh zona (lebar 400, tinggi zh) dengan ruang tepi, ditambah kelebihan 12% untuk efek paralaks */
        const zh=cy?600:600, zc=cy?cy:590; let w=Math.max(400*1.3, zh*1.12/asp); w=Math.min(1600,w); let h=Math.min(900,w*asp);
        const cx=(n-1)*400+200, x=Math.max(0,Math.min(1600-w,cx-w/2)), y=Math.max(0,Math.min(900-h,zc-h/2)); return [x,y,w,h]; };
      const go=n=>{ const to=target(n), from=cur.slice(), t0=performance.now(), D=1100; cancelAnimationFrame(raf);
        svg.setAttribute('preserveAspectRatio','xMidYMid slice');
        const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); cur=from.map((v,i)=>v+(to[i]-v)*e); svg.setAttribute('viewBox',cur.map(v=>v.toFixed(1)).join(' ')); if(k<1) raf=requestAnimationFrame(step); };
        raf=requestAnimationFrame(step); dio.setPhase(n); };
      return go;
    },
    /* ================= STASIUN 1: CORAK KEHIDUPAN ================= */
    hidup(st){
      const f=C.frame(st,'bab3-hidup'), cards=st.cards[ramahM()?'ramah':mode()];
      const dio=App.diorama(f.host,'hidup',{});
      f.host.appendChild(el('div',{class:'plate low'},`<b>Diorama Corak Kehidupan</b><span class="pt"> · Nusantara</span>`));
      const go=C.zoomer(f.host,dio); C.storyRunner(f,cards,c=>go(c.phase||0),`${J.ICON.play} Mulai kuis`,()=>C.quiz(st,f.s,()=>C.hidup(st)));
    },

    /* ================= STASIUN 2: ZAMAN BATU + BENGKEL ASAH ================= */
    batu(st){
      const f=C.frame(st,'bab3-batu'), cards=st.cards[ramahM()?'ramah':mode()];
      const dio=App.diorama(f.host,'batu',{});
      f.host.appendChild(el('div',{class:'plate low'},`<b>Ruang Pamer Zaman Batu</b><span class="pt"> · Museum</span>`));
      const go=C.zoomer(f.host,dio,440); C.storyRunner(f,cards,c=>go(c.phase||0),`${J.ICON.play} Masuk Bengkel Asah`,()=>C.whet(st));
    },

    whet(st){
      const s=App.screen('bab3-whet'), ramah=ramahM(), m=mode(), W=B.whet[m];
      const wrap=el('div',{class:'digwrap'}), site=el('div',{class:'whetsite'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 3 · Mini-game</span>${mapBtn}</div>
        <h2>Bengkel Asah Batu</h2><div class="mission"><div class="msv"></div><div><span class="mtx">${W.ins}</span></div></div>
        <div class="row rbtn"></div><div class="whet-steps"></div><p class="ftsay whet-say" aria-live="polite"></p><div class="row nav" style="justify-content:flex-end"></div>`;
      $('.msv',card).innerHTML=A.icon.t_perimbas; $('.msv',card).style.cssText='width:56px;height:56px;flex:none';
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      $('.rbtn',card).appendChild(N.button(()=>({text:J.plain($('.mtx',card).innerHTML),el:$('.mission',card)}),'Bacakan'));
      const steps=$('.whet-steps',card);
      B.WHET_STAGES.forEach((w,i)=>{ const r=el('div',{class:'wstep'+(i===0?' on':''),'data-i':i},`<span class="ic">${A.icon[w.icon]}</span><span><b>${ramah?['Batu kasar','Tajam satu sisi','Halus mengilap'][i]:w.name}</b><small>${ramah?['Zaman Batu Tua','Zaman Batu Tengah','Zaman Batu Muda'][i]:['Dipangkas, tidak diasah','Diasah di sisi tajam','Diasah seluruhnya'][i]}</small></span>`);
        r.appendChild(N.button(()=>({text:W.st[i],el:r}),'Bacakan',true)); steps.appendChild(r); });
      site.innerHTML=`<svg class="whet-svg" viewBox="-220 -150 440 300" role="img" aria-label="Batu yang sedang diasah di atas batu asah">
          <defs><linearGradient id="gBench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6b44"/><stop offset="1" stop-color="#6e4a2a"/></linearGradient>
          <linearGradient id="gWhet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb08a"/><stop offset="1" stop-color="#9c7c58"/></linearGradient></defs>
          <rect x="-240" y="70" width="480" height="120" fill="url(#gBench)"/><path d="M-240 70 L240 70" stroke="#5a3a22" stroke-width="4"/>
          <path d="M-190 72 C-190 40 190 40 190 72 L176 96 L-176 96Z" fill="url(#gWhet)" stroke="#4a3a2c" stroke-width="3"/>
          <path class="wet" d="M-150 52 C-60 44 60 44 150 52" stroke="#bfe0ee" stroke-width="10" fill="none" opacity=".0" stroke-linecap="round"/>
          ${Array.from({length:14},(_,k)=>`<circle cx="${-160+k*24}" cy="${58+(k%3)*6}" r="${1.5+k%2}" fill="#7a5c3e" opacity=".5"/>`).join('')}
          <g class="rub"><g transform="translate(0 0) scale(1.45)">${A.whetStone()}</g></g>
          <g class="drops">${[[-170,110],[160,118],[-120,140]].map(([x,y])=>`<path d="M${x} ${y} c-6 8 -6 14 0 14 c6 0 6 -6 0 -14z" fill="#9cc6cf" opacity=".8"/>`).join('')}</g>
        </svg><div class="whet-bar" aria-hidden="true"><i></i><span style="left:33.3%"></span><span style="left:66.6%"></span></div>
        <div class="whet-hint">${J.ICON.next} ${ramah?'Gosok di sini':'Gesek ke kiri dan kanan'}</div>`;
      site.setAttribute('tabindex','0'); site.setAttribute('role','button'); site.setAttribute('aria-label','Batu yang diasah. Gesek atau tekan Enter untuk mengasah.');
      side.appendChild(card); wrap.append(site,side); s.appendChild(wrap);
      const cv=el('canvas',{class:'dust'}); site.appendChild(cv);
      const rub=$('.rub',site), bar=$('.whet-bar i',site), svg=$('svg',site), sayEl=$('.whet-say',card);
      let prog=0, stage=0, done=false, off=0, lastSnd=0;
      svg.dataset.st='0';
      const P=[]; let raf=0, last=0;
      const dust=(x,y,n,col)=>{ const r=site.getBoundingClientRect(); for(let i=0;i<n;i++) P.push({x:x-r.left,y:y-r.top,vx:J.rand(-110,110),vy:J.rand(-140,-30),life:1,s:J.rand(1.5,4.5),c:col}); if(!raf) raf=requestAnimationFrame(tick); };
      const tick=ts=>{ const r=site.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
        const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,r.width,r.height); const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts;
        for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=240*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.2; if(p.life<=0){P.splice(i,1);continue;} c.globalAlpha=p.life*.8; c.fillStyle=p.c; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); }
        raf=P.length?requestAnimationFrame(tick):0; if(!raf){ last=0; c.clearRect(0,0,r.width,r.height); } };
      s._cleanup.push(()=>{ cancelAnimationFrame(raf); P.length=0; });
      const setStage=k=>{ stage=k; svg.dataset.st=String(k); J.$$('.wstep',steps).forEach((r,i)=>{ r.classList.toggle('on',i===k); r.classList.toggle('seen',i<k); });
        sayEl.textContent=W.st[k]; say(W.st[k],sayEl); if(k>0){ S.discover(); J.celebrate(26); } };
      const add=(d,x,y)=>{ if(done) return; prog=Math.min(1,prog+d); bar.style.width=(prog*100)+'%';
        $('.wet',svg).style.opacity=String(.25+prog*.5);
        const now=performance.now(); if(now-lastSnd>140){ lastSnd=now; S.scrape(prog); }
        const b=rub.getBoundingClientRect(); dust(x??b.left+b.width/2, y??b.bottom-10, 5, prog<.34?'#9a8c78':prog<.67?'#c9bfae':'#e8f1ea');
        const k=prog<.34?0:prog<.67?1:2; if(k>stage) setStage(k);
        if(prog>=1){ done=true; finish(); } };
      const need = ramah?1500:2200;
      let down=false, lx=0, ly=0, moved=0;
      site.addEventListener('pointerdown',e=>{ down=true; moved=0; lx=e.clientX; ly=e.clientY; try{site.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); site.classList.add('active'); });
      site.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; const d=Math.hypot(dx,dy); moved+=d;
        off=Math.max(-60,Math.min(60,off+dx*.6)); rub.style.transform=`translate(${off}px,0) rotate(${off*.04}deg)`; if(d>2) add(d/need,e.clientX,e.clientY); });
      const up=e=>{ if(!down) return; down=false; site.classList.remove('active'); if(moved<8) { add(.06,e.clientX,e.clientY); off=off>0?-16:16; rub.style.transform=`translate(${off}px,0)`; } };
      site.addEventListener('pointerup',up); site.addEventListener('pointercancel',up);
      site.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); off=off>0?-24:24; rub.style.transform=`translate(${off}px,0)`; add(.08); } });
      const finish=()=>{
        S.win(); J.celebrate(120); svg.classList.add('shine');
        const nav=$('.nav',card); nav.innerHTML='';
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,s,()=>C.batu(st)); };
        nav.appendChild(q);
        setTimeout(()=>say(ramah?'Hebat! Batunya sudah halus. Ayo main kuis.':'Hebat! Kamu sudah mengasah batu dari kasar sampai mengilap. Sekarang, ayo kerjakan kuis.',q),2600);
        q.focus({preventScroll:true});
      };
      N.autoSeq([{text:'Bengkel Asah Batu. '+W.ins,el:$('.mission',card)},{text:W.st[0],el:steps.firstChild}]);
      sayEl.textContent=W.st[0];
    },

    /* ================= STASIUN 3: COCOKKAN ERA & KEHIDUPAN ================= */
    cocok(st){
      const s=App.screen('bab3-cocok','contour'), ramah=ramahM(), m=mode();
      const nOpt = ramah?2 : m==='hard'?4 : 3;
      const rounds = ramah? B.ROUNDS.filter(r=>r.ramah) : B.ROUNDS;
