      <linearGradient id="gWingU" gradientUnits="userSpaceOnUse" x1="20" y1="-6" x2="-44" y2="-156"><stop offset="0" stop-color="#d98a5a"/><stop offset=".5" stop-color="#eeb287"/><stop offset="1" stop-color="#f6c9a2"/></linearGradient>
      ${['G#2b4626#3','B#4a2a14#3','P#6e3018#1.8'].map(t=>{const [k,c,r]=t.split('#');return `<filter id="fInk${k}" x="-15%" y="-15%" width="130%" height="135%"><feMorphology in="SourceAlpha" operator="dilate" radius="${r}" result="d"/><feFlood flood-color="#${c}"/><feComposite in2="d" operator="in" result="o"/><feGaussianBlur in="d" stdDeviation="6" result="b"/><feOffset in="b" dy="8" result="bo"/><feFlood flood-color="#2a1a0c" flood-opacity=".22"/><feComposite in2="bo" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`}).join('')}
      <filter id="fSoft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a1a0c" flood-opacity=".28"/></filter>
      <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="fBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="fHaze"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs></svg>`;
    document.body.insertAdjacentHTML('afterbegin',svg);
  };

  const eye = (x,y,r=5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#20150c"/><circle cx="${x+r*.35}" cy="${y-r*.35}" r="${r*.38}" fill="#fff"/>`;

  /* ---------- Hewan Mesozoikum ---------- */
  /* Rig animasi SMIL: rotasi/skala di sekitar titik sendi dalam koordinat lokal hewan (tetap menyatu saat bergerak). */
  const SPL = n => Array(n).fill('.45 0 .55 1').join(';');
  const rot = (vals,dur,cx,cy,begin=0) => `<animateTransform attributeName="transform" type="rotate" values="${vals.map(v=>`${v} ${cx} ${cy}`).join(';')}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keySplines="${SPL(vals.length-1)}"/>`;
  const bob = (vals,dur,begin=0) => `<animateTransform attributeName="transform" type="translate" values="${vals.map(v=>`0 ${v}`).join(';')}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keySplines="${SPL(vals.length-1)}"/>`;

  /* ---------- Sauropoda (leher panjang): satu siluet utuh dengan garis tepi menyatu ---------- */
  A.sauropod = (x,y,s=1,flip=false,cls='') => {
    const leg = (dx,fill,far) => `<path d="M${-22+dx} -140 C${-26+dx} -100 ${-20+dx} -50 ${-22+dx} -10 Q${-22+dx} 2 ${-10+dx} 2 L${22+dx} 2 Q${34+dx} 2 ${32+dx} -10 C${30+dx} -50 ${34+dx} -100 ${38+dx} -140 Z" fill="${fill}"/>
      ${far?'':`<path d="M${-14+dx} -2 q5 -7 10 0 M${-1+dx} -2 q5 -7 10 0 M${12+dx} -2 q5 -7 10 0" stroke="#e9e2c4" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M${-16+dx} -120 C${-18+dx} -80 ${-14+dx} -40 ${-14+dx} -14" stroke="#9cc27a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".35"/>`}`;
    const walk = (dx,ph,far) => `<g>${rot([6,-6,6],2.4,dx+8,-140,ph)}${leg(dx,far?'#2f5230':'url(#gSauroU)',far)}</g>`;
    return `<g transform="${T(x,y,s,flip)}"><g class="${cls}"><ellipse cx="-10" cy="4" rx="190" ry="14" fill="#2a1a0c" opacity=".18"/>
    <g filter="url(#fInkG)">${bob([0,-4,0,-4,0],2.4)}
      ${walk(-72,-1.2,true)}${walk(112,0,true)}
      <g>${rot([-4,5,-4],3.6,-120,-140)}<path d="M-110 -196 C-190 -196 -282 -156 -392 -66 C-382 -60 -372 -60 -360 -64 C-280 -100 -196 -112 -112 -98 Z" fill="url(#gSauroU)"/>
        <path d="M-130 -188 C-210 -180 -290 -140 -370 -78" stroke="#a7cf86" stroke-width="5" fill="none" stroke-linecap="round" opacity=".45"/></g>
      <g>${rot([2,-5,3,2],6,118,-168)}
        <path d="M66 -200 C116 -232 170 -292 212 -330 C226 -342 246 -348 264 -344 C288 -340 302 -328 300 -316 C298 -304 278 -300 258 -302 C242 -303 230 -298 222 -290 C192 -250 166 -186 150 -112 C120 -122 88 -150 66 -200 Z" fill="url(#gSauroU)"/>
        <path d="M200 -280 C180 -240 162 -186 152 -126" stroke="#c9dca2" stroke-width="12" fill="none" stroke-linecap="round" opacity=".55"/>
        <path d="M92 -214 C140 -246 182 -300 220 -332" stroke="#a7cf86" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>
        <path d="M298 -312 C288 -306 276 -306 268 -308" stroke="#2b4626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="282" cy="-312" rx="6" ry="3.5" fill="#e79a8a" opacity=".55"/>
        <circle cx="292" cy="-330" r="2.2" fill="#2b4626"/>${eye(268,-327,5)}
        <path d="M258 -338 q9 -6 18 -1" stroke="#2b4626" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
      <path d="M-156 -150 C-146 -204 -64 -232 20 -226 C84 -222 126 -202 144 -172 C162 -140 154 -104 122 -90 C72 -68 -40 -64 -112 -78 C-152 -88 -166 -118 -156 -150 Z" fill="url(#gSauroU)"/>
      <path d="M-138 -98 C-70 -72 60 -72 136 -100 C112 -78 62 -68 0 -68 C-60 -68 -110 -78 -138 -98 Z" fill="#c9dca2" opacity=".55"/>
      <path d="M-140 -168 C-120 -206 -50 -226 20 -222 C70 -219 110 -206 132 -184" stroke="#b5d995" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5"/>
      ${[[-96,-196,20,9],[-50,-210,24,10],[2,-214,22,9],[52,-206,18,8],[-20,-180,14,6],[30,-184,12,5],[-70,-170,12,5]].map(([cx,cy,rx,ry])=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#355a31" opacity=".35"/>`).join('')}
      ${walk(-104,0,false)}${walk(88,-1.2,false)}
    </g></g></g>`;
  };

  /* ---------- Tyrannosaurus: kepala besar, rahang bergerak, kaki melangkah ---------- */
  A.trex = (x,y,s=1,flip=false,cls='') => {
    const leg = (fill,far) => `<path d="M-52 -152 C-76 -106 -44 -70 -2 -76 C26 -82 32 -128 8 -160 Z" fill="${fill}"/>
      <path d="M-14 -92 C-6 -62 -20 -32 -18 -12 C-18 -2 -10 2 0 2 L36 2 C46 2 46 -10 36 -11 L12 -14 C10 -40 20 -68 22 -90 Z" fill="${fill}"/>
      ${far?'':`<path d="M30 2 l10 -1 M22 2 l9 -1" stroke="#f3e6c8" stroke-width="3" stroke-linecap="round"/><path d="M-40 -130 C-46 -110 -34 -92 -14 -88" stroke="#e5b37a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".4"/>`}`;
    const walk = (ph,dx,far) => `<g transform="translate(${dx} 0)"><g>${rot([12,-12,12],1.8,-20,-140,ph)}${leg(far?'#6e4222':'url(#gRexU)',far)}</g></g>`;
    return `<g transform="${T(x,y,s,flip)}"><g class="${cls}"><ellipse cx="-20" cy="4" rx="140" ry="12" fill="#2a1a0c" opacity=".18"/>
    <g filter="url(#fInkB)">${bob([0,-5,0,-5,0],1.8)}
      ${walk(-.9,24,true)}
      <path d="M70 -128 C86 -122 94 -112 92 -104" stroke="#6e4222" stroke-width="8" fill="none" stroke-linecap="round"/>
      <g>${rot([-5,6,-5],3,-40,-140)}<path d="M-40 -178 C-120 -178 -204 -144 -276 -100 C-270 -94 -262 -93 -254 -95 C-190 -112 -118 -112 -40 -104 Z" fill="url(#gRexU)"/>
        ${[[-90,-162],[-140,-148],[-186,-131],[-226,-114]].map(([a,b],i)=>`<path d="M${a} ${b} q6 ${12-i*2} 0 ${22-i*4}" stroke="#7a4524" stroke-width="${6-i}" fill="none" stroke-linecap="round" opacity=".55"/>`).join('')}</g>
      <path d="M-64 -164 C-24 -194 48 -190 86 -166 C104 -150 106 -120 92 -104 C62 -80 0 -82 -42 -100 C-74 -114 -84 -146 -64 -164 Z" fill="url(#gRexU)"/>
      <path d="M-44 -104 C-4 -84 50 -84 90 -106 C70 -86 30 -80 0 -82 C-20 -84 -36 -92 -44 -104 Z" fill="#f0cf98" opacity=".7"/>
      ${[[-34,-166],[-4,-172],[26,-170],[54,-160]].map(([a,b])=>`<path d="M${a} ${b} q4 12 -2 22" stroke="#7a4524" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>`).join('')}
      <path d="M-44 -162 C-10 -180 44 -177 76 -160" stroke="#efc184" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>
      <g>${rot([0,-3,2,0],5,80,-160)}
        <g>${rot([0,0,14,0,0],5,108,-160)}<path d="M94 -164 C130 -166 170 -170 194 -170 C194 -156 182 -146 160 -142 C130 -138 104 -144 90 -152 Z" fill="url(#gRexU)"/>
          <path d="M120 -164 l5 -8 l5 8 M140 -166 l5 -8 l5 8 M160 -168 l5 -8 l5 8 M178 -169 l4 -7 l4 7" fill="#fffaf0" stroke="#fffaf0" stroke-width="1"/>
          <path d="M104 -150 C130 -144 160 -146 184 -158" stroke="#f0cf98" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/></g>
        <path d="M56 -168 C64 -214 118 -230 166 -220 C192 -214 204 -198 202 -184 L200 -168 C170 -167 132 -166 92 -160 Z" fill="url(#gRexU)"/>
        <path d="M118 -168 l5 8 l5 -8 M138 -169 l5 8 l5 -8 M158 -170 l5 8 l5 -8 M178 -170 l4 7 l4 -7" fill="#fffaf0" stroke="#fffaf0" stroke-width="1"/>
        <path d="M98 -204 C122 -214 150 -216 176 -208" stroke="#efc184" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
        <path d="M134 -210 q14 -9 28 -2" stroke="#4a2a14" stroke-width="5" fill="none" stroke-linecap="round"/>
        ${eye(150,-198,6)}<circle cx="192" cy="-200" r="2.6" fill="#4a2a14"/>
        <path d="M100 -186 q8 6 4 14" stroke="#9a5a30" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></g>
      ${walk(0,0,false)}
      <path d="M72 -124 C88 -116 96 -106 94 -98 M94 -98 l9 3 M94 -98 l3 9" stroke="url(#gRexU)" stroke-width="9" fill="none" stroke-linecap="round"/>
    </g></g></g>`;
  };

  /* ---------- Pterosaurus: sayap membran beruas (lengan + jari), kepak dengan pemendekan perspektif ---------- */
  A.ptero = (x,y,s=1,flip=false,cls='') => {
    const D=.95, KT='0;.42;1', KS='.4 0 .6 1;.4 0 .6 1';
    const wing = (fill,dx,far) => `<g transform="translate(0 -6)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 ${far?-.55:-.8};1 1" keyTimes="${KT}" dur="${D}s" repeatCount="indefinite" calcMode="spline" keySplines="${KS}"/>
      <g transform="translate(${dx} 6)">
        <path d="M26 -6 L10 -74 C-10 -72 -34 -66 -54 -58 C-58 -38 -52 -18 -38 -4 Z" fill="${fill}"/>
        <g><animateTransform attributeName="transform" type="rotate" values="-4 10 -74;12 10 -74;-4 10 -74" keyTimes="${KT}" dur="${D}s" repeatCount="indefinite" calcMode="spline" keySplines="${KS}"/>
          <path d="M18 -62 L10 -74 C-4 -104 -24 -136 -54 -168 C-70 -130 -70 -94 -58 -56 C-36 -58 -10 -62 18 -62 Z" fill="${fill}"/>
          ${far?'':`<path d="M10 -74 C-4 -104 -24 -136 -54 -168" stroke="#8a3e22" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M-2 -84 C-20 -100 -36 -116 -50 -138 M-10 -74 C-28 -82 -40 -94 -50 -108" stroke="#a9583a" stroke-width="1.4" fill="none" opacity=".5"/>`}</g>
        ${far?'':`<path d="M26 -6 L10 -74" stroke="#8a3e22" stroke-width="4" stroke-linecap="round"/><path d="M16 -40 C0 -40 -20 -34 -40 -26" stroke="#a9583a" stroke-width="1.4" fill="none" opacity=".5"/>`}
      </g></g></g>`;
    return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><g class="${cls}">
      <g>${bob([3,-5,3],D)}<g filter="url(#fInkP)">
        ${wing('#a95c38',20,true)}
        <path d="M-40 0 C-30 -12 10 -16 34 -8 C44 -5 48 0 44 4 C20 12 -20 10 -40 0 Z" fill="url(#gPteroU)"/>
        <path d="M-34 4 C-44 8 -52 12 -58 14 M-58 14 l-6 -3 M-58 14 l-5 4 M-30 6 C-40 12 -46 16 -52 20 M-52 20 l-6 -2 M-52 20 l-4 5" stroke="#a9583a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M32 -8 C44 -16 56 -18 66 -16 L130 -6 L66 3 C56 5 44 4 38 2 Z" fill="url(#gPteroU)"/>
        <path d="M62 -15 C50 -26 32 -38 12 -48 C34 -40 54 -28 72 -13 Z" fill="#c0603a"/>
        <path d="M70 -3 L126 -5" stroke="#8a3e22" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
        <path d="M-30 4 C-10 10 20 10 40 2" stroke="#f3c79c" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
        ${eye(64,-9,3.2)}
        ${wing('url(#gWingU)',0,false)}
      </g></g></g></g>`;
  };

  /* ---------- Paleozoikum ---------- */
  A.trilobite = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
    <path d="M-34 -8 C-34 -26 -18 -34 0 -34 C18 -34 34 -26 34 -8 C34 6 18 10 0 10 C-18 10 -34 6 -34 -8Z" fill="url(#gTrilo)"/>
    <path d="M24 -24 C36 -22 44 -14 44 -6 C40 -2 32 -4 26 -8Z" fill="#a37a52"/>
    ${[-20,-12,-4,4,12].map(v=>`<path d="M${v} -31 C${v-3} -14 ${v-3} -2 ${v} 8" stroke="#5a3e28" stroke-width="2" fill="none"/>`).join('')}
    <path d="M-30 -10 L30 -10" stroke="#5a3e28" stroke-width="2"/><path d="M-26 -18 L26 -18" stroke="#c9a27a" stroke-width="5" opacity=".5"/>
    ${eye(34,-16,3)}${[-24,-14,-4,6].map(v=>`<path d="M${v} 8 l-4 8 M${v} -32 l-4 -6" stroke="#6a4630" stroke-width="2.5" stroke-linecap="round"/>`).join('')}
  </g></g>`;

  A.fish = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}">
    <path d="M-60 0 L-96 -26 L-88 0 L-96 26Z" fill="#2c536b" class="tailw"/>
    <path d="M-66 0 C-40 -36 30 -40 66 -10 C74 -4 74 4 66 10 C30 38 -40 34 -66 0Z" fill="url(#gFish)"/>
    <path d="M-50 6 C-10 26 40 22 64 8 C40 30 -20 32 -50 6Z" fill="url(#gFishBelly)" opacity=".9"/>
    <path d="M22 -30 C46 -26 62 -16 70 -6 C70 6 60 16 44 22 C36 4 30 -14 22 -30Z" fill="url(#gArmor)"/>
    <path d="M-10 -32 L4 -50 L14 -30Z M-14 30 L-2 44 L8 28Z" fill="#2c536b"/>
    <path d="M60 4 L72 8 L60 12" fill="#e9e2d0"/>${eye(48,-8,4.5)}
    ${[-30,-14,2].map(v=>`<path d="M${v} -22 q6 22 0 44" stroke="#9cc2d6" stroke-width="2" fill="none" opacity=".6"/>`).join('')}
  </g></g>`;

  A.amphibian = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
    <path d="M-40 -16 C-80 -18 -120 -8 -150 6 C-110 -2 -76 -2 -40 -4Z" fill="url(#gAmph)" class="tailw"/>
    <path d="M-30 -8 L-46 4 L-58 2 M24 -8 L36 4 L50 4" stroke="#4c6a30" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M-50 -14 C-46 -40 30 -44 54 -24 C66 -14 60 -2 40 0 C0 4 -40 4 -50 -14Z" fill="url(#gAmph)"/>
    <path d="M40 -26 C56 -40 92 -38 100 -22 C102 -12 90 -4 72 -4 C56 -4 44 -10 40 -26Z" fill="url(#gAmph)"/>
    <path d="M60 -12 Q80 -6 98 -16" stroke="#3e5826" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    ${eye(78,-30,5)}<path d="M-30 -34 q20 -8 40 -6" stroke="#b7d07f" stroke-width="5" fill="none" opacity=".6" stroke-linecap="round"/>
    <path d="M-20 -6 L-32 4 L-44 4 M10 -6 L18 4 L30 6" stroke="#5f7f3e" stroke-width="8" stroke-linecap="round" fill="none"/>
    ${[-30,-10,10].map(v=>`<circle cx="${v}" cy="-26" r="4" fill="#5f7f3e" opacity=".6"/>`).join('')}
  </g></g>`;

  A.algae = (x,y,h=120,s=1,cls='sway') => `<g transform="${T(x,y,s)}"><g class="${cls}">
    <path d="M0 0 C-14 ${-h*.3} 14 ${-h*.55} -4 ${-h*.8} C-10 ${-h*.9} 0 ${-h} 4 ${-h}" stroke="#4f8a4a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M6 0 C18 ${-h*.25} -6 ${-h*.5} 12 ${-h*.7}" stroke="#7aa65a" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${[.3,.5,.7].map(f=>`<ellipse cx="${f*20-6}" cy="${-h*f}" rx="10" ry="4" transform="rotate(-30 ${f*20-6} ${-h*f})" fill="#6f9a4a"/>`).join('')}
  </g></g>`;

  /* Tumbuhan paku: daun majemuk dibuat terprogram di sepanjang tangkai melengkung */
  A.fern = (x,y,s=1,cls='sway',hue='gFern') => {
    let out=''; const fronds=[-62,-38,-16,8,30,54,74];
    fronds.forEach((ang,k)=>{
      const L=150-Math.abs(ang)*.6, rad=(ang-90)*Math.PI/180, ex=Math.cos(rad)*L, ey=Math.sin(rad)*L, cx=ex*.35, cy=ey*.9;
      let leaves='';
      for(let i=2;i<=12;i++){ const t=i/13, px=2*(1-t)*t*cx+t*t*ex, py=2*(1-t)*t*cy+t*t*ey, sz=(1-t)*16+4;
        const tx=2*(1-t)*cx+2*t*(ex-cx), ty=2*(1-t)*cy+2*t*(ey-cy), a=Math.atan2(ty,tx)*180/Math.PI;
        leaves+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${sz.toFixed(1)}" ry="${(sz*.32).toFixed(1)}" transform="rotate(${(a+65).toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})" fill="url(#${hue})"/>`+
                `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${sz.toFixed(1)}" ry="${(sz*.32).toFixed(1)}" transform="rotate(${(a-65).toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})" fill="url(#${hue})" opacity=".9"/>`; }
      out+=`<g class="sway d${k%3+1}"><path d="M0 0 Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#3f6b2e" stroke-width="3.5" fill="none"/>${leaves}</g>`;
    });
    return `<g transform="${T(x,y,s)}"><g class="${cls}">${out}</g></g>`;
  };

  /* Sikas / palem purba Mesozoikum */
  A.cycad = (x,y,s=1,cls='sway d2') => {
    let fr=''; [-150,-125,-100,-80,-60,-35,-20].forEach((a,k)=>{
      const rad=a*Math.PI/180, L=150, ex=Math.cos(rad)*L, ey=Math.sin(rad)*L*.75-10;
      let lf=''; for(let i=1;i<10;i++){ const t=i/10, px=ex*t, py=ey*t+Math.sin(t*Math.PI)*-18; lf+=`<path d="M${px.toFixed(1)} ${py.toFixed(1)} l${(-8+t*4).toFixed(1)} ${(22-t*8).toFixed(1)}" stroke="url(#gLeaf)" stroke-width="5" stroke-linecap="round"/><path d="M${px.toFixed(1)} ${py.toFixed(1)} l${(8-t*4).toFixed(1)} ${(-18+t*6).toFixed(1)}" stroke="url(#gLeafDark)" stroke-width="4.5" stroke-linecap="round"/>`; }
      fr+=`<g transform="translate(0 -150)"><g class="sway d${k%3+1}"><path d="M0 0 Q${(ex/2).toFixed(1)} ${(ey/2-24).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#3f6b2e" stroke-width="4" fill="none"/>${lf}</g></g>`; });
    return `<g transform="${T(x,y,s)}"><g class="${cls}"><path d="M-18 0 C-22 -60 -16 -120 -10 -152 L10 -152 C16 -120 22 -60 18 0Z" fill="url(#gTrunk)"/>
      ${[-20,-45,-70,-95,-120,-140].map(v=>`<path d="M-18 ${v} q18 10 36 0" stroke="#3f2a18" stroke-width="3" fill="none" opacity=".55"/>`).join('')}${fr}</g></g>`;
  };

  A.tree = (x,y,s=1,cls='sway d2',dark=false) => `<g transform="${T(x,y,s)}"><g class="${cls}" filter="url(#fSoft)">
    <path d="M-14 0 C-10 -60 -14 -120 -6 -170 L8 -170 C14 -120 12 -60 16 0Z M-4 -110 C-30 -130 -50 -140 -70 -150 L-66 -158 C-44 -148 -22 -138 0 -124Z M6 -130 C30 -150 46 -160 66 -172 L70 -164 C50 -150 32 -138 10 -118Z" fill="url(#gTrunk)"/>
    <circle cx="-60" cy="-180" r="50" fill="url(#${dark?'gLeafDark':'gLeaf'})"/><circle cx="60" cy="-190" r="54" fill="url(#gLeaf)"/>
    <circle cx="0" cy="-230" r="66" fill="url(#gLeaf)"/><circle cx="-26" cy="-250" r="34" fill="#9cc27f" opacity=".45"/>
    <circle cx="40" cy="-220" r="30" fill="#2f5329" opacity=".25"/>
  </g></g>`;

  A.palm = (x,y,s=1,cls='sway') => {
    let fr=''; [-170,-140,-110,-75,-40,-10].forEach((a,k)=>{ const rad=a*Math.PI/180, ex=Math.cos(rad)*120, ey=Math.sin(rad)*60+30;
      fr+=`<path class="sway d${k%3+1}" d="M0 0 Q${(ex*.5).toFixed(0)} ${(ey*.5-40).toFixed(0)} ${ex.toFixed(0)} ${ey.toFixed(0)} Q${(ex*.45).toFixed(0)} ${(ey*.5-24).toFixed(0)} 0 0Z" fill="url(#gLeaf)"/>`; });
    return `<g transform="${T(x,y,s)}"><g class="${cls}"><path d="M-8 0 C-4 -80 10 -160 30 -220 L42 -216 C24 -160 12 -80 8 0Z" fill="url(#gTrunk)"/><g transform="translate(36 -218)">${fr}<circle cx="0" cy="6" r="9" fill="#6e4a2a"/><circle cx="10" cy="8" r="8" fill="#5e3c24"/></g></g></g>`;
  };

  A.grass = (x,y,s=1,col='#6f9a4a',cls='sway d3') => `<g transform="${T(x,y,s)}"><g class="${cls}">${[-24,-14,-6,2,10,18,26].map((v,i)=>`<path d="M${v} 0 Q${v+(i%2?8:-8)} -30 ${v+(i%2?14:-12)} ${-46-(i%3)*12}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round"/>`).join('')}</g></g>`;

  A.rock = (x,y,s=1,fill='gRock') => `<g transform="${T(x,y,s)}" filter="url(#fSoft)"><path d="M-60 0 L-50 -36 L-18 -58 L22 -54 L54 -30 L62 0Z" fill="url(#${fill})"/><path d="M-18 -58 L-6 -20 L54 -30" stroke="#fff" stroke-opacity=".18" stroke-width="3" fill="none"/></g>`;

  A.stromatolite = (x,y,s=1) => `<g transform="${T(x,y,s)}" filter="url(#fSoft)"><path d="M-46 0 C-46 -40 -24 -58 0 -58 C24 -58 46 -40 46 0Z" fill="url(#gStroma)"/>
    ${[-46,-36,-26,-16].map((v,i)=>`<path d="M${-40+i*6} ${-8-i*11} C${-30+i*5} ${-22-i*11} ${30-i*5} ${-22-i*11} ${40-i*6} ${-8-i*11}" stroke="#c9c08a" stroke-width="2.5" fill="none" opacity=".7"/>`).join('')}
    <circle cx="-10" cy="-44" r="3" fill="#a9d48a" opacity=".8"/><circle cx="8" cy="-36" r="2.5" fill="#a9d48a" opacity=".8"/></g>`;

  A.volcano = (x,y,w=520,h=300,opts={}) => {
    const hot=opts.hot!==false, top=-h, cw=w*.16;
    return `<g transform="translate(${x} ${y})">
      <path d="M${-w/2} 0 C${-w*.3} ${-h*.3} ${-cw*1.2} ${top+20} ${-cw/2} ${top} L${cw/2} ${top} C${cw*1.2} ${top+20} ${w*.3} ${-h*.3} ${w/2} 0Z" fill="url(#${opts.warm?'gVolcWarm':'gVolc'})"/>
      <path d="M${-cw/2} ${top} C${-w*.05} ${-h*.5} ${-w*.2} ${-h*.25} ${-w*.32} 0 L${-w*.22} 0 C${-w*.1} ${-h*.3} 0 ${-h*.6} ${cw*.1} ${top}Z" fill="#000" opacity=".18"/>
      ${hot?`<ellipse cx="0" cy="${top}" rx="${cw*1.4}" ry="${cw*.7}" fill="url(#gGlowOrange)" class="glowpulse"/>
      <path class="lavaflow" d="M${-cw*.2} ${top+4} C${-w*.06} ${-h*.6} ${-w*.02} ${-h*.35} ${-w*.12} 0" stroke="url(#gLavaRiver)" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path class="lavaflow" style="animation-duration:3.2s" d="M${cw*.25} ${top+4} C${w*.08} ${-h*.7} ${w*.16} ${-h*.3} ${w*.22} 0" stroke="url(#gLavaRiver)" stroke-width="8" fill="none" stroke-linecap="round"/>`:''}
      ${opts.smoke!==false?`<g opacity="${hot?.9:.6}">${[0,1,2].map(i=>`<circle class="smoke s${i+1}" cx="${(i-1)*14}" cy="${top-10}" r="${30+i*6}" fill="${hot?'#5a4a46':'#c9c2bb'}"/>`).join('')}</g>`:''}
    </g>`;
  };

  /* ---------- Neozoikum ---------- */
  A.stegodon = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
    <path d="M-80 -70 L-82 0 L-52 0 L-50 -66Z M60 -74 L58 0 L88 0 L90 -76Z" fill="#53443a"/>
    <path d="M-120 -130 C-130 -90 -132 -80 -138 -60" stroke="#53443a" stroke-width="6" fill="none" stroke-linecap="round" class="tailw"/>
    <path d="M-124 -120 C-128 -200 -20 -222 70 -200 C120 -188 134 -150 128 -110 C124 -76 80 -62 0 -62 C-80 -62 -120 -76 -124 -120Z" fill="url(#gStego)" class="breathe"/>
    <path d="M-110 -170 C-60 -200 20 -206 70 -194" stroke="#b5a291" stroke-width="10" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M-106 -72 L-104 0 L-74 0 L-76 -74Z M30 -72 L28 0 L58 0 L60 -74Z" fill="url(#gStego)"/>
    <g class="nod"><path d="M96 -176 C140 -196 180 -176 186 -140 C190 -110 180 -80 170 -50 C164 -30 170 -14 182 -10 C170 -2 152 -10 150 -34 C148 -60 150 -90 132 -104 C110 -110 96 -150 96 -176Z" fill="url(#gStego)"/>
      <path d="M100 -170 C70 -170 60 -130 76 -104 C92 -96 108 -110 112 -130Z" fill="#7a6656"/>
      <path d="M166 -112 C214 -100 250 -60 262 -6" stroke="#fff3dc" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M166 -112 C214 -100 250 -60 262 -6" stroke="#d9c7a3" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
      ${eye(160,-146,4.5)}<path d="M150 -156 q10 -6 20 0" stroke="#3a2e26" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  </g></g>`;

  A.horse = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
    <path d="M-54 -64 L-58 0 L-48 0 L-44 -60Z M44 -66 L40 0 L50 0 L54 -64Z" fill="#6a4226"/>
    <path d="M-70 -104 C-96 -96 -104 -70 -100 -46 C-92 -66 -84 -84 -70 -92Z" fill="#4a2e1a" class="tailw"/>

    <path d="M-38 -66 L-42 0 L-32 0 L-28 -64Z M26 -66 L22 0 L32 0 L36 -64Z" fill="url(#gHorse)"/>
    <g class="nod"><path d="M50 -110 C62 -140 80 -166 96 -172 C110 -170 118 -160 120 -146 L108 -140 C98 -146 90 -132 80 -112 C74 -100 62 -96 50 -100Z" fill="url(#gHorse)"/>
      <path d="M52 -112 C60 -140 76 -164 92 -174 C86 -160 78 -146 70 -122Z" fill="#4a2e1a"/>
      <path d="M96 -170 l-2 -14 l10 10Z" fill="#8a5732"/>${eye(102,-158,3.5)}<circle cx="117" cy="-146" r="2" fill="#3a2414"/></g>
    <path d="M-30 -110 C0 -116 30 -114 50 -106" stroke="#d6a47a" stroke-width="5" opacity=".5" fill="none" stroke-linecap="round"/>
  </g></g>`;

  A.monkey = (x,y,s=1,flip=false,cls='') => `<g transform="${T(x,y,s,flip)}"><g class="${cls}">
    <path d="M-14 -20 C-40 -10 -50 20 -36 50 C-30 60 -20 58 -22 48 C-30 26 -26 4 -10 -6" stroke="#5f4129" stroke-width="6" fill="none" stroke-linecap="round" class="tailw"/>
    <path d="M-20 -10 C-26 -40 -14 -66 6 -66 C26 -66 34 -40 26 -10 C18 0 -12 0 -20 -10Z" fill="url(#gMonkey)"/>
    <path d="M20 -50 C34 -40 40 -24 44 -6" stroke="#5f4129" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-16 -46 C-26 -64 -30 -84 -26 -100" stroke="#5f4129" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="6" cy="-82" r="20" fill="url(#gMonkey)"/><ellipse cx="10" cy="-78" rx="13" ry="12" fill="#d8b08a"/>
    <circle cx="-14" cy="-84" r="7" fill="#d8b08a"/><circle cx="26" cy="-86" r="6" fill="#d8b08a"/>

  /* Manusia purba (Homo erectus): berdiri memegang tombak kayu, atau jongkok */
  A.human = (x,y,s=1,flip=false,cls='',pose='stand',hue='gSkin') => {
    const head=`<g class="nod"><ellipse cx="4" cy="-150" rx="16" ry="19" fill="url(#${hue})"/><path d="M-12 -158 C-14 -176 6 -182 18 -170 C22 -162 18 -158 14 -160 C6 -168 -2 -166 -12 -158Z" fill="#2a1a10"/>
      <path d="M8 -156 q8 -3 14 1" stroke="#4a2c18" stroke-width="3.5" fill="none" stroke-linecap="round"/>${eye(15,-150,2.6)}<path d="M14 -138 q5 2 9 -1" stroke="#5a3520" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
    if(pose==='crouch') return `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
      <path d="M-20 0 C-26 -20 -16 -40 0 -44 C16 -40 24 -24 20 0Z" fill="url(#${hue})"/>
      <path d="M-18 -40 C-22 -70 -10 -100 4 -104 C20 -100 26 -74 22 -44Z" fill="url(#${hue})"/>
      <path d="M-20 -48 C-10 -36 14 -36 24 -48 L22 -30 C10 -22 -10 -22 -20 -30Z" fill="url(#gHide)"/>
      <path d="M16 -88 C30 -80 40 -66 44 -54" stroke="url(#${hue})" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g transform="translate(0 46)">${head}</g></g></g>`;
    return `<g transform="${T(x,y,s,flip)}"><g class="${cls}" filter="url(#fSoft)">
      <path d="M-10 -66 L-14 0 L-2 0 L0 -64Z M4 -66 L10 0 L22 0 L14 -66Z" fill="url(#${hue})"/>
      <path d="M-16 -126 C-20 -100 -18 -80 -14 -64 L18 -64 C22 -80 22 -104 16 -126 C6 -134 -8 -134 -16 -126Z" fill="url(#${hue})" class="breathe"/>
      <path d="M-16 -80 L18 -80 L20 -56 L8 -50 L-4 -58 L-16 -52Z" fill="url(#gHide)"/>
      <path d="M-14 -120 C-26 -100 -30 -84 -26 -70" stroke="url(#${hue})" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M40 -190 L22 8" stroke="#6e4a2a" stroke-width="5" stroke-linecap="round"/><path d="M40 -190 l-4 -14 l10 10z" fill="#9a8a78"/>
      <path d="M14 -120 C24 -110 30 -100 32 -92" stroke="url(#${hue})" stroke-width="10" fill="none" stroke-linecap="round"/>
      ${head}</g></g>`;
  };

  A.fire = (x,y,s=1) => `<g transform="${T(x,y,s)}">
    <ellipse cx="0" cy="-30" rx="110" ry="80" fill="url(#gGlowWarm)" class="glowpulse"/>

  </g>`;

  A.bone = (x,y,s=1,rot=0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M-40 -4 h80 v8 h-80z" fill="url(#gBone)"/>

  A.skull = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-60 0 C-60 -30 -20 -44 20 -40 C50 -36 70 -20 70 -6 L40 -2 L40 8 L-50 8Z" fill="url(#gBone)"/>
    <circle cx="10" cy="-20" r="8" fill="#8a7458"/>${[-30,-18,-6,6,18,30].map(v=>`<path d="M${v} 8 l4 10 l4 -10" fill="#fff5df"/>`).join('')}</g>`;

  A.meteor = (x,y,s=1,cls='meteor') => `<g transform="${T(x,y,s)}"><g class="${cls}"><path d="M0 0 L140 -120" stroke="url(#gLavaRiver)" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M0 0 L90 -78" stroke="#fff3c4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="22" fill="url(#gGlowOrange)"/><circle cx="0" cy="0" r="9" fill="#5a3a2e"/><circle cx="-2" cy="-2" r="4" fill="#ffcf7a"/></g></g>`;

  A.cloud = (x,y,s=1,col='#fff',op=.9,cls='cloud') => `<g class="${cls}"><g transform="${T(x,y,s)}" opacity="${op}"><ellipse cx="0" cy="0" rx="90" ry="30" fill="${col}"/><circle cx="-40" cy="-14" r="34" fill="${col}"/><circle cx="14" cy="-26" r="44" fill="${col}"/><circle cx="56" cy="-8" r="28" fill="${col}"/></g></g>`;

  A.bird = (x,y,s=1) => `<g transform="${T(x,y,s)}"><path class="flap" d="M-16 0 Q-8 -10 0 0 Q8 -10 16 0" stroke="#3b2a1d" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;

  /* Perahu bercadik dengan layar tanja (khas Nusantara) */

    <path d="M-110 -6 C-60 16 60 16 110 -6 L96 -20 L-96 -20Z" fill="url(#gWood)"/>

    <path d="M0 -20 L0 -150" stroke="#5e3c24" stroke-width="5"/>
    <path d="M-6 -150 L70 -40 L-60 -30Z" fill="url(#gSail)" stroke="#a87a4a" stroke-width="2"/>
    <path d="M-50 -34 L60 -44 M-30 -80 L44 -76 M-14 -116 L28 -108" stroke="#a87a4a" stroke-width="2" opacity=".6"/>
    ${A.human(-40,-18,.32,false,'','stand')}</g></g></g>`;

  A.handStencil = (x,y,s=1,rot=0,col='#b8502e') => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity=".85">
    <ellipse cx="0" cy="0" rx="34" ry="40" fill="${col}" opacity=".35" filter="url(#fBlur)"/>

  A.menhir = (x,y,s=1) => `<g transform="${T(x,y,s)}" filter="url(#fSoft)"><path d="M-24 0 C-30 -60 -20 -140 -4 -170 C10 -168 24 -120 26 -60 L28 0Z" fill="url(#gRock)"/><path d="M-4 -170 C2 -120 4 -60 0 0" stroke="#fff" stroke-opacity=".15" stroke-width="5" fill="none"/></g>`;

    cell: ic(`<circle cx="100" cy="100" r="58" fill="#cfe8c0" stroke="#7fb36a" stroke-width="6"/><circle cx="112" cy="90" r="20" fill="#8cbf62"/><circle cx="76" cy="122" r="7" fill="#7fb36a"/><circle cx="128" cy="128" r="5" fill="#7fb36a"/>`),

    sea: ic(`<rect x="4" y="100" width="192" height="96" fill="url(#gSea)"/><path d="M10 104 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0" stroke="#cfe6f2" stroke-width="5" fill="none"/><circle cx="140" cy="56" r="26" fill="url(#gSun)"/>`),

    bigbang: ic(`<circle cx="100" cy="100" r="96" fill="#1d1730"/><circle cx="100" cy="100" r="40" fill="url(#gGlowWarm)"/>${Array.from({length:18},(_,i)=>{const a=i*20*Math.PI/180;return `<circle cx="${100+Math.cos(a)*(56+(i%3)*12)}" cy="${100+Math.sin(a)*(56+(i%3)*12)}" r="${3+(i%2)*2}" fill="${['#ffd27a','#fff','#f0a070'][i%3]}"/>`}).join('')}`),
    earth: ic(`<circle cx="100" cy="100" r="70" fill="url(#gEarthHot)"/><path d="M60 80 q20 -14 40 0 M90 130 q24 -10 40 6" stroke="#5a1406" stroke-width="6" fill="none" opacity=".6"/>`),
    timeline: ic(`<path d="M30 100 H170" stroke="#c0603a" stroke-width="10" stroke-linecap="round"/>${[40,80,120,160].map((x,i)=>`<circle cx="${x}" cy="100" r="16" fill="${['#c0603a','#3f7f9b','#6f9a4a','#d9a441'][i]}" stroke="#fff" stroke-width="5"/>`).join('')}`),
    thumbUp: `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#e4f0d8"/><path d="M30 48 h12 v30 h-12z M44 76 h28 c6 0 8 -4 9 -8 l5 -18 c1 -6 -2 -9 -8 -9 h-16 l3 -12 c1 -6 -3 -10 -7 -8 l-14 22z" fill="#3f6b3a"/></svg>`,
    thumbDown: `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#f8e6d6"/><g transform="rotate(180 50 50)"><path d="M30 48 h12 v30 h-12z M44 76 h28 c6 0 8 -4 9 -8 l5 -18 c1 -6 -2 -9 -8 -9 h-16 l3 -12 c1 -6 -3 -10 -7 -8 l-14 22z" fill="#c0603a"/></g></svg>`
  };
  /* Wajah penyemangat untuk umpan balik */
  A.face = (happy=true) => `<svg class="face" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="${happy?'#f3d58a':'#f6dcc0'}" stroke="${happy?'#d9a441':'#e0b48f'}" stroke-width="4"/>
    <circle cx="36" cy="42" r="5" fill="#3b2a1d"/><circle cx="64" cy="42" r="5" fill="#3b2a1d"/><circle cx="28" cy="58" r="6" fill="#f0a98a" opacity=".6"/><circle cx="72" cy="58" r="6" fill="#f0a98a" opacity=".6"/>
    ${happy?'<path d="M32 60 q18 18 36 0" stroke="#3b2a1d" stroke-width="5" fill="none" stroke-linecap="round"/>':'<path d="M36 64 q14 8 28 0" stroke="#3b2a1d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M70 22 q8 4 6 14" stroke="#7fb3cf" stroke-width="4" fill="none" stroke-linecap="round"/>'}</svg>`;
})(window.JPA);

</script>
<script>
/* Diorama berlapis (latar belakang – tengah – depan) untuk setiap adegan.
   Setiap adegan: { svg(), particles:[per fase], ambience, hotspots:[{id,label,say}] }.
   Kelas fase: p0only (hanya fase 0), p0hide (fase 1+), p2only (fase 2). */
(function(J){
  const A=J.art, S = J.scenes = {};
  const VB='0 0 1600 900';
  const layer = (depth, inner, drift='') => `<g class="layer" data-depth="${depth}"><g class="${drift}">${inner}</g></g>`;
  const hs = (id,label,cx,cy,rx,ry,inner) => `<g class="hotspot" data-hs="${id}" tabindex="0" role="button" aria-label="${label}"><ellipse class="halo" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>${inner}<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="transparent"/></g>`;
  const sky = (id,stops) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs><rect width="1600" height="900" fill="url(#${id})"/>`;
  const wrap = body => `<div class="cam"><svg class="scene" viewBox="${VB}" preserveAspectRatio="xMidYMid slice" role="img">${body}</svg></div><canvas class="fx"></canvas><div class="vignette"></div>`;

  /* ================= SPLASH: Diorama Nusantara ================= */
  S.splash = {
    ambience:'sea', particles:[['dust','fireflies']],
    svg:()=>wrap(`
      ${sky('skySplash',['#f6c98a','#f7dcae','#f3e6cf','#cfe3e6'])}
      ${layer(.15,`<g class="sun-rise"><circle cx="1060" cy="330" r="230" fill="url(#gGlowWarm)"/><circle cx="1060" cy="330" r="86" fill="url(#gSun)"/>
        <g class="spin-slow" opacity=".25">${Array.from({length:16},(_,i)=>`<path d="M1060 330 L${1060+Math.cos(i*Math.PI/8)*520} ${330+Math.sin(i*Math.PI/8)*520} L${1060+Math.cos(i*Math.PI/8+.06)*520} ${330+Math.sin(i*Math.PI/8+.06)*520}Z" fill="#fff3c4"/>`).join('')}</g></g>
        ${A.cloud(200,170,1.2,'#fff8ec',.85)}${A.cloud(700,110,.9,'#fff8ec',.7,'cloud c2')}${A.cloud(1300,200,1.1,'#fff8ec',.8,'cloud c3')}`)}
      ${layer(.25,`<path d="M0 520 L140 430 L260 470 L420 380 L560 450 L700 400 L860 470 L1000 420 L1180 470 L1320 400 L1480 450 L1600 420 L1600 600 L0 600Z" fill="#a9b6c4" opacity=".75"/>`,'drift-slow')}
      ${layer(.35,`${A.volcano(430,560,620,300,{hot:false,warm:true})}<path d="M900 560 C1000 470 1120 450 1260 500 C1340 520 1420 500 1600 470 L1600 600 L900 600Z" fill="#7d9a76"/>`,'drift-mid')}
      ${layer(.5,`<rect x="0" y="540" width="1600" height="360" fill="url(#gSea)"/>
        <g class="wave"><path d="M-40 580 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#d7ecf4" stroke-width="4" fill="none" opacity=".6"/></g>
        <g class="wave w2"><path d="M-40 640 q50 -12 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" stroke="#bfe0ee" stroke-width="3" fill="none" opacity=".5"/></g>
        ${A.island(1180,590,420,70)}${A.palm(1120,560,.55)}${A.palm(1220,565,.45,'sway d2')}${A.island(260,610,300,50)}${A.palm(250,590,.4,'sway d3')}
        <g class="sail">${A.boat(0,690,.9)}</g>
        ${A.bird(820,250,1)}${A.bird(860,230,.8)}${A.bird(900,262,.9)}`)}
      ${layer(.9,`<path d="M0 900 L0 380 C60 360 140 380 200 440 C260 500 300 600 320 700 C340 800 330 860 360 900Z" fill="url(#gRockWarm)" filter="url(#fSoft)"/>
        <path d="M30 420 C90 420 160 460 200 520" stroke="#fff" stroke-opacity=".12" stroke-width="10" fill="none"/>
        ${A.handStencil(90,540,1,-12)}${A.handStencil(170,620,.85,8,'#a8442a')}${A.handStencil(80,700,.9,-4)}
        <path d="M1600 900 L1600 700 C1500 690 1400 720 1300 780 C1240 820 1200 860 1180 900Z" fill="url(#gGrass)"/>
        ${A.menhir(1420,760,1.05)}${A.fern(1300,820,.9)}${A.fern(1540,780,.7,'sway d2')}${A.grass(1250,880,1.2)}${A.grass(1500,860,1)}
        <path d="M0 900 L0 860 C200 840 360 870 520 900Z" fill="#6f8f5a"/>`)}
    `)
  };

  /* ================= BIG BANG (digambar di canvas) ================= */
  S.bigbang = {
    ambience:'space', canvas:true, particles:[[]],
    svg:()=>`<div class="cam"><canvas class="bb" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div><canvas class="fx"></canvas><div class="vignette"></div>`,
    init(){ const R=J.rand; const cols=['#fff6dc','#ffd27a','#f0a070','#e07a50','#c9a6ff','#9fd0ff'];
      return { parts:Array.from({length:900},()=>({a:R(0,6.283),s:Math.pow(Math.random(),.6),c:cols[Math.floor(R(0,6))],z:R(.6,2.2)})),
        stars:Array.from({length:240},()=>({x:Math.random(),y:Math.random(),r:R(.3,1.6),p:R(0,6)})),
        gal:Array.from({length:1200},(_,i)=>({arm:i%2,d:Math.pow(Math.random(),.8),o:R(-1,1),g:i%3})),
        disk:Array.from({length:600},()=>({r:R(.12,.48),a:R(0,6.283),sz:R(.6,2.2),c:Math.random()<.5?'#ffcf8a':'#e8996a'})),
        plates:Array.from({length:12},()=>({x:R(0,1),y:R(-.85,.85),r:R(.08,.22),s:R(.6,1.2)})) }; },
    draw(c,w,h,t,d,ph,pt){
      const cx=w/2, cy=h*.48, m=Math.min(w,h);
      const bg=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.8); bg.addColorStop(0,'#2a1f3a'); bg.addColorStop(1,'#0d0a16'); c.fillStyle=bg; c.fillRect(0,0,w,h);
      const glow=(x,y,r,col,a=1)=>{ const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); c.globalAlpha=a; c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.globalAlpha=1; };
      const sa = ph===0?0:Math.min(1,ph===1?Math.max(0,pt-1.5)/3:1);
      if(sa>0) d.stars.forEach(s=>{ c.globalAlpha=sa*(.4+.4*Math.sin(t*2+s.p)); c.fillStyle='#fff6dc'; c.fillRect(s.x*w,s.y*h,s.r,s.r); }); c.globalAlpha=1;
      if(ph===0){ const pr=m*.06*(1+.25*Math.sin(pt*3)); glow(cx,cy,pr*4,'rgba(255,230,180,.35)'); glow(cx,cy,pr*1.4,'rgba(255,250,230,.95)'); }
      else if(ph===1){ const e=1-Math.exp(-pt*.7); glow(cx,cy,m*(.2+e*.6),'rgba(255,210,150,.6)',Math.max(0,1-pt*.4));
        d.parts.forEach(p=>{ const r=p.s*e*m*.9*p.z; c.fillStyle=p.c; c.globalAlpha=Math.max(.15,1-e*.5); c.beginPath(); c.arc(cx+Math.cos(p.a)*r, cy+Math.sin(p.a)*r*.85, p.z*.9,0,7); c.fill(); });
        c.globalAlpha=1; if(pt<.7){ c.fillStyle=`rgba(255,248,230,${1-pt/.7})`; c.fillRect(0,0,w,h); } }
      else if(ph===2){ [{x:.3,y:.4,s:.3,sp:.2,c:['#ffd9a8','#fff','#e8a0c8']},{x:.74,y:.32,s:.2,sp:-.3,c:['#ffd27a','#fff','#f0a070']},{x:.62,y:.66,s:.13,sp:.45,c:['#9fd0ff','#c9a6ff','#fff']}].forEach((g,gi)=>{
          const gx=g.x*w, gy=g.y*h, S2=g.s*m; glow(gx,gy,S2*.45,'rgba(255,236,200,.55)');
          d.gal.forEach((p,i)=>{ if(i%3!==gi) return; const ang=p.arm*Math.PI+p.d*5+t*g.sp, rr=p.d*S2; c.fillStyle=g.c[p.g]; c.globalAlpha=.75*(1-p.d*.6); c.fillRect(gx+Math.cos(ang)*rr+p.o*S2*.05, gy+(Math.sin(ang)*rr+p.o*S2*.05)*.45,1.7,1.7); }); c.globalAlpha=1; }); }
      else if(ph===3){ glow(cx,cy,m*.5,'rgba(255,190,110,.25)');
        d.disk.forEach(p=>{ const a=p.a+t*(.08/p.r); c.fillStyle=p.c; c.globalAlpha=.55; c.fillRect(cx+Math.cos(a)*p.r*m, cy+Math.sin(a)*p.r*m*.32, p.sz,p.sz); }); c.globalAlpha=1;
        [[.2,0,1.5,4,'#c9a27a'],[.29,2,1,6,'#5aa0d0'],[.39,4,.7,9,'#e0b070'],[.47,1,.5,7,'#9ad0ff']].forEach(([r,a0,sp,sz,col])=>{ const a=a0+t*sp*.3, x=cx+Math.cos(a)*r*m, y=cy+Math.sin(a)*r*m*.32; glow(x,y,sz*3,'rgba(255,255,255,.25)'); c.fillStyle=col; c.beginPath(); c.arc(x,y,sz,0,7); c.fill(); });
        glow(cx,cy,m*.17,'rgba(255,225,130,.95)'); c.fillStyle='#fff6d0'; c.beginPath(); c.arc(cx,cy,m*.055,0,7); c.fill(); }
      else { const R0=m*.27, cool=Math.min(1,pt/14);
        glow(cx,cy,R0*1.9,'rgba(255,120,40,.35)');
        const g=c.createRadialGradient(cx-R0*.3,cy-R0*.3,R0*.1,cx,cy,R0);
        g.addColorStop(0,cool<.5?'#fff0a0':'#ffc070'); g.addColorStop(.5,cool<.5?'#ff7a1a':'#c84a1a'); g.addColorStop(1,'#5a1406'); c.fillStyle=g; c.beginPath(); c.arc(cx,cy,R0,0,7); c.fill();
        c.save(); c.beginPath(); c.arc(cx,cy,R0,0,7); c.clip();
        d.plates.forEach(p=>{ const x=cx+((p.x+t*.02*p.s)%1.4-.7)*R0*2.4, y=cy+p.y*R0; c.fillStyle=`rgba(60,24,12,${.25+cool*.55})`; c.beginPath(); c.ellipse(x,y,p.r*R0,p.r*R0*.6,0,0,7); c.fill(); c.strokeStyle='rgba(255,180,80,.55)'; c.lineWidth=1.5; c.stroke(); });
        const sh=c.createRadialGradient(cx+R0*.5,cy+R0*.4,R0*.2,cx,cy,R0*1.1); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(20,6,2,.55)'); c.fillStyle=sh; c.fillRect(cx-R0,cy-R0,R0*2,R0*2); c.restore();
        c.fillStyle='#b8b0a8'; const ma=t*.35; c.beginPath(); c.arc(cx+Math.cos(ma)*R0*1.7, cy+Math.sin(ma)*R0*.5, R0*.12,0,7); c.fill(); }
    }
  };

  /* ================= ARKAEKUM ================= */
  S.arkaekum = {
    ambience:'lava', particles:[['embers'],['rain'],['rain','dust']],
    hotspots:[
      {id:'gunung',label:'Gunung api',say:'Gunung api. Gunung api meletus dan mengeluarkan lava yang sangat panas.'},
      {id:'laut',label:'Laut purba',say:'Laut purba. Uap air menjadi hujan, lalu terkumpul menjadi laut.'},
      {id:'awan',label:'Awan hujan',say:'Awan hujan. Hujan turun lama sekali dan membuat Bumi mendingin.'},
      {id:'sel',label:'Makhluk bersel satu',say:'Makhluk bersel satu. Makhluk hidup pertama yang sangat kecil. Muncul di akhir zaman Arkaekum.'}],
    svg:()=>wrap(`
      <g class="phase-fade p0only">${sky('skyArkHot',['#1c0604','#4a0c06','#9a2a0a','#f06a1a'])}</g>
      <g class="phase-fade p0hide">${sky('skyArkCool',['#3a3a48','#5e5a62','#8a7a70','#b89a7a'])}</g>
      ${layer(.1,`<g class="phase-fade p0only">${A.meteor(1300,160,1)}${A.meteor(900,90,.7,'meteor m2')}${A.meteor(1500,240,.8,'meteor m3')}</g>
        <g class="phase-fade p0hide">${hs('awan','Awan hujan',800,150,260,90,`${A.cloud(700,170,1.6,'#5a5662',.95,'')}${A.cloud(900,140,1.3,'#6a6670',.9,'')}`)}
        ${A.cloud(200,120,1.4,'#56525e',.9)}${A.cloud(1300,110,1.5,'#5a5662',.85,'cloud c2')}</g>`)}
      ${layer(.25,`${A.volcano(220,620,420,260,{hot:true})}${A.volcano(1420,600,380,220,{hot:true})}`,'drift-slow')}
      ${layer(.45,`${hs('gunung','Gunung api',820,400,250,230,A.volcano(820,640,640,420,{hot:true}))}`)}
      ${layer(.7,`<path d="M0 600 C300 580 600 640 900 620 C1200 600 1400 630 1600 610 L1600 900 L0 900Z" fill="#2a1712"/>
        <g class="phase-fade p0only"><path d="M0 600 C300 580 600 640 900 620 C1200 600 1400 630 1600 610 L1600 900 L0 900Z" fill="#3a1a10"/>
          <g fill="none" stroke-linecap="round" class="glowpulse">${['M80 700 l60 20 l40 -14 l70 26','M420 760 l50 -10 l30 30 l80 -6','M900 720 l70 18 l20 -24 l60 14','M1180 800 l60 -14 l50 22','M600 850 l50 -20 l70 10']
            .map(p=>`<path d="${p}" stroke="#ffb347" stroke-width="7"/><path d="${p}" stroke="#ff6a1a" stroke-width="16" opacity=".35" filter="url(#fBlur)"/>`).join('')}</g>
          <ellipse cx="1250" cy="760" rx="260" ry="60" fill="url(#gLavaPool)" class="glowpulse"/></g>
        <g class="phase-fade p0hide">${hs('laut','Laut purba',380,770,360,110,`<path d="M0 660 C200 650 500 680 760 700 C700 760 640 860 560 900 L0 900Z" fill="url(#gSeaDeep)"/>
          <g class="wave"><path d="M0 680 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#9fc6d8" stroke-width="3" fill="none" opacity=".6"/></g>`)}
          ${A.rock(1080,720,1.2,'gVolcWarm')}${A.rock(1400,700,.9,'gVolcWarm')}</g>
        <g class="phase-fade p2only">${hs('sel','Makhluk bersel satu',720,740,120,70,`${A.stromatolite(660,770,1)}${A.stromatolite(760,762,.75)}<circle cx="700" cy="690" r="10" fill="#bfe6a0" opacity=".9" class="glowpulse"/><circle cx="740" cy="700" r="6" fill="#bfe6a0" class="glowpulse"/>`)}</g>`)}
    `)
  };

  /* ================= PALEOZOIKUM ================= */
  S.paleozoikum = {
    ambience:'sea', particles:[['rain','bubbles']],
    hotspots:[
      {id:'trilobit',label:'Trilobit',say:'Trilobit. Hewan laut kecil bercangkang. Tubuhnya beruas-ruas.'},
      {id:'ikan',label:'Ikan purba',say:'Ikan purba. Ikan sudah hidup di laut pada zaman ini.'},
      {id:'amfibi',label:'Amfibi purba',say:'Amfibi purba. Hewan ini bisa hidup di air dan di darat, seperti katak.'},
      {id:'paku',label:'Tumbuhan paku',say:'Tumbuhan paku dan ganggang. Tumbuhan mulai tumbuh di air dan di darat.'}],
    svg:()=>wrap(`
      ${sky('skyPaleo',['#4a5868','#6d7a86','#9aa4a8','#b9bcb4'])}
      <rect width="1600" height="900" fill="#fff" class="flash" opacity="0"><animate attributeName="opacity" values="0;0;0;.45;0;.3;0;0" dur="9s" repeatCount="indefinite"/></rect>
      ${layer(.1,`${A.cloud(250,110,1.8,'#4e5864',.95)}${A.cloud(900,90,2,'#566170',.9,'cloud c2')}${A.cloud(1400,140,1.6,'#4e5864',.9,'cloud c3')}`)}
      ${layer(.25,`<path d="M900 470 C1000 400 1150 380 1300 410 C1420 430 1520 400 1600 380 L1600 520 L900 520Z" fill="#6a7e62" opacity=".8"/>`,'drift-slow')}
      ${layer(.5,`<rect x="0" y="430" width="1600" height="470" fill="url(#gSeaDeep)"/>
        <g class="wave"><path d="M-40 436 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#cfe6f2" stroke-width="4" fill="none" opacity=".7"/></g>
        <rect x="0" y="430" width="1600" height="60" fill="#cfe6f2" opacity=".08"/>
        <path d="M0 840 C300 820 600 850 1000 830 L1000 900 L0 900Z" fill="url(#gSand)" opacity=".85"/>
        ${[60,150,240,520,620,760,880].map((x,i)=>A.algae(x,850,100+(i%3)*40,1,'sway d'+(i%3+1))).join('')}
        <g class="swim">${A.fish(0,560,.7,false,'')}</g><g class="swim r2">${A.fish(0,650,.55,false,'')}</g><g class="swimL">${A.fish(0,720,.5,true,'')}</g>
        ${hs('ikan','Ikan purba',420,620,120,60,`<g class="bob">${A.fish(420,620,1.05,false,'')}</g>`)}
        ${hs('trilobit','Trilobit',330,820,90,50,`${A.trilobite(300,830,1.5)}${A.trilobite(400,840,1.1,true)}`)}${A.trilobite(700,845,1)}`)}
      ${layer(.75,`<path d="M960 900 C980 700 1040 560 1140 500 C1260 450 1420 460 1600 440 L1600 900Z" fill="url(#gEarth)"/>
        <path d="M1000 640 C1060 560 1140 510 1220 494" stroke="#8a6a46" stroke-width="16" fill="none" opacity=".5"/>
        <path d="M1110 520 C1220 470 1400 470 1600 450 L1600 470 C1400 490 1240 492 1130 540Z" fill="url(#gGrass)"/>
        ${hs('paku','Tumbuhan paku',1420,400,150,130,`${A.fern(1420,500,1)}${A.fern(1540,480,.8,'sway d2')}`)}${A.fern(1250,500,.6,'sway d3')}
        ${hs('amfibi','Amfibi purba',1140,560,130,60,`<g class="hop">${A.amphibian(1140,590,1.2)}</g>`)}`)}
    `)
  };

  /* ================= MESOZOIKUM ================= */
  S.mesozoikum = {
    ambience:'fire', particles:[['dust']],
    hotspots:[
      {id:'sauro',label:'Dinosaurus leher panjang',say:'Dinosaurus leher panjang, seperti Brontosaurus. Ia makan tumbuhan.'},
      {id:'rex',label:'Tyrannosaurus',say:'Tyrannosaurus. Dinosaurus pemakan daging dengan gigi tajam.'},
      {id:'ptero',label:'Reptil terbang',say:'Pterosaurus, reptil yang bisa terbang. Ia kerabat dinosaurus.'},
      {id:'fosil',label:'Fosil',say:'Fosil. Sisa tulang yang membatu. Dari fosil kita tahu dinosaurus pernah hidup.'}],
    svg:()=>wrap(`
      ${sky('skyMeso',['#e9a37a','#f4c28f','#f8dcae','#f3e6c8'])}
      ${layer(.1,`<circle cx="360" cy="250" r="190" fill="url(#gGlowWarm)"/><circle cx="360" cy="250" r="70" fill="url(#gSun)"/>${A.cloud(900,140,1.2,'#fff1dc',.8)}${A.cloud(1400,200,1,'#fff1dc',.7,'cloud c2')}
        <g class="fly">${A.ptero(0,200,.55)}</g><g class="fly r2">${A.ptero(0,140,.4)}</g>`)}

      ${layer(.4,`<path d="M0 560 C300 540 700 580 1100 560 C1300 550 1450 570 1600 560 L1600 720 L0 720Z" fill="#7d9a5a"/>

  /* ---------- Adegan: Kubus stratigrafi Jawa (Sangiran–Bengawan Solo) ---------- */

  /* gradien & filter tambahan */
  const _inst=A.installDefs;

      <linearGradient id="gBoneM" gradientUnits="userSpaceOnUse" x1="0" y1="-100" x2="0" y2="40"><stop offset="0" stop-color="#ead9b3"/><stop offset="1" stop-color="#c9b083"/></linearGradient>

<script>

(function(J){
  const A=J.art, S=J.scenes;

  const facet = (d,fill,op=1) => `<path d="${d}" fill="${fill}" opacity="${op}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;

  /* ---------------- ALAT & BENDA (pusat 0,0; kira-kira 140 x 120) ---------------- */

  /* Kapak perimbas (chopper) Pacitan: kerakal sungai, satu sisi dipangkas kasar sehingga tajam bergerigi, sisi lain masih kulit batu halus */

    ${facet('M0 -58 C10 -52 18 -40 22 -28 L2 -20Z','#b3a690')}${facet('M0 -58 C-10 -52 -18 -40 -22 -28 L2 -20Z','#8f8270')}
    ${facet('M22 -28 C30 -12 36 0 36 8 L4 12 L2 -20Z','#9d907d')}${facet('M-22 -28 C-30 -12 -36 0 -36 8 L-4 12 L2 -20Z','#7d7061')}

    <path d="M-10 16 Q2 10 12 16 M-12 6 Q2 0 14 6 M-12 -4 Q0 -10 12 -6" stroke="${INK}" stroke-width="1.4" fill="none" opacity=".45"/></g>`;
  T.serpih = () => `${ground(66,46)}${flake(-40,10,-14,1.1)}${flake(-4,18,10,.95,'#a89b88')}${flake(22,6,-26,.8)}
    <g transform="translate(26 8)">${g(`<path d="M-30 34 C-22 20 14 -20 40 -40 C34 -24 -6 20 -22 40 C-26 42 -32 40 -30 34Z" fill="#ead9b3"/>`,'fInkBone')}<path d="M-20 30 C-4 10 18 -14 32 -30" stroke="#fffaf0" stroke-width="3" opacity=".6" fill="none"/></g>`;

  /* Kapak Sumatra (pebble): kerakal lonjong pipih, hanya satu sisi dipangkas */

  /* Babirusa merah, lukisan gua Sulawesi */

    <g fill="none" stroke="#a8442a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M-44 4 C-40 -16 -10 -22 16 -18 C30 -16 40 -10 46 -2 L56 4 L46 8 C40 20 20 24 -4 22 C-24 22 -42 18 -44 4Z" fill="#b8502e" fill-opacity=".55"/>
    <path d="M-30 20 L-34 40 M-14 22 L-12 42 M14 22 L12 42 M30 18 L34 38"/><path d="M42 -6 C46 -20 40 -28 32 -26 M48 -2 C56 -14 54 -24 46 -24"/><path d="M-44 4 C-52 2 -56 -6 -54 -12"/></g>`;
  /* Kapak persegi: diasah halus seluruhnya, berbentuk trapesium, mata kapak miring tajam, kadang bertangkai siku */
  T.persegi = (o={}) => `${ground(46,58)}${o.tangkai?`<g>${g(`<path d="M-8 -66 C-30 -66 -44 -50 -44 -30 L-40 60 L-26 60 L-30 -30 C-30 -44 -22 -52 -8 -52Z" fill="url(#gWood)"/>`)}<path d="M-46 -40 h20 M-46 -32 h20 M-46 -24 h20" stroke="#d9b98a" stroke-width="3"/></g>`:''}

  /* ---------------- DIORAMA 2: Ruang pamer empat zaman batu ---------------- */
  const vit=(n,x,title,items,wall='')=>`<g class="zone z${n}">

  /* ---------------- IKON (untuk kartu cerita, soal bergambar, pilihan alat) ---------------- */

  Object.assign(A.icon, {
    t_perimbas:icT('perimbas',1.05), t_genggam:icT('genggam',1), t_serpih:icT('serpih',1), t_tulang:icT('tulang',1), t_sumatra:icT('sumatra',1.05),
    t_pipisan:icT('pipisan',1.05,112), t_capTangan:icT('capTangan',1.05,100), t_babirusa:icT('babirusa',1.05,100), t_persegi:icT('persegi',1), t_persegiTangkai:icT('persegi',.95,100,{tangkai:true}),

    t_sarkofagus:icT('sarkofagus',.98,104), t_waruga:icT('waruga',1,100), t_punden:icT('punden',.95,100), t_nekara:icT('nekara',1,100), t_moko:icT('moko',1,100),
    t_candrasa:icT('candrasa',1,104), t_corong:icT('corong',.95,108), t_bivalve:icT('bivalve',.92), t_cireperdue:icT('cireperdue',.95,112), t_bejana:icT('bejana',1,100), t_kerang:icT('kerang',1.1,112),

  });

  /* ---------------- gradien & filter Bab 3 ---------------- */
  const _inst=A.installDefs;
  A.installDefs = () => { _inst(); if(document.getElementById('jpa-defs3')) return;
    const lg=(id,st,x2=1,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${st.map((c,i)=>`<stop offset="${i/(st.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;

      <filter id="fInkS" x="-15%" y="-15%" width="130%" height="135%"><feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="d"/><feFlood flood-color="${INK}"/><feComposite in2="d" operator="in" result="o"/><feGaussianBlur in="d" stdDeviation="4" result="b"/><feOffset in="b" dy="5" result="bo"/><feFlood flood-color="#2a1a0c" flood-opacity=".22"/><feComposite in2="bo" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs></svg>`); };
})(window.JPA);

</script>
<script>
/* Ilustrasi Bab 4 "Penaklukan Api & Tata Desa": gua malam dengan perapian (cahaya hangat berdenyut), harimau, alat pembuat api
   (bor kayu & batu pirit), desa melingkar tiga zona (domestik, produksi, sakral), bangunan & kegiatan, serta ikon. */
(function(J){
  const A=J.art, S=J.scenes;
  const ic = inner => `<svg class="icon" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#fbf1dc"/>${inner}</svg>`;
  const INK='#4a3a2c', T=(x,y,s=1,f=false)=>`translate(${x} ${y}) scale(${f?-s:s} ${s})`;
  const shadow=(w)=>`<ellipse cx="0" cy="0" rx="${w}" ry="${w*.18}" fill="#2a1a0c" opacity=".2"/>`;

  /* ---------------- MAKHLUK & BENDA ---------------- */
  /* Harimau. dark=true: siluet malam dengan mata menyala */
  A.tiger = (x,y,s=1,flip=false,cls='',dark=false) => { const fur=dark?'#1c1612':'url(#gTiger)', st=dark?'none':'#2e1a0e', wh=dark?'#1c1612':'#f6ead2';
    return `<g transform="${T(x,y,s,flip)}"><g class="${cls}">
    <path class="tail" d="M-96 -70 C-124 -74 -140 -96 -132 -124 C-130 -132 -120 -130 -122 -122 C-126 -100 -114 -86 -92 -84Z" fill="${fur}"/>
    <path d="M-86 -50 C-96 -30 -96 -12 -90 -2 L-72 -2 C-74 -16 -66 -30 -58 -44Z M-50 -44 C-46 -24 -50 -10 -48 -2 L-32 -2 C-32 -18 -26 -32 -24 -44Z" fill="${dark?fur:'#b85e1c'}"/>

    <path d="M-98 -72 C-100 -100 -60 -110 -10 -108 C40 -106 76 -104 92 -94 C110 -82 108 -54 90 -44 C70 -32 40 -36 10 -36 C-30 -34 -60 -30 -84 -40 C-96 -46 -98 -60 -98 -72Z" fill="${fur}"/>
    ${dark?'':`<path d="M-60 -38 C-20 -30 30 -32 70 -38 C50 -44 -30 -42 -60 -38Z" fill="${wh}" opacity=".8"/>
    ${[-72,-52,-30,-8,14,36,56].map((px,k)=>`<path d="M${px} -106 C${px-8} -92 ${px+6} -82 ${px-4} -${60+(k%2)*8}" stroke="${st}" stroke-width="${k%2?5:6.5}" fill="none" stroke-linecap="round"/>`).join('')}
    <path d="M-118 -112 l8 -4 M-128 -96 l8 -2" stroke="${st}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-80 -16 l12 0 M-44 -16 l12 0 M44 -16 l14 0 M76 -16 l14 0" stroke="${st}" stroke-width="4" stroke-linecap="round"/>`}
    <g class="nod"><path d="M80 -98 C82 -126 108 -138 132 -132 C156 -126 166 -104 160 -86 C154 -68 134 -60 112 -62 C92 -64 78 -78 80 -98Z" fill="${fur}"/>
      <path d="M88 -118 C84 -134 96 -140 104 -128Z M134 -134 C140 -146 154 -140 148 -126Z" fill="${fur}"/>
      ${dark?'':`<path d="M118 -86 C126 -70 150 -68 160 -84 C156 -66 136 -60 120 -66 C114 -72 114 -80 118 -86Z" fill="${wh}"/>

      <path d="M142 -80 l14 -2 M142 -76 l14 4" stroke="#fff" stroke-width="1.6" opacity=".8"/>`}
      <g class="eyes"><ellipse cx="124" cy="-104" rx="${dark?7:5}" ry="${dark?4.6:3.6}" fill="${dark?'#ffe066':'#2a1a10'}"/><ellipse cx="144" cy="-102" rx="${dark?6:4.4}" ry="${dark?4.2:3.2}" fill="${dark?'#ffe066':'#2a1a10'}"/>

  /* Bor api kayu: papan landasan berlekuk + batang yang diputar di antara telapak tangan */
  A.fireDrill = (x,y,s=1) => `<g transform="${T(x,y,s)}">${shadow(100)}

  /* Batu pirit (mengilap keemasan, berfaset kubus) dan batu pemukul */

  /* Gubuk tidur beratap ilalang */

    <path d="M-56 0 L-56 -48 L56 -48 L56 0Z" fill="#b48a56"/>${[-40,-24,-8,8,24,40].map(px=>`<path d="M${px} 0 L${px} -48" stroke="#8a6338" stroke-width="2"/>`).join('')}

      ${layer(.25,`<path d="M0 760 C160 730 220 820 380 830 C520 840 560 900 600 900 L0 900Z" fill="#7fb0c4"/><path class="wave" d="M40 790 C120 770 200 800 300 820" stroke="#d7ecf4" stroke-width="4" fill="none"/>

        <ellipse cx="${CX}" cy="${CY+18}" rx="${RX[2]+14}" ry="${RY[2]+12}" fill="#8f7a4e"/>
        <ellipse cx="${CX}" cy="${CY}" rx="${RX[2]}" ry="${RY[2]}" fill="${ringsFill[2]}"/>
        <path d="M${CX-RX[2]} ${CY} C${CX-RX[2]} ${CY-RY[2]*1.4} ${CX+RX[2]} ${CY-RY[2]*1.4} ${CX+RX[2]} ${CY} C${CX+RX[2]*.8} ${CY-RY[2]*.7} ${CX-RX[2]*.8} ${CY-RY[2]*.7} ${CX-RX[2]} ${CY}Z" fill="#a8925e" opacity=".55"/>
        <ellipse cx="${CX}" cy="${CY}" rx="${RX[1]}" ry="${RY[1]}" fill="${ringsFill[1]}"/>
        <ellipse cx="${CX}" cy="${CY}" rx="${RX[0]}" ry="${RY[0]}" fill="${ringsFill[0]}"/>

  const _inst=A.installDefs;

<script>
/* Ilustrasi Bab 5 "Pelayaran Leluhur Nusantara": peta kuno Asia Tenggara & Nusantara dengan ombak bergerak, rute migrasi bercahaya,
   perahu bercadik, rumah adat dan ikon budaya suku (Proto Melayu & Deutero Melayu), serta ikon & medali. */
(function(J){
  const A=J.art, S=J.scenes;
  const ic = inner => `<svg class="icon" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#fbf1dc"/>${inner}</svg>`;
  const T=(x,y,s=1,f=false)=>`translate(${x} ${y}) scale(${f?-s:s} ${s})`;

  /* ---------------- RUMAH ADAT & IKON BUDAYA (alas di y=0, lebar ±130) ---------------- */
  /* Tongkonan (Toraja): atap melengkung seperti perahu, tiang depan bertumpuk tanduk kerbau, ukiran merah-hitam-kuning */
  A.tongkonan = (x,y,s=1) => `<g transform="${T(x,y,s)}">${sh(130)}
    ${posts([-60,-30,0,30,60],-46,'#5a3a22',9)}

    ${[-56,-20,16,52].map(px=>`<g transform="translate(${px} -70)"><circle r="12" fill="none" stroke="#f0c44c" stroke-width="3"/><path d="M-12 0 H12 M0 -12 V12" stroke="#1f1612" stroke-width="3"/></g>`).join('')}
    <path d="M-74 -96 H74 M-74 -44 H74" stroke="#1f1612" stroke-width="4"/>
    <path d="M-140 -196 C-100 -120 100 -120 140 -196 L118 -170 C80 -112 -80 -112 -118 -170Z" fill="#3a2a22"/>
    <path d="M-118 -170 C-80 -112 80 -112 118 -170 L80 -96 L-80 -96Z" fill="url(#gThatch)"/>
    <path d="M-110 -160 C-70 -110 70 -110 110 -160" stroke="#f3dfa6" stroke-width="3" fill="none" opacity=".5"/>

    ${[0,1,2,3].map(k=>`<path d="M-140 ${-140+k*16} C-136 ${-150+k*16} -112 ${-150+k*16} -108 ${-140+k*16} L-112 ${-136+k*16} C-118 ${-142+k*16} -130 ${-142+k*16} -136 ${-136+k*16}Z" fill="#efe4cf" stroke="#8a7a62" stroke-width="1.5"/>`).join('')}
  </g>`;
  /* Rumah Bolon (Batak): atap pelana tinggi, ujung gevel menjulang, gorga merah-putih-hitam */
  A.bolon = (x,y,s=1) => `<g transform="${T(x,y,s)}">${sh(120)}

    <path d="M-84 -60 H84 M-86 -80 H86" stroke="#f3ead8" stroke-width="3"/>
    ${[-60,-30,0,30,60].map(px=>`<path d="M${px-10} -70 q10 -12 20 0 q-10 12 -20 0" fill="none" stroke="#1f1612" stroke-width="3"/>`).join('')}
    <path d="M-110 -96 C-60 -150 -40 -210 -100 -250 C-30 -220 30 -220 100 -250 C40 -210 60 -150 110 -96Z" fill="url(#gThatch)"/>
    <path d="M-62 -120 C-30 -190 30 -190 62 -120Z" fill="#7a2a1a"/>

  </g>`;
  /* Rumah Betang (Dayak): rumah panjang bertiang tinggi, tangga kayu */
  A.betang = (x,y,s=1) => `<g transform="${T(x,y,s)}">${sh(140)}
    ${posts([-120,-80,-40,0,40,80,120],-70,'#5e3c24',8)}

      {id:'peta', name:'Peta Pelayaran', short:'Peta Pelayaran', time:'±2.000 SM – 500 SM', cards:petaCards,
        pool:m=> m==='ramah'?QS.peta.ramah : [...QS.peta[m], ...bankPeta(m)]},
      {id:'suku', name:'Tebak Jejak Suku', short:'Jejak Suku', time:'Suku bangsa Nusantara', cards:sukuCards,
        pool:m=> m==='ramah'?QS.suku.ramah : [...QS.suku[m], ...bankSuku(m).filter(q=>!bankPeta(m).includes(q))]},
      {id:'penutup', name:'Penutup Perjalanan', short:'Penutup', time:'Sertifikat akhir'}
    ]
  };
})(window.JPA);

</script>
<script>
/* Pengelola diorama: memasang adegan, fase, kamera halus, paralaks kursor, partikel, suasana, dan hotspot. */
(function(J){
  J.Diorama = class {
    constructor(host, key, opts={}){
      this.host=host; this.key=key; this.sc=J.scenes[key]; this.opts=opts; this.phase=0;
      host.classList.add('diorama'); host.innerHTML=this.sc.svg();
      this.cam=J.$('.cam',host); this.root=J.$('svg.scene',host) || host;
      this.root.setAttribute && this.root.setAttribute('data-phase','0');
      this.fx=J.particles(J.$('canvas.fx',host), (this.sc.particles||[[]])[0]||[]);
      if(this.sc.canvas) this._startCanvas();
      this._parallax();
      J.$$('.hotspot',host).forEach(g=>{
        const act=e=>{ e.preventDefault(); this.opts.onHotspot && this.opts.onHotspot(g.dataset.hs, g); };
        g.addEventListener('click',act); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') act(e); });
      });
      J.sfx.ambience(this.sc.ambience);
      // kamera masuk: mulai sedikit membesar lalu melonggar
      this.setCam([.5,.5,1.18],true); requestAnimationFrame(()=>requestAnimationFrame(()=>this.setCam([.5,.5,1])));
    }
    setPhase(p){
      if(p==null) return; this.phase=p;
      if(this.root.setAttribute) this.root.setAttribute('data-phase',String(p));
      const parts=this.sc.particles||[[]]; this.fx.set(parts[Math.min(p,parts.length-1)]||[]);
      if(this._cv) { this._cv.phase=p; this._cv.pT0=performance.now(); }
    }
    setCam(c,instant){
      if(!c) return; const [x,y,s]=c;
      if(instant) this.cam.style.transition='none';
      this.cam.style.transformOrigin=`${x*100}% ${y*100}%`; this.cam.style.transform=`scale(${s})`;
      if(instant){ void this.cam.offsetWidth; this.cam.style.transition=''; }
    }
    explore(on){ this.host.classList.toggle('explore',on); this.fit(on); }
    /* Saat misi jelajah: bila ada benda yang terpotong tepi layar (layar sempit/tinggi), tampilkan adegan utuh. */
    fit(on){
      const svg=this.root; if(!svg || !svg.setAttribute || this.sc.canvas) return;
      let clip=false;
      if(on){ const r=this.host.getBoundingClientRect(), ha=r.width/Math.max(1,r.height), sa=1600/900;
        const vx=ha<sa?800*ha/sa:800, vy=ha>sa?450*sa/ha:450;
        J.$$('.hotspot .halo',this.host).forEach(e=>{
          const cx=+e.getAttribute('cx'), cy=+e.getAttribute('cy'), rx=+e.getAttribute('rx')*.6, ry=+e.getAttribute('ry')*.6;
          if(cx-rx<800-vx || cx+rx>800+vx || cy-ry<450-vy || cy+ry>450+vy) clip=true; }); }
      svg.setAttribute('preserveAspectRatio', clip?'xMidYMid meet':'xMidYMid slice');
      this.host.classList.toggle('fitted',clip);
    }
    showTag(g,text){
      const r=g.getBoundingClientRect(), h=this.host.getBoundingClientRect();
      let t=J.$('.tag',this.host); if(!t){ t=J.el('div',{class:'tag'}); this.host.appendChild(t); }
      t.textContent=text; t.style.left=Math.max(80,Math.min(h.width-80,r.left-h.left+r.width/2))+'px'; t.style.top=Math.max(60,r.top-h.top+10)+'px';
      t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
      clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove('show'),3600);
    }
    _parallax(){
      const layers=J.$$('.layer',this.host);
      this._mm=e=>{ const r=this.host.getBoundingClientRect(); const dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5;
        layers.forEach(l=>{ const d=+l.dataset.depth||0; l.style.transform=`translate(${(-dx*d*60).toFixed(1)}px,${(-dy*d*24).toFixed(1)}px)`; }); };
      this.host.addEventListener('pointermove',this._mm);
    }
    _startCanvas(){
      const cv=J.$('canvas.bb',this.host), c=cv.getContext('2d'), st=this._cv={phase:0,t0:performance.now(),pT0:performance.now(),data:this.sc.init(),alive:true};
      const loop=ts=>{ if(!st.alive) return; requestAnimationFrame(loop); if(!cv.isConnected||!cv.offsetParent) return;
        const dpr=Math.min(2,devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
        if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
        c.setTransform(dpr,0,0,dpr,0,0); this.sc.draw(c,W,H,(ts-st.t0)/1000,st.data,st.phase,(ts-st.pT0)/1000); };
      requestAnimationFrame(loop);
    }
    destroy(){ this.fx.stop(); if(this._cv) this._cv.alive=false; this.host.removeEventListener('pointermove',this._mm); }
  };
})(window.JPA);

</script>
<script>
/* Mesin kuis yang ramah: setiap pertanyaan & pilihan bisa dibacakan, umpan balik selalu menyemangati.
   Mode Ramah Baca: soal bergambar, boleh mencoba lagi sampai benar (petunjuk dibacakan), tanpa soal ketik.
   Mode lain: satu kali jawab per soal, nilai sebagian untuk menjodohkan & pilihan ganda kompleks. */
(function(J){
  const N=J.narrator, A=J.art, $=J.$, el=J.el;
  const PRAISE=['Hebat! Jawabanmu tepat.','Bagus sekali! Kamu benar.','Tepat! Kamu pintar.','Luar biasa, jawabanmu benar!'];
  const TYPE={mc:'Pilih satu jawaban',multi:'Pilih semua jawaban yang benar',tf:'Benar atau salah?',fill:'Ketik jawabanmu',match:'Pasangkan',pic:'Ketuk gambar yang benar',matchpic:'Pasangkan gambar dengan namanya'};
  const COLORS=['#3f7f9b','#c0603a','#6f9a4a','#d9a441','#8a5ea8'];

  J.Quiz = {
    /* opts: {host, title, questions, mode, pass, onDone(result)} */
    open(opts){
      const Q=this; Q.o=opts; Q.i=0; Q.score=0; Q.res=[]; Q.wrong=[]; Q.ramah=opts.mode==='ramah';
      let ov=$('.quiz',opts.host); if(!ov){ ov=el('div',{class:'quiz',role:'dialog','aria-modal':'true'}); opts.host.appendChild(ov); }
      Q.ov=ov; ov.innerHTML=`<div class="qcard card paper"></div>`; Q.card=$('.qcard',ov);
      requestAnimationFrame(()=>ov.classList.add('open')); Q.render();
    },
    close(){ if(this.ov){ this.ov.classList.remove('open'); N.stop(); } },
    render(){
      const Q=this, q=Q.o.questions[Q.i], n=Q.o.questions.length; Q.q=q; Q.tries=0; Q.locked=false;
      Q.card.innerHTML=`<div class="qtop"><span class="kicker">${Q.o.title} · Soal ${Q.i+1} dari ${n}</span><div class="qprog">${Q.o.questions.map((_,k)=>`<i class="${k<Q.res.length?(Q.res[k]>=1?'ok':Q.res[k]>0?'part':'no'):k===Q.i?'now':''}"></i>`).join('')}</div></div>
        <div class="row" style="margin-top:8px"><span class="chip">${TYPE[q.t]}</span></div>
        <div class="qtext">${q.q}</div><div class="qbody"></div><div class="fb" aria-live="polite"></div>`;
      const qt=$('.qtext',Q.card); qt.prepend(N.button(()=>Q.readAll(),'Bacakan soal',true)); qt.firstChild.style.cssText='float:right;margin-left:10px';
      const body=$('.qbody',Q.card);
      ({mc:Q.mc,multi:Q.multi,tf:Q.tf,fill:Q.fill,match:Q.match,pic:Q.pic,matchpic:Q.match}[q.t]).call(Q,q,body);
      N.autoSeq(Q.readItems());
    },
    readItems(){ const Q=this, items=[{text:J.plain(Q.q.q),el:$('.qtext',Q.card)}];
      $$opt(Q.card).forEach(b=>items.push({text:b.dataset.say||J.plain(b.innerHTML),el:b})); return items; },
    readAll(){ N.seq(this.readItems()); },

    /* ---------- tipe soal ---------- */
    optBtn(html,say,cls='opt'){
      const w=el('div',{class:'optwrap'}), b=el('button',{class:cls,type:'button','data-say':say},html);
      w.append(b, N.button(()=>({text:say,el:b}),'Bacakan pilihan',true)); return [w,b];
    },
    mc(q,body){ const Q=this, wrap=el('div',{class:'opts'});
      const opts=J.shuffle(q.o.map((t,i)=>({t,i})));
      const btns=opts.map((o,k)=>{ const [w,b]=Q.optBtn(`<span class="key">${'ABCDE'[k]}</span><span>${o.t}</span>`,J.plain(o.t)); wrap.append(w);
        b.onclick=()=>Q.choose(o.i===q.a,b,btns,()=>btns.find(x=>x._i===q.a),`Jawaban yang benar: <span class="ans">${q.o[q.a]}</span>`); b._i=o.i; return b; });
      body.append(wrap); },
    pic(q,body){ const Q=this, wrap=el('div',{class:'opts pics'});
      const opts=J.shuffle(q.o.map((o,i)=>({...o,i})));
      const btns=opts.map(o=>{ const [w,b]=Q.optBtn(`${A.icon[o.icon]}<span>${o.label}</span>`,o.label,'opt pic'); wrap.append(w); b._i=o.i;
        b.onclick=()=>Q.choose(o.i===q.a,b,btns,()=>btns.find(x=>x._i===q.a),`Jawaban yang benar: <span class="ans">${q.o[q.a].label}</span>`); return b; });
      body.append(wrap); },
    tf(q,body){ const Q=this, wrap=el('div',{class:'opts tfopts'});
      const btns=[true,false].map(v=>{ const [w,b]=Q.optBtn(`${v?A.icon.thumbUp:A.icon.thumbDown}<span>${v?'Benar':'Salah'}</span>`,v?'Benar':'Salah'); wrap.append(w); b._i=v;
        b.onclick=()=>Q.choose(v===q.a,b,btns,()=>btns.find(x=>x._i===q.a),`Pernyataan ini <span class="ans">${q.a?'BENAR':'SALAH'}</span>.`); return b; });
      body.append(wrap); },
    fill(q,body){ const Q=this, wrap=el('div',{class:'fill'});
      wrap.innerHTML=`<input type="text" autocomplete="off" spellcheck="false" aria-label="Jawaban" placeholder="Ketik jawabanmu di sini"><button class="btn green" type="button">Kirim</button>${q.h?`<div class="hint">Petunjuk: <b>${q.h}</b></div>`:''}`;
      body.append(wrap); const inp=$('input',wrap), b=$('button',wrap);
      const go=()=>{ if(!inp.value.trim()){ inp.focus(); return; } const ok=q.a.some(a=>J.norm(a)===J.norm(inp.value)); inp.disabled=b.disabled=true;
        Q.finish(ok?1:0, ok?'':`Jawaban yang benar: <span class="ans">${q.a[0]}</span>`); };
      b.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; setTimeout(()=>inp.focus({preventScroll:true}),400); },
    multi(q,body){ const Q=this, keys=new Set(q.a), sel=new Set(), wrap=el('div',{class:'opts'});
      body.innerHTML=`<p class="mhelp">Ketuk semua jawaban yang benar, lalu tekan <b>Kirim</b>.</p>`;
      const opts=J.shuffle(q.o.map((t,i)=>({t,i}))), send=el('button',{class:'btn green',type:'button',disabled:true},'Kirim');
      const btns=opts.map(o=>{ const [w,b]=Q.optBtn(`<span class="key"></span><span>${o.t}</span>`,J.plain(o.t)); wrap.append(w);
        b.onclick=()=>{ if(Q.locked) return; J.sfx.click(); sel.has(o.i)?sel.delete(o.i):sel.add(o.i); b.classList.toggle('picked',sel.has(o.i)); $('.key',b).innerHTML=sel.has(o.i)?J.ICON.check:''; send.disabled=!sel.size; }; b._i=o.i; return b; });
      const row=el('div',{class:'row',style:'justify-content:flex-end;margin-top:14px'}); row.append(send); body.append(wrap,row);
      send.onclick=()=>{ Q.locked=true; send.disabled=true; let g=0,w=0;
        btns.forEach(b=>{ b.disabled=true; const i=b._i; if(sel.has(i)&&keys.has(i)){g++;b.classList.add('ok');} else if(sel.has(i)){w++;b.classList.add('soft');} else if(keys.has(i)) b.classList.add('miss'); });
        const sc=Math.max(0,(g-w)/keys.size); Q.finish(sc, sc>=1?'':`Jawaban yang benar: `+q.a.map(i=>`<span class="ans">${q.o[i]}</span>`).join(', ')); }; },
    match(q,body){ const Q=this, pic=q.t==='matchpic', n=q.pairs.length, order=J.shuffle([...Array(n).keys()]), as=Array(n).fill(-1); let sel=0;
      body.innerHTML=`<p class="mhelp">${pic?'Ketuk gambar, lalu ketuk namanya.':'Ketuk satu kotak di kiri, lalu ketuk pasangannya di kanan.'}</p>`;
      const g=el('div',{class:'match'}), Lc=el('div',{class:'col'}), Rc=el('div',{class:'col'});
      const lb=q.pairs.map((p,i)=>{ const b=el('button',{class:'mi',type:'button','data-say':pic?'':J.plain(p[0])}); b.style.setProperty('--pc',COLORS[i%5]); Lc.append(b);
        b.onclick=()=>{ if(Q.locked) return; J.sfx.click(); as[i]=-1; sel=i; draw(); if(!pic) N.say(J.plain(p[0]),b); }; return b; });
      const rb=order.map(r=>{ const [w,b]=Q.optBtn('',J.plain(q.pairs[r][1]),'mi'); Rc.append(w); b._r=r;
        b.onclick=()=>{ if(Q.locked) return; J.sfx.click(); const li=as.indexOf(r); if(li>=0) as[li]=-1; if(sel<0){ draw(); return; } as[sel]=r; sel=as.indexOf(-1); draw(); check(); }; return b; });
      g.append(Lc,Rc); body.append(g);
      const send=el('button',{class:'btn green',type:'button'},'Periksa'); const row=el('div',{class:'row',style:'justify-content:flex-end;margin-top:14px'}); row.append(send);
      if(!pic || !Q.ramah) body.append(row);
      function draw(){
        lb.forEach((b,i)=>{ b.className='mi'+(as[i]>=0?' paired':'')+(i===sel?' sel':''); b.innerHTML=(pic?A.icon[q.pairs[i][0]]:`<span>${q.pairs[i][0]}</span>`)+(as[i]>=0?`<span class="ptag">${i+1}</span>`:''); });
        rb.forEach(b=>{ const li=as.indexOf(b._r); b.className='mi'+(li>=0?' paired':''); b.style.setProperty('--pc',li>=0?COLORS[li%5]:'#e6d0a8'); b.innerHTML=`<span>${q.pairs[b._r][1]}</span>`+(li>=0?`<span class="ptag">${li+1}</span>`:''); });
        send.disabled=as.includes(-1);
      }
      const check=()=>{ if(pic && Q.ramah && !as.includes(-1)) grade(); };
      function grade(){
        const right=as.filter((r,i)=>r===i).length;
        if(Q.ramah && right<n){ Q.tries++; J.sfx.soft(); lb.forEach((b,i)=>{ if(as[i]!==i){ as[i]=-1; b.classList.add('soft'); } }); sel=as.indexOf(-1); setTimeout(draw,700); Q.hint(); return; }
        Q.locked=true; lb.forEach((b,i)=>{ b.disabled=true; b.classList.add(as[i]===i?'ok':'soft'); }); rb.forEach(b=>b.disabled=true);
        Q.finish(right/n, right===n?'':`Kamu benar ${right} dari ${n}. Pasangan yang benar:<br>`+q.pairs.map(p=>`• ${pic?'':`<b>${p[0]}</b> → `}<span class="ans">${p[1]}</span>`).join('<br>'));
      }
      send.onclick=grade; draw(); },

    /* pilih jawaban (mc/pic/tf) */
    choose(ok,b,btns,getRight,extra){
      const Q=this; if(Q.locked) return;
      if(Q.ramah && !ok){ Q.tries++; b.classList.add('soft'); b.disabled=true; J.sfx.soft(); Q.hint(); return; }
      Q.locked=true; btns.forEach(x=>x.disabled=true); b.classList.add(ok?'ok':'soft'); if(!ok){ const r=getRight(); r&&r.classList.add('ok'); }
      Q.finish(ok?1:0, ok?'':extra);
    },
    hint(){ const Q=this, fb=$('.fb',Q.card), q=Q.q;
      fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><h4>Hampir tepat!</h4><p style="margin:0">Yuk kita dengarkan petunjuknya lagi. <b>${q.hint||''}</b></p></div>`;
      N.seq([{text:'Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+(q.hint||''),el:fb}]);
    },
    finish(sc,extra){
      const Q=this, q=Q.q, last=Q.i===Q.o.questions.length-1;
      const first = Q.ramah ? (Q.tries===0?1:.5) : sc;     // Ramah: tetap lanjut, nilai untuk bintang
      Q.res.push(first); Q.score+=first; if(sc<1) Q.wrong.push(q);
      const ok=sc>=1; ok?J.sfx.ok():J.sfx.soft();
      const fb=$('.fb',Q.card); fb.className='fb show '+(ok?'ok':'try');
      const head= ok ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : (sc>0?`Sebagian sudah benar!`:'Hampir tepat! Yuk lihat jawaban yang benar.');
      fb.innerHTML=`${A.face(ok)}<div class="body"><h4>${head}</h4>${extra?`<p style="margin:.2em 0">${extra}</p>`:''}${q.e?`<p style="margin:.2em 0;color:var(--ink2)">${q.e}</p>`:''}
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" type="button">${last?'Lihat hasil':'Soal berikutnya'} ${J.ICON.next}</button></div></div>`;
      const nb=$('.btn',fb); nb.onclick=()=>{ J.sfx.click(); N.stop(); if(last) Q.done(); else { Q.i++; Q.render(); } };
      if(ok && Q.i%2===0) J.celebrate(26);
      N.autoSeq([{text:J.plain(head+' '+(extra||'')+' '+(q.e||'')),el:fb}]);
      setTimeout(()=>{ fb.scrollIntoView({behavior:'smooth',block:'nearest'}); nb.focus({preventScroll:true}); },450);
    },
    done(){ const Q=this, total=Q.o.questions.length, pct=Q.score/total, pass=Q.ramah || pct>=Q.o.pass-1e-9;
      Q.o.onDone({score:Q.score,total,pct,pass,wrong:Q.wrong}); }
  };
  function $$opt(card){ return J.$$('.qbody .opt, .qbody .mi',card); }
})(window.JPA);

</script>
<script>
/* Kerangka aplikasi: status & penyimpanan, bar navigasi 5 Bab, pemilih mode, kontrol audio/narator, layar pembuka, perpindahan layar. */
(function(J){
