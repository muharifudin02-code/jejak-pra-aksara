      let k=0, miss=0;
      const full=J.scenes.hidup.svg(), inner=(full.match(/<svg class="scene"[^>]*>([\s\S]*)<\/svg>/)||[])[1]||'';
      const w=el('div',{class:'cocok-wrap'}), box=el('div',{class:'cocok-scene'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 3 · Mini-game penutup</span>${mapBtn}</div>
        <h2 style="margin:.1em 0">Cocokkan Era &amp; Kehidupan</h2><div class="kicker rk"></div><p class="txt q"></p><div class="row rb"></div>
        <div class="tools" role="group" aria-label="Pilihan alat"></div><div class="fb" aria-live="polite"></div><div class="row nav" style="justify-content:flex-end"></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); w.append(box,side); s.appendChild(w);
      const tools=$('.tools',card), fb=$('.fb',card);
      const nameOf=t=> ramah? (B.TOOLSIMPLE[t]||B.TOOLNAME[t]) : B.TOOLNAME[t];
      const iconOf=t=> A.icon['t_'+(t==='persegi'?'persegiTangkai':t)] || A.icon['t_'+t];
      const show=()=>{
        const r=rounds[k], q=r.q[ramah?'ramah':'other']||r.q.other;
        const cx=(r.zone-1)*400+200, vx=Math.max(0,Math.min(1600-560,cx-280));
        box.innerHTML=`<svg class="scene" viewBox="${vx} 430 560 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Diorama tahap ${['nomaden','semi-sedenter','sedenter','perundagian'][r.zone-1]}">${inner}
          <g class="droptarget"><circle cx="${r.at[0]}" cy="${r.at[1]}" r="46" fill="rgba(255,233,168,.35)" stroke="#e2a93b" stroke-width="5" stroke-dasharray="12 10"/>
          <text x="${r.at[0]}" y="${r.at[1]+8}" text-anchor="middle" font-size="30" font-weight="700" fill="#9a4526">?</text></g></svg>`;
        box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
        $('.rk',card).textContent=`Tugas ${k+1} dari ${rounds.length}`;
        const qp=$('.q',card); qp.innerHTML=q; const rb=$('.rb',card); rb.innerHTML=''; rb.appendChild(N.button(()=>({text:q,el:qp}),'Dengarkan lagi'));
        fb.className='fb'; fb.innerHTML=''; $('.nav',card).innerHTML='';
        const opts=J.shuffle(r.o.slice(0,nOpt)); tools.innerHTML='';
        opts.forEach(t=>{ const b=el('button',{class:'toolcard',type:'button','data-t':t,'aria-label':nameOf(t)},`<span class="ic">${iconOf(t)}</span><span class="tn">${nameOf(t)}</span>`); hookDrag(b,t); tools.appendChild(b); });
        N.autoSeq([{text:q,el:qp}]);
      };
      const choose=(t,b)=>{
        const r=rounds[k]; if(box.classList.contains('solved')) return;
        if(t===r.a){
          S.ok(); box.classList.add('solved'); J.$$('.toolcard',tools).forEach(x=>x.disabled=true); b.classList.add('ok');
          const sc = t==='menhir'?.8 : .34;
          $('.droptarget',box).insertAdjacentHTML('afterend',`<g class="placed" transform="translate(${r.at[0]} ${r.at[1]})"><g><g transform="scale(${sc})${t==='persegi'?' rotate(-20)':''}">${A.tool(t,r.opt)}</g></g></g>`);
          $('.droptarget',box).classList.add('gone'); J.celebrate(40);
          const okT=r.ok[ramah?'ramah':'other']||r.ok.other;
          fb.className='fb show ok'; fb.innerHTML=`${A.face(true)}<div class="body"><h4>${okT}</h4></div>`; say(okT,fb);
          const nx=el('button',{class:'btn green',type:'button'}, k<rounds.length-1?`Tugas berikutnya ${J.ICON.next}`:`${J.ICON.check} Selesai`);
          nx.onclick=()=>{ S.page(); box.classList.remove('solved'); k++; k<rounds.length?show():done(); };
          $('.nav',card).appendChild(nx); setTimeout(()=>nx.focus({preventScroll:true}),300);
        } else {
          miss++; S.soft(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          const h='Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+(r.hint[ramah?'ramah':'other']||r.hint.other);
          fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><p style="margin:0">${h}</p></div>`; say(h,fb);
        }
      };
      /* ketuk atau seret kartu alat ke diorama */
      const hookDrag=(b,t)=>{
        let sx=0, sy=0, ghost=null, drag=false;
        b.addEventListener('pointerdown',e=>{ if(b.disabled) return; sx=e.clientX; sy=e.clientY; drag=false; try{b.setPointerCapture(e.pointerId);}catch(_){} });
        b.addEventListener('pointermove',e=>{ if(!b.hasPointerCapture||!b.hasPointerCapture(e.pointerId)) return;
          if(!drag && Math.hypot(e.clientX-sx,e.clientY-sy)>10){ drag=true; ghost=el('div',{class:'tool-ghost'},$('.ic',b).innerHTML); document.body.appendChild(ghost); box.classList.add('dropping'); }
          if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; } });
        const end=e=>{ if(ghost){ ghost.remove(); ghost=null; box.classList.remove('dropping'); const r=box.getBoundingClientRect();
            if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) choose(t,b); }
          setTimeout(()=>{ drag=false; },0); };
        b.addEventListener('pointerup',end); b.addEventListener('pointercancel',e=>{ if(ghost){ghost.remove();ghost=null;box.classList.remove('dropping');} });
        b.addEventListener('click',()=>{ if(!drag) { S.click(); choose(t,b); } });
      };
      const done=()=>{
        const stars=miss===0?3:miss<=2?2:1; C.award('cocok',stars); S.win(); J.celebrate(140);
        const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'},`<div class="medal-big">${J.scenes.medal.cocok}</div><div class="kicker">Semua tugas selesai</div>
          <h2>Hebat! Kamu membantu manusia purba di setiap zaman</h2><div class="stars">${[1,2,3].map(q=>J.star(stars>=q)).join('')}</div>
          <p class="msg">${ramah?'Kamu sudah memilih alat yang tepat. Bab 3 selesai!':'Dari kapak perimbas untuk berburu sampai cetakan logam para undagi, kamu sudah mencocokkan alat dengan zamannya. Bab 3 selesai!'}</p><div class="row"></div>`);
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.check} Lihat sertifikat Bab 3`); go.onclick=()=>{ S.page(); C.complete(); };
        $('.row',c).append(go,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
        ov.appendChild(c); s.appendChild(ov); N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
      };
      show();
    },

    complete(){
      const s=App.screen('bab3-done','contour'), p=C.p(), total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      const c=el('div',{class:'card paper result'},`<div class="medal-big">${J.scenes.medal.batu}</div><div class="kicker">Sertifikat Penjelajah</div>
        <h2>Bab 3 "Cara Hidup &amp; Alat Batu–Logam" selesai!</h2><div class="stars">${J.star(true)}</div><p><b>${total}</b> dari ${ST.length*3} bintang · Mode ${J.MODES[mode()].name}</p>
        <p class="msg">Kamu sudah mengenal empat corak kehidupan, mengasah batu dari Paleolitikum sampai Neolitikum, dan mencocokkan alat dengan zamannya. Ayo lanjut ke Bab 4 "Penaklukan Api &amp; Tata Desa"!</p><div class="row"></div>`);
      const m=el('button',{class:'btn',type:'button'},`${J.ICON.map} Kembali ke peta`); m.onclick=()=>{ S.click(); C.map(); };
      const nx=el('button',{class:'btn green big',type:'button'},`Lanjut ke Bab 4 ${J.ICON.next}`); nx.onclick=()=>{ S.page(); App.openChapter('bab4'); };
      $('.row',c).append(nx,m,N.button(()=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}),'Bacakan'));
      const wr=el('div',{class:'center'}); wr.appendChild(c); s.appendChild(wr); S.win(); J.celebrate(160);
      N.autoSeq([{text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c}]);
    }
  };
})(window.JPA);

</script>
<script>
/* Bab 4 "Penaklukan Api & Tata Desa": peta → (1) diorama gua malam & empat fungsi api + mini-game Nyalakan Api Purba + kuis
   → (2) diorama desa melingkar tiga zona + kuis → (3) Tata Desa Melingkar (tempatkan bangunan di zona yang benar). */
(function(J){
  const N=J.narrator, S=J.sfx, A=J.art, App=J.App, $=J.$, el=J.el, B=J.BAB4;
  const ST=B.stations, POS=[[16,64],[50,30],[84,64]];
  const ramahM=()=>App.st.mode==='ramah', mode=()=>App.st.mode;
  const say=(t,e)=>N.say(t,e);
  const mapBtn=`<button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button>`;
  const speakCard=c=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c});

  const C = J.chapters.bab4 = {
    p(){ return App.prog('bab4'); },
    isDone(){ return ST.every(s=>C.p().stars[s.id]!=null); },
    nextIdx(){ const i=ST.findIndex(s=>C.p().stars[s.id]==null); return i<0?ST.length:i; },
    award(id,stars){ const p=C.p(); p.stars[id]=Math.max(p.stars[id]||0,stars); App.save(); App.topbar(); },

    /* ================= PETA ================= */
    map(){
      const s=App.screen('bab4-map','contour'), p=C.p(), nx=C.nextIdx(), ramah=ramahM();
      const wrap=el('div',{class:'mapwrap'}), head=el('div',{class:'card paper maphead'});
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      head.innerHTML=`<div><div class="kicker">Bab 4 · Ruang Pameran Keempat</div><h2>Penaklukan Api &amp; Tata Desa</h2>
        <p class="lead">${ramah?'Ayo buat api, lalu tata desa manusia purba!':'Temukan empat manfaat api, nyalakan api purba dengan tanganmu sendiri, lalu tata desa melingkar dengan tiga zonanya.'}</p></div>`;
      const right=el('div',{class:'row'});
      const mc=el('button',{class:'mode-chip',type:'button'},`${J.ICON.book} Mode ${J.MODES[mode()].name}`); mc.onclick=()=>{S.click();App.openModes();};
      right.append(el('span',{class:'chip'},`${J.star(true)} <span>${total} / ${ST.length*3} bintang</span>`), mc,
        N.button(()=>[{text:'Bab 4. Penaklukan Api dan Tata Desa.',el:$('h2',head)},{text:J.plain($('.lead',head).innerHTML),el:$('.lead',head)}],'Bacakan'));
      head.appendChild(right); wrap.appendChild(head);
      const map=el('div',{class:'map'});
      const pth=pts=>pts.map(([x,y],i)=>i?`S ${(pts[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      map.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="${pth(POS)}" fill="none" stroke="#e6d0a8" vector-effect="non-scaling-stroke" style="stroke-width:16px" stroke-linecap="round"/>
        <path d="${pth(POS)}" fill="none" stroke="#fffaf0" stroke-dasharray="2 8" vector-effect="non-scaling-stroke" style="stroke-width:4px" stroke-linecap="round"/>
        ${nx>0?`<path d="${pth(POS.slice(0,Math.min(nx+1,3)))}" fill="none" stroke="#d9a441" vector-effect="non-scaling-stroke" style="stroke-width:6px" stroke-linecap="round" opacity=".85"/>`:''}</svg>`;
      ST.forEach((st,i)=>{
        const done=p.stars[st.id]!=null, open=i<=nx, next=i===nx;
        const b=el('button',{class:'station'+(done?' done':'')+(open?' open':' locked')+(next?' next':''),type:'button',style:`left:${POS[i][0]}%;top:${POS[i][1]}%`,'aria-label':`${st.name}. ${done?'Selesai':open?'Terbuka':'Terkunci'}`},
          `<span class="medal">${J.scenes.medal[st.id]}${done?`<span class="badge">${J.ICON.check}</span>`:''}${!open?`<span class="lock">${J.ICON.lock}</span>`:''}</span>
           <span>${ramah?st.short:st.name}</span><small>${st.time}</small><span class="stars">${[1,2,3].map(k=>J.star(done&&p.stars[st.id]>=k)).join('')}</span>`);
        const lk=$('.lock svg',b); if(lk) lk.style.cssText='width:44px;height:44px;color:#6a5340';
        const bd=$('.badge svg',b); if(bd) bd.style.cssText='width:22px;height:22px';
        b.onclick=()=>{ if(!open){ S.soft(); J.toast('Selesaikan stasiun sebelumnya dulu, ya.'); say('Selesaikan stasiun sebelumnya dulu, ya.'); return; }
          S.page(); ({api:C.api,desa:C.desa,tata:C.tata})[st.id](st); };
        map.appendChild(b);
      });
      wrap.appendChild(map);
      if(C.isDone()){ const r=el('div',{class:'row',style:'justify-content:center;margin-top:10px'}); const b=el('button',{class:'btn green',type:'button'},`${J.ICON.check} Bab 4 selesai! Lihat sertifikat`); b.onclick=()=>{S.click();C.complete();}; r.appendChild(b); wrap.appendChild(r); }
      s.appendChild(wrap); S.ambience(null);
      N.autoSeq([{text: nx<ST.length?`Bab 4, Penaklukan Api dan Tata Desa. Stasiun berikutnya: ${ST[nx].short}.`:'Bab 4 selesai. Hebat!',el:head}]);
      setTimeout(()=>{ const f=$('.station.next',map); f&&f.focus({preventScroll:true}); },700);
    },

    frame(st,id){
      const s=App.screen(id), grid=el('div',{class:'era'}), host=el('div'), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 4 · ${st.time}</span>${mapBtn}</div>
        <h2>${st.name}</h2><div class="story"></div><div class="navrow"><div class="dots" aria-hidden="true"></div><div class="row nav"></div></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); grid.append(host,side); s.appendChild(grid);
      return {s,host,card,story:$('.story',card),dots:$('.dots',card),nav:$('.nav',card)};
    },
    storyRunner(...a){ return J.chapters.bab2.storyRunner(...a); },
    pick(pool,n){ return J.chapters.bab2.pick(pool,n); },
    quiz(st,host,again){
      const m=mode(), M=J.MODES[m], qs=C.pick(st.pool(m), m==='ramah'?3:M.n);
      J.Quiz.open({host,title:`Kuis ${st.short}`,questions:qs,mode:m,pass:M.pass,onDone:r=>{ J.Quiz.close(); C.result(st,host,r,again,()=>C.quiz(st,host,again)); }});
    },
    result(st,host,r,again,retryQuiz){
      const m=mode(), stars=r.pass?(r.pct>=.9?3:r.pct>=.65?2:1):0;
      const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'});
      const pctTxt = m==='ramah'?'':`<p>Benar ${J.fmt(r.score)} dari ${r.total} soal (${Math.round(r.pct*100)}%). Batas lulus ${Math.round(J.MODES[m].pass*100)}%.</p>`;
      if(r.pass){
        c.innerHTML=`<div class="medal-big">${J.scenes.medal[st.id]}</div><div class="kicker">Stasiun selesai</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][stars]} Kamu mendapat ${stars} bintang</h2>
          <div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>${pctTxt}<p class="msg">${st.name} selesai. Ayo lanjut ke stasiun berikutnya!</p><div class="row"></div>`;
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.map} Lanjut ke peta`); go.onclick=()=>{ S.page(); C.map(); };
        const re=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Ulangi kuis`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(go,re,N.button(()=>speakCard(c),'Bacakan'));
        C.award(st.id,stars); setTimeout(()=>{ S.win(); J.celebrate(120); },300);
      } else {

    fire(st){

        <div class="row rbtn"></div><div class="fire-tools" role="group" aria-label="Pilih alat pembuat api"></div>
        <div class="fire-steps"></div><p class="ftsay fire-say" aria-live="polite"></p><div class="row nav" style="justify-content:flex-end"></div>`;
      $('.msv',card).innerHTML=A.icon.a_api; $('.msv',card).style.cssText='width:56px;height:56px;flex:none';

      SN.forEach((n,i)=>steps.appendChild(el('div',{class:'fstep','data-i':i},`<i></i><span>${n}</span>`)));
      let tool='kayu';
      const tb=$('.fire-tools',card);
      [['kayu','Bor kayu','a_kayu'],['pirit','Batu pirit','a_pirit']].forEach(([k,n,ic])=>{ const b=el('button',{class:'toolcard'+(k===tool?' sel':''),type:'button','data-t':k,'aria-pressed':String(k===tool)},`<span class="ic">${A.icon[ic]}</span><span class="tn">${n}</span>`);
        b.onclick=()=>{ S.click(); tool=k; J.$$('.toolcard',tb).forEach(x=>{ x.classList.toggle('sel',x===b); x.setAttribute('aria-pressed',String(x===b)); }); svg.dataset.tool=k;
          const t=k==='kayu'?(ramah?'Gosok kayunya ke kiri dan kanan.':'Bor kayu: geser ke kiri dan kanan agar batang kayu berputar dan panas.'):(ramah?'Ketuk batunya berkali-kali.':'Batu pirit: ketuk berkali-kali agar batu pemukul memercikkan bunga api.');
          hint.innerHTML=`${J.ICON.next} ${k==='kayu'?(ramah?'Gosok di sini':'Geser ke kiri dan kanan'):(ramah?'Ketuk di sini':'Ketuk berkali-kali')}`; say(t); };
        tb.appendChild(b); });
      const stars=Array.from({length:30},(_,k)=>`<circle class="twinkle" style="animation-delay:-${(k*.41).toFixed(2)}s" cx="${(k*131)%800}" cy="${(k*53)%200}" r="${1.2+(k%3)*.6}" fill="#fff8e0"/>`).join('');
      site.innerHTML=`<svg class="fire-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Malam gelap. Nyalakan api di tengah.">
        <defs><linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1630"/><stop offset=".7" stop-color="#26304e"/><stop offset="1" stop-color="#2a2420"/></linearGradient>
          <radialGradient id="gWarmBig" cx=".5" cy=".8" r=".7"><stop offset="0" stop-color="#ffc66b" stop-opacity=".85"/><stop offset=".4" stop-color="#ff8a33" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a33" stop-opacity="0"/></radialGradient></defs>
        <rect width="800" height="500" fill="url(#gNight)"/>${stars}
        <circle cx="660" cy="80" r="26" fill="#f4efd8"/><circle cx="671" cy="73" r="23" fill="#14203d"/>
        <path d="M0 300 L120 210 L220 290 L330 200 L470 300 L600 220 L800 310 L800 500 L0 500Z" fill="#1a2236"/>
        <path d="M0 360 C200 330 600 330 800 360 L800 500 L0 500Z" fill="#2c2620"/>
        ${A.tree(60,370,.42,'sway',true)}${A.tree(750,380,.4,'sway d2',true)}
        <g class="preds">
          <g class="pred pl"><g transform="translate(10 400)">${A.tiger(0,0,.62,false,'prowl',true)}</g></g>
          <g class="pred pr"><g transform="translate(790 410)">${A.tiger(0,0,.7,true,'prowl d2',true)}</g></g>
          <g class="pred pt"><g transform="translate(640 300)">${A.tiger(0,0,.42,true,'prowl d3',true)}</g></g></g>
        <rect class="dark" width="800" height="500" fill="#05070f"/>
        <ellipse class="warm" cx="400" cy="420" rx="460" ry="300" fill="url(#gWarmBig)"/>
        <g transform="translate(400 430)"><ellipse cx="0" cy="8" rx="90" ry="16" fill="#120c08" opacity=".5"/>
          ${[-62,-36,-10,16,42,64].map((dx,k)=>`<ellipse cx="${dx}" cy="${(k%2)*4}" rx="17" ry="9" fill="url(#gRock)"/>`).join('')}
          <path d="M-40 -2 C-30 -16 30 -16 40 -2 C20 4 -20 4 -40 -2Z" fill="#b8915a"/>${Array.from({length:10},(_,k)=>`<path d="M${-34+k*7} -4 l${(k%2?6:-6)} -10" stroke="#d9b77a" stroke-width="2"/>`).join('')}</g>
        <g class="smk-g">${[0,1,2].map(k=>`<path class="smoke" style="animation-delay:-${k*1.2}s" d="M400 420 C390 390 410 370 400 340" stroke="#cfc8bd" stroke-width="10" fill="none" stroke-linecap="round"/>`).join('')}</g>
        <g class="ember"><ellipse cx="400" cy="420" rx="18" ry="8" fill="#ff7a2a"/><ellipse cx="400" cy="419" rx="8" ry="4" fill="#ffe08a"/></g>
        <g class="flame">${A.fire(400,428,1.15)}</g>
        <g class="tool-kayu"><g transform="translate(400 452) scale(.62)">${A.fireDrill(0,0,1)}</g></g>
        <g class="tool-pirit"><g transform="translate(470 452) scale(.75)">${A.pyrite(0,0,1)}</g></g>
      </svg><div class="whet-bar fire-bar" aria-hidden="true"><i></i><span style="left:30%"></span><span style="left:65%"></span></div>
      <div class="whet-hint">${J.ICON.next} ${ramah?'Gosok di sini':'Geser ke kiri dan kanan'}</div>`;
      site.setAttribute('tabindex','0'); site.setAttribute('role','button'); site.setAttribute('aria-label','Tempat menyalakan api. Gesek, ketuk, atau tekan Enter.');
      side.appendChild(card); wrap.append(site,side); s.appendChild(wrap);
      const cv=el('canvas',{class:'dust'}); site.appendChild(cv);
      const svg=$('svg',site), bar=$('.fire-bar i',site), hint=$('.whet-hint',site), sayEl=$('.fire-say',card);
      svg.dataset.tool=tool; svg.dataset.st='0';
      let heat=0, stage=0, done=false, lastSnd=0, spin=0;
      const P=[]; let raf=0, last=0;
      const spark=(n,big)=>{ const r=site.getBoundingClientRect(), b=svg.getBoundingClientRect();
        const sc=Math.max(b.width/800,b.height/500), ox=b.left+(b.width-800*sc)/2, oy=b.top+(b.height-500*sc)/2;
        const x=ox+(tool==='pirit'&&!big?440:400)*sc-r.left, y=oy+415*sc-r.top;
        for(let i=0;i<n;i++) P.push({x,y,vx:J.rand(-120,120)*(big?1.4:1),vy:J.rand(-260,-60)*(big?1.3:1),life:1,s:J.rand(1.2,3.2),c:Math.random()<.5?'#ffd36b':'#ff8a33'});
        if(!raf) raf=requestAnimationFrame(tick); };
      const tick=ts=>{ const r=site.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
        const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,r.width,r.height); const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts;
        c.globalCompositeOperation='lighter';
        for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=180*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.4; if(p.life<=0){P.splice(i,1);continue;} c.globalAlpha=p.life; c.fillStyle=p.c; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); }
        c.globalCompositeOperation='source-over';
        raf=P.length?requestAnimationFrame(tick):0; if(!raf){ last=0; c.clearRect(0,0,r.width,r.height); } };
      s._cleanup.push(()=>{ cancelAnimationFrame(raf); P.length=0; });
      const light=()=>{ $('.dark',svg).style.opacity=String(done?.04:.62-heat*.32); $('.warm',svg).style.opacity=String(done?1:heat*.55); };
      const setStage=k=>{ stage=k; svg.dataset.st=String(k); J.$$('.fstep',steps).forEach((r,i)=>{ r.classList.toggle('on',i===k-1); r.classList.toggle('seen',i<k-1); });
        sayEl.textContent=W.st[k]; say(W.st[k],sayEl); if(k<3){ S.discover(); J.celebrate(18); } };
      const add=d=>{ if(done) return; heat=Math.min(1,heat+d); bar.style.width=(heat*100)+'%'; light();
        const now=performance.now(); if(now-lastSnd>130){ lastSnd=now; tool==='kayu'?S.scrape(.2+heat*.6):S.click(); }
        spark(tool==='pirit'?7:Math.round(1+heat*4));
        const k=heat<.3?0:heat<.65?1:heat<1?2:3; if(k>stage) setStage(k);
        if(heat>=1){ done=true; finish(); } };
      const need = ramah?1800:2600;
      const strike=()=>{ const g=$('.tool-pirit',svg); g.classList.remove('hit'); void g.getBoundingClientRect(); g.classList.add('hit'); };
      const twist=dx=>{ spin+=dx; const d=$('.tool-kayu .drill',svg); if(d) d.style.transform=`scaleX(${Math.cos(spin/14).toFixed(2)})`; const h=$('.tool-kayu .hands',svg); if(h) h.style.transform=`translateX(${(Math.sin(spin/14)*10).toFixed(1)}px)`; };
      let down=false, lx=0, moved=0;
      site.addEventListener('pointerdown',e=>{ down=true; moved=0; lx=e.clientX; try{site.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); site.classList.add('active'); });
      site.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-lx; lx=e.clientX; const d=Math.abs(dx); moved+=d;
        if(tool==='kayu'&&d>1){ twist(dx); add(d/need); } });
      const up=()=>{ if(!down) return; down=false; site.classList.remove('active'); if(moved<8||tool==='pirit'){ if(tool==='pirit') strike(); else twist(14); add(tool==='pirit'?.07:.05); } };
      site.addEventListener('pointerup',up); site.addEventListener('pointercancel',up);
      site.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tool==='pirit'?strike():twist(20); add(.07); } });
      const finish=()=>{
        svg.dataset.st='3'; svg.classList.add('lit'); light(); spark(40,true); S.win(); S.ambience('fire'); J.celebrate(120);
        J.$$('.fstep',steps).forEach(r=>{ r.classList.remove('on'); r.classList.add('seen'); });
        hint.style.display='none';
        const nav=$('.nav',card); nav.innerHTML='';
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,s,()=>C.api(st)); };
        nav.appendChild(q);
        setTimeout(()=>say(ramah?'Hebat! Apinya menyala. Ayo main kuis.':'Hebat! Api menyala, gua menjadi terang dan hangat, dan hewan buas pergi. Sekarang, ayo kerjakan kuis.',q),2600);
        q.focus({preventScroll:true});
      };
      light();
      N.autoSeq([{text:'Nyalakan Api Purba. '+W.ins,el:$('.mission',card)}]);
      sayEl.textContent=W.st[0];
    },

    /* ================= STASIUN 2: ZONASI DESA ================= */

      const dio=App.diorama(f.host,'desa',{});

    /* ================= STASIUN 3: TATA DESA MELINGKAR ================= */
    tata(st){
      const s=App.screen('bab4-tata','contour'), ramah=ramahM(), m=mode(), D=A.DESA;
      const ids=Object.keys(B.ITEMS).filter(k=>{ const it=B.ITEMS[k]; return ramah?it.ramah : it.hard?m==='hard' : true; });
      let left=J.shuffle(ids.slice()), sel=null, miss=0;
      const w=el('div',{class:'cocok-wrap tata-wrap'}), box=el('div',{class:'cocok-scene tata-scene'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 4 · Mini-game penutup</span>${mapBtn}</div>
        <h2 style="margin:.1em 0">Tata Desa Melingkar</h2><div class="kicker rk"></div><p class="txt q"></p><div class="row rb"></div>
        <div class="tools" role="group" aria-label="Bangunan dan kegiatan"></div><div class="row rings" role="group" aria-label="Pilih zona"></div>
        <div class="fb" aria-live="polite"></div><div class="row nav" style="justify-content:flex-end"></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      box.innerHTML=A.desaSvg({ramah});
      side.appendChild(card); w.append(box,side); s.appendChild(w); S.ambience('fire');
      const svg=$('svg',box), tools=$('.tools',card), fb=$('.fb',card), qp=$('.q',card), rings=$('.rings',card);
      svg.removeAttribute('data-phase'); svg.setAttribute('viewBox','300 170 1000 640'); svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      const nameOf=id=>ramah?B.ITEMS[id].simple:B.ITEMS[id].name;
      const intro = ramah?'Pilih gambar, lalu ketuk lingkaran yang menyala.':'Pilih satu bangunan atau kegiatan, lalu ketuk atau seret ke zona yang tepat di peta desa.';
      [1,2,3].forEach(n=>{ const b=el('button',{class:'btn ghost ringbtn',type:'button','data-r':n},`${n}. ${ramah?['Dalam','Tengah','Luar'][n-1]:B.RING[n].name}`); b.onclick=()=>{ if(sel){ S.click(); place(sel,n); } else { S.soft(); say(intro,qp); } }; rings.appendChild(b); });
      /* garis panduan bercahaya dari bawah peta ke tempat tujuan + lingkaran berdenyut */
      const guide=id=>{ const it=B.ITEMS[id], [x,y]=A.DESA.OBJ[id].at, g=$('.guide',svg);
        g.setAttribute('d',`M800 900 Q ${(800+x)/2+(x<800?-120:120)} ${(900+y)/2+40} ${x} ${y}`); svg.classList.add('guiding'); svg.dataset.hl=String(it.ring);
        const t=ramah?`Ikuti garis yang menyala. ${nameOf(id)} ada di ${B.RING[it.ring].simple}.`:`Petunjuk: ${B.RING[it.ring].why}`;
        fb.className='fb show try'; fb.innerHTML=`<div class="body"><p style="margin:0">${t}</p></div>`; say(t,fb); };
      const unguide=()=>{ svg.classList.remove('guiding'); delete svg.dataset.hl; };
      const select=id=>{ sel=id; J.$$('.toolcard',tools).forEach(x=>x.classList.toggle('sel',x.dataset.t===id)); unguide(); fb.className='fb'; fb.innerHTML='';
        const t=ramah?`${nameOf(id)}. Di mana tempatnya?`:`${nameOf(id)}: letakkan di zona mana?`; qp.textContent=t; say(t,qp);
        if(ramah) setTimeout(()=>{ if(sel===id) guide(id); },1400); };
      const draw=()=>{
        $('.rk',card).textContent=`Sudah ditempatkan ${ids.length-left.length} dari ${ids.length}`;
        tools.innerHTML='';
        left.forEach(id=>{ const b=el('button',{class:'toolcard',type:'button','data-t':id,'aria-label':nameOf(id)},`<span class="ic">${A.icon[B.ITEMS[id].icon]}</span><span class="tn">${nameOf(id)}</span>`); hookDrag(b,id); tools.appendChild(b); });
        const rb=$('.rb',card); rb.innerHTML=''; rb.appendChild(N.button(()=>({text:qp.textContent,el:qp}),'Dengarkan lagi'));
        if(!ramah){ const h=el('button',{class:'btn ghost',type:'button'},`${J.ICON.search} Bantuan`); h.onclick=()=>{ S.click(); if(sel) guide(sel); else { S.soft(); say('Pilih dulu satu gambar.',qp); } }; rb.appendChild(h); }
      };
      const place=(id,ring)=>{
        const it=B.ITEMS[id];
        if(ring===it.ring){
          S.ok(); unguide(); const o=$(`.obj-${id}`,svg); o.classList.add('on'); svg.dataset.flash=String(ring); setTimeout(()=>{ delete svg.dataset.flash; },900);
          left=left.filter(x=>x!==id); sel=null; J.celebrate(30);
          const t=ramah?`Tepat! ${B.RING[ring].whyR}`:`Tepat! ${nameOf(id)} ada di ${B.RING[ring].name}. ${B.RING[ring].why}`;
          fb.className='fb show ok'; fb.innerHTML=`${A.face(true)}<div class="body"><h4>${t}</h4></div>`; say(t,fb);
          draw();
          if(!left.length) return setTimeout(done,1600);
          qp.textContent=ramah?'Pilih gambar berikutnya.':'Pilih bangunan atau kegiatan berikutnya.';
          if(ramah) setTimeout(()=>{ if(!sel&&left.length) select(left[0]); },2600);
        } else {
          miss++; S.soft(); const b=$(`.toolcard[data-t="${id}"]`,tools); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
          const h='Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+(ramah?`${nameOf(id)} ada di ${B.RING[it.ring].simple}.`:`${nameOf(id)} bukan di ${B.RING[ring].name}.`);
          fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><p style="margin:0">${h}</p></div>`; say(h,fb);
          if(ramah||miss>=2) setTimeout(()=>{ if(sel===id) guide(id); },ramah?2200:3200);
        }
      };
      /* titik layar → koordinat svg → zona (jarak elips ternormalisasi) */
      const ringAt=(cx,cy)=>{ const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
        const d=i=>Math.hypot((p.x-D.CX)/D.RX[i],(p.y-D.CY)/D.RY[i]);
        return d(0)<=1?1 : d(1)<=1?2 : d(2)<=1.3?3 : 0; };
      svg.addEventListener('click',e=>{ if(!sel){ S.soft(); say(intro,qp); return; } const r=ringAt(e.clientX,e.clientY); if(r) place(sel,r); else { S.soft(); say(ramah?'Ketuk di dalam lingkaran.':'Ketuk di dalam salah satu lingkaran zona.',qp); } });
      const hookDrag=(b,id)=>{
        let sx=0, sy=0, ghost=null, drag=false;
        b.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; drag=false; try{b.setPointerCapture(e.pointerId);}catch(_){} });
        b.addEventListener('pointermove',e=>{ if(!b.hasPointerCapture||!b.hasPointerCapture(e.pointerId)) return;
          if(!drag && Math.hypot(e.clientX-sx,e.clientY-sy)>10){ drag=true; sel=id; ghost=el('div',{class:'tool-ghost'},$('.ic',b).innerHTML); document.body.appendChild(ghost); box.classList.add('dropping'); }
          if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; } });
        const end=e=>{ if(ghost){ ghost.remove(); ghost=null; box.classList.remove('dropping'); const r=ringAt(e.clientX,e.clientY), bb=box.getBoundingClientRect();
            if(r && e.clientX>=bb.left&&e.clientX<=bb.right&&e.clientY>=bb.top&&e.clientY<=bb.bottom) place(id,r); }
          setTimeout(()=>{ drag=false; },0); };
        b.addEventListener('pointerup',end); b.addEventListener('pointercancel',()=>{ if(ghost){ghost.remove();ghost=null;box.classList.remove('dropping');} });
        b.addEventListener('click',()=>{ if(!drag){ S.click(); select(id); } });
      };
      const done=()=>{
        const stars=miss===0?3:miss<=2?2:1; C.award('tata',stars); S.win(); J.celebrate(140); svg.classList.add('complete');
        const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'},`<div class="medal-big">${J.scenes.medal.tata}</div><div class="kicker">Desa tertata</div>
          <h2>Hebat! Desa melingkar sudah tertata rapi</h2><div class="stars">${[1,2,3].map(q=>J.star(stars>=q)).join('')}</div>
          <p class="msg">${ramah?'Rumah di dalam, tempat kerja di tengah, tempat berdoa di luar. Bab 4 selesai!':'Zona Domestik di dekat perapian, Zona Produksi di tengah, dan Zona Sakral di lingkaran luar. Bab 4 selesai!'}</p><div class="row"></div>`);
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.check} Lihat sertifikat Bab 4`); go.onclick=()=>{ S.page(); C.complete(); };
        $('.row',c).append(go,N.button(()=>speakCard(c),'Bacakan'));
        ov.appendChild(c); s.appendChild(ov); N.autoSeq([speakCard(c)]);
      };
      draw(); qp.textContent=intro;
      N.autoSeq([{text:'Tata Desa Melingkar. '+intro,el:qp}]);
      if(ramah) setTimeout(()=>{ if(!sel&&left.length) select(left[0]); },3800);
    },

    complete(){
      const s=App.screen('bab4-done','contour'), p=C.p(), total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      const c=el('div',{class:'card paper result'},`<div class="medal-big">${J.scenes.medal.api}</div><div class="kicker">Sertifikat Penjelajah</div>
        <h2>Bab 4 "Penaklukan Api &amp; Tata Desa" selesai!</h2><div class="stars">${J.star(true)}</div><p><b>${total}</b> dari ${ST.length*3} bintang · Mode ${J.MODES[mode()].name}</p>
        <p class="msg">Kamu sudah mengenal empat manfaat api, menyalakan api purba, dan menata desa melingkar dengan tiga zona. Ayo lanjut ke Bab 5 "Pelayaran Leluhur Nusantara"!</p><div class="row"></div>`);
      const m=el('button',{class:'btn',type:'button'},`${J.ICON.map} Kembali ke peta`); m.onclick=()=>{ S.click(); C.map(); };
      const nx=el('button',{class:'btn green big',type:'button'},`Lanjut ke Bab 5 ${J.ICON.next}`); nx.onclick=()=>{ S.page(); App.openChapter('bab5'); };
      $('.row',c).append(nx,m,N.button(()=>speakCard(c),'Bacakan'));
      const wr=el('div',{class:'center'}); wr.appendChild(c); s.appendChild(wr); S.win(); J.celebrate(160);
      N.autoSeq([speakCard(c)]);
    }
  };
})(window.JPA);

</script>
<script>
/* Bab 5 "Pelayaran Leluhur Nusantara": peta → (1) diorama peta migrasi + mini-game Peta Pelayaran Animasi + kuis
   → (2) diorama pedalaman & pesisir + mini-game Tebak Jejak Suku + kuis → (3) Penutup perjalanan + Sertifikat Akhir. */
(function(J){
  const N=J.narrator, S=J.sfx, A=J.art, App=J.App, $=J.$, el=J.el, B=J.BAB5;
  const ST=B.stations, POS=[[16,64],[50,30],[84,64]];
  const ramahM=()=>App.st.mode==='ramah', mode=()=>App.st.mode;
  const say=(t,e)=>N.say(t,e);
  const mapBtn=`<button class="btn ghost" type="button" data-act="map" style="min-height:52px;padding:6px 16px;font-size:16px">${J.ICON.map} Peta</button>`;
  const speakCard=c=>({text:J.plain($('h2',c).innerHTML)+'. '+J.plain($('.msg',c).innerHTML),el:c});
  const P=()=>A.PLACES;

  const C = J.chapters.bab5 = {
    p(){ return App.prog('bab5'); },
    isDone(){ return ST.every(s=>C.p().stars[s.id]!=null); },
    nextIdx(){ const i=ST.findIndex(s=>C.p().stars[s.id]==null); return i<0?ST.length:i; },
    award(id,stars){ const p=C.p(); p.stars[id]=Math.max(p.stars[id]||0,stars); App.save(); App.topbar(); },

    /* ================= PETA BAB ================= */
    map(){
      const s=App.screen('bab5-map','contour'), p=C.p(), nx=C.nextIdx(), ramah=ramahM();
      const wrap=el('div',{class:'mapwrap'}), head=el('div',{class:'card paper maphead'});
      const total=ST.reduce((a,x)=>a+(p.stars[x.id]||0),0);
      head.innerHTML=`<div><div class="kicker">Bab 5 · Ruang Pameran Terakhir</div><h2>Pelayaran Leluhur Nusantara</h2>
        <p class="lead">${ramah?'Ayo berlayar bersama leluhur kita, lalu kenali suku-suku Nusantara!':'Layarkan perahu leluhur di jalur migrasi, kenali jejak suku bangsa Nusantara, lalu raih Sertifikat Akhir penjelajah Pra-Aksara.'}</p></div>`;
      const right=el('div',{class:'row'});
      const mc=el('button',{class:'mode-chip',type:'button'},`${J.ICON.book} Mode ${J.MODES[mode()].name}`); mc.onclick=()=>{S.click();App.openModes();};
      right.append(el('span',{class:'chip'},`${J.star(true)} <span>${total} / ${ST.length*3} bintang</span>`), mc,
        N.button(()=>[{text:'Bab 5. Pelayaran Leluhur Nusantara.',el:$('h2',head)},{text:J.plain($('.lead',head).innerHTML),el:$('.lead',head)}],'Bacakan'));
      head.appendChild(right); wrap.appendChild(head);
      const map=el('div',{class:'map'});
      const pth=pts=>pts.map(([x,y],i)=>i?`S ${(pts[i-1][0]+x)/2} ${y} ${x} ${y}`:`M ${x} ${y}`).join(' ');
      map.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="${pth(POS)}" fill="none" stroke="#e6d0a8" vector-effect="non-scaling-stroke" style="stroke-width:16px" stroke-linecap="round"/>
        <path d="${pth(POS)}" fill="none" stroke="#fffaf0" stroke-dasharray="2 8" vector-effect="non-scaling-stroke" style="stroke-width:4px" stroke-linecap="round"/>
        ${nx>0?`<path d="${pth(POS.slice(0,Math.min(nx+1,3)))}" fill="none" stroke="#d9a441" vector-effect="non-scaling-stroke" style="stroke-width:6px" stroke-linecap="round" opacity=".85"/>`:''}</svg>`;
      ST.forEach((st,i)=>{
        const done=p.stars[st.id]!=null, open=i<=nx, next=i===nx;
        const b=el('button',{class:'station'+(done?' done':'')+(open?' open':' locked')+(next?' next':''),type:'button',style:`left:${POS[i][0]}%;top:${POS[i][1]}%`,'aria-label':`${st.name}. ${done?'Selesai':open?'Terbuka':'Terkunci'}`},
          `<span class="medal">${J.scenes.medal[st.id]}${done?`<span class="badge">${J.ICON.check}</span>`:''}${!open?`<span class="lock">${J.ICON.lock}</span>`:''}</span>
           <span>${ramah?st.short:st.name}</span><small>${st.time}</small><span class="stars">${[1,2,3].map(k=>J.star(done&&p.stars[st.id]>=k)).join('')}</span>`);
        const lk=$('.lock svg',b); if(lk) lk.style.cssText='width:44px;height:44px;color:#6a5340';
        const bd=$('.badge svg',b); if(bd) bd.style.cssText='width:22px;height:22px';
        b.onclick=()=>{ if(!open){ S.soft(); J.toast('Selesaikan stasiun sebelumnya dulu, ya.'); say('Selesaikan stasiun sebelumnya dulu, ya.'); return; }
          S.page(); ({peta:C.peta,suku:C.suku,penutup:C.penutup})[st.id](st); };
        map.appendChild(b);
      });
      wrap.appendChild(map);
      if(C.isDone()){ const r=el('div',{class:'row',style:'justify-content:center;margin-top:10px'}); const b=el('button',{class:'btn green',type:'button'},`${J.ICON.check} Lihat Sertifikat Akhir`); b.onclick=()=>{S.click();C.complete();}; r.appendChild(b); wrap.appendChild(r); }
      s.appendChild(wrap); S.ambience(null);
      N.autoSeq([{text: nx<ST.length?`Bab 5, Pelayaran Leluhur Nusantara. Stasiun berikutnya: ${ST[nx].short}.`:'Bab 5 selesai. Hebat!',el:head}]);
      setTimeout(()=>{ const f=$('.station.next',map); f&&f.focus({preventScroll:true}); },700);
    },

    frame(st,id){
      const s=App.screen(id), grid=el('div',{class:'era'}), host=el('div'), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 5 · ${st.time}</span>${mapBtn}</div>
        <h2>${st.name}</h2><div class="story"></div><div class="navrow"><div class="dots" aria-hidden="true"></div><div class="row nav"></div></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); grid.append(host,side); s.appendChild(grid);
      return {s,host,card,story:$('.story',card),dots:$('.dots',card),nav:$('.nav',card)};
    },
    storyRunner(...a){ return J.chapters.bab2.storyRunner(...a); },
    pick(pool,n){ return J.chapters.bab2.pick(pool,n); },
    quiz(st,host,again){
      const m=mode(), M=J.MODES[m], qs=C.pick(st.pool(m), m==='ramah'?3:M.n);
      J.Quiz.open({host,title:`Kuis ${st.short}`,questions:qs,mode:m,pass:M.pass,onDone:r=>{ J.Quiz.close(); C.result(st,host,r,again,()=>C.quiz(st,host,again)); }});
    },
    result(st,host,r,again,retryQuiz){
      const m=mode(), stars=r.pass?(r.pct>=.9?3:r.pct>=.65?2:1):0;
      const ov=el('div',{class:'overlay'}), c=el('div',{class:'card paper result'});
      const pctTxt = m==='ramah'?'':`<p>Benar ${J.fmt(r.score)} dari ${r.total} soal (${Math.round(r.pct*100)}%). Batas lulus ${Math.round(J.MODES[m].pass*100)}%.</p>`;
      if(r.pass){
        c.innerHTML=`<div class="medal-big">${J.scenes.medal[st.id]}</div><div class="kicker">Stasiun selesai</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][stars]} Kamu mendapat ${stars} bintang</h2>
          <div class="stars">${[1,2,3].map(k=>J.star(stars>=k)).join('')}</div>${pctTxt}<p class="msg">${st.name} selesai. Ayo lanjut ke stasiun berikutnya!</p><div class="row"></div>`;
        const go=el('button',{class:'btn green big',type:'button'},`${J.ICON.map} Lanjut ke peta`); go.onclick=()=>{ S.page(); C.map(); };
        const re=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Ulangi kuis`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(go,re,N.button(()=>speakCard(c),'Bacakan'));
        C.award(st.id,stars); setTimeout(()=>{ S.win(); J.celebrate(120); },300);
      } else {
        c.innerHTML=`<div class="medal-big">${A.face(false)}</div><div class="kicker">Hampir berhasil</div><h2>Hampir tepat! Yuk kita dengarkan ceritanya lagi</h2>${pctTxt}
          <p class="msg">Tidak apa-apa. Dengarkan lagi ceritanya pelan-pelan, lalu coba kuisnya sekali lagi. Kamu pasti bisa!</p><div class="row"></div>`;
        const rd=el('button',{class:'btn',type:'button'},`${J.ICON.book} Dengarkan cerita lagi`); rd.onclick=()=>{ S.page(); ov.remove(); again(); };
        const re=el('button',{class:'btn green',type:'button'},`${J.ICON.retry} Coba kuis lagi`); re.onclick=()=>{ S.click(); ov.remove(); retryQuiz(); };
        $('.row',c).append(rd,re,N.button(()=>speakCard(c),'Bacakan'));
        S.soft();
      }
      ov.appendChild(c); host.appendChild(ov);
      N.autoSeq([speakCard(c)]);
      setTimeout(()=>{ const f=$('.btn',c); f&&f.focus({preventScroll:true}); },500);
    },
    /* kamera melalui viewBox: menggeser ke persegi [x,y,w,h] tiap fase */
    viewCam(host,dio,rects){
      const svg=$('svg.scene',host); let cur=rects[0].slice(), raf=0; $('.cam',host).style.transform='none';
      return n=>{ const to=rects[n]||rects[0], from=cur.slice(), t0=performance.now(), D=1100; cancelAnimationFrame(raf);
        const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); cur=from.map((v,i)=>v+(to[i]-v)*e); svg.setAttribute('viewBox',cur.map(v=>v.toFixed(1)).join(' ')); if(k<1) raf=requestAnimationFrame(step); };
        raf=requestAnimationFrame(step); dio.setPhase(n); };
    },

    /* ================= STASIUN 1: PETA PELAYARAN ================= */
    peta(st){
      const f=C.frame(st,'bab5-peta'), cards=st.cards[ramahM()?'ramah':mode()];
      const dio=App.diorama(f.host,'peta',{});
      f.host.appendChild(el('div',{class:'plate'},`<b>Peta Migrasi Leluhur</b><span class="pt"> · Asia Tenggara</span>`));
      C.storyRunner(f,cards,c=>dio.setPhase(c.phase||0),`${J.ICON.play} Mulai berlayar`,()=>C.voyage(st));
    },

    voyage(st){
      const s=App.screen('bab5-voy','contour'), ramah=ramahM(), m=mode(), R=A.ROUTES;
      const w=el('div',{class:'cocok-wrap voy-wrap'}), box=el('div',{class:'cocok-scene voy-scene'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 5 · Mini-game</span>${mapBtn}</div>
        <h2 style="margin:.1em 0">Peta Pelayaran</h2><div class="tools voy-routes" role="group" aria-label="Pilih artefak yang dibawa"></div>
        <p class="txt q" aria-live="polite"></p><div class="row rb"></div><div class="voy-steps" aria-hidden="true"></div>
        <div class="row voy-opts" role="group" aria-label="Pilih tujuan berikutnya"></div><div class="fb" aria-live="polite"></div><div class="row nav" style="justify-content:flex-end"></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      box.innerHTML=`<svg class="scene voy-svg" viewBox="40 30 1540 860" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Peta Nusantara. Ketuk pulau tujuan.">${A.mapDefs}${A.nusaMap({})}
        <g class="trails"></g><g class="voyboat" transform="translate(${P().yunan[0]} ${P().yunan[1]})"><g class="flip"><g transform="scale(.42)">${A.boat(0,0,1)}</g></g><g class="cargo" transform="translate(-14 -86) scale(.22)"></g></g></svg>`;
      side.appendChild(card); w.append(box,side); s.appendChild(w); S.ambience('sea');
      const svg=$('svg',box), qp=$('.q',card), fb=$('.fb',card), boat=$('.voyboat',svg), opts=$('.voy-opts',card), steps=$('.voy-steps',card), routesEl=$('.voy-routes',card);
      const done=new Set(); let r=null, idx=0, miss=0, rmiss=0, moving=false, bx=P().yunan[0], by=P().yunan[1];
      const pname=k=>P()[k][2];
      const target=()=>R[r][idx+1];
      const showGlow=()=> ramah || m==='beginner' || (m==='medium'&&rmiss>=1) || rmiss>=2;
      const mark=()=>{ J.$$('.place',svg).forEach(g=>{ const k=g.dataset.p; g.classList.toggle('next',!!r&&k===target()&&showGlow()); g.classList.toggle('visited',!!r&&R[r].indexOf(k)>=0&&R[r].indexOf(k)<=idx); }); };
      const drawRoutes=()=>{ routesEl.innerHTML='';
        Object.keys(R).forEach(k=>{ const v=B.VOY[k], b=el('button',{class:'toolcard'+(k===r?' sel':'')+(done.has(k)?' ok':''),type:'button','data-r':k,'aria-pressed':String(k===r)},
          `<span class="ic">${A.icon[v.icon]}</span><span class="tn">${ramah?v.simple:v.art}</span>${done.has(k)?`<small class="okmark">${J.ICON.check}</small>`:''}`);
          b.disabled=done.has(k)||(moving); b.onclick=()=>{ S.click(); start(k); }; routesEl.appendChild(b); }); };
      const drawSteps=()=>{ steps.innerHTML=r?R[r].map((k,i)=>`<span class="vs${i<=idx?' on':''}${i===idx+1?' nx':''}">${i<=idx||ramah||m==='beginner'?pname(k):'?'}</span>`).join('<i></i>'):''; };
      const drawOpts=()=>{ opts.innerHTML=''; if(!r||idx>=R[r].length-1) return;
        const t=target(), pool=Object.keys(P()).filter(k=>k!==t&&R[r].indexOf(k)<0);
        const ch=J.shuffle([t,...J.shuffle(pool).slice(0,ramah?1:2)]);
        ch.forEach(k=>{ const b=el('button',{class:'btn ghost',type:'button'},pname(k)); b.onclick=()=>{ S.click(); go(k,b); }; opts.appendChild(b); }); };
      const ask=()=>{ const t=target(), from=pname(R[r][idx]);
        const txt= ramah?`Ketuk titik yang menyala.`: idx===0?B.VOY[r].start.other:`Dari ${from}, perahu berlayar ke mana?`;
        qp.textContent=txt; const rb=$('.rb',card); rb.innerHTML=''; rb.appendChild(N.button(()=>({text:qp.textContent,el:qp}),'Dengarkan lagi'));
        mark(); drawSteps(); drawOpts(); };
      const placeBoat=(x,y,dir)=>{ boat.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`); if(dir) $('.flip',boat).setAttribute('transform',dir<0?'scale(-1 1)':''); };
      const start=k=>{ if(moving) return; r=k; idx=0; rmiss=0; bx=P().yunan[0]; by=P().yunan[1]; placeBoat(bx,by,1);
        $('.cargo',boat).innerHTML=A.tool({barat:'persegi',timur:'lonjong',dongson:'nekara'}[k]);
        fb.className='fb'; fb.innerHTML=''; drawRoutes(); ask();
        const t=B.VOY[k]; say(ramah?t.start.ramah:`${t.name}. ${t.start.other}`,qp); };
      const go=(k,btn)=>{
        if(!r||moving) return;
        const t=target();
        if(k===t){
          S.ok(); moving=true; drawRoutes(); opts.innerHTML=''; fb.className='fb'; fb.innerHTML='';
          const from=R[r][idx], d=A.seg(from,t);
          const tr=document.createElementNS('http://www.w3.org/2000/svg','path');
          tr.setAttribute('d',d); tr.setAttribute('class','trail'); tr.setAttribute('stroke',A.ROUTECOL[r]); tr.setAttribute('pathLength','1'); $('.trails',svg).appendChild(tr);
          const ghost=document.createElementNS('http://www.w3.org/2000/svg','path'); ghost.setAttribute('d',d);
          const L=ghost.getTotalLength(), D=Math.max(1200,Math.min(2600,L*5)), t0=performance.now();
          const step=now=>{ const q=Math.min(1,(now-t0)/D), e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2, pt=ghost.getPointAtLength(L*e), pt2=ghost.getPointAtLength(Math.min(L,L*e+2));
            placeBoat(pt.x,pt.y,pt2.x<pt.x-.2?-1:pt2.x>pt.x+.2?1:0); tr.style.strokeDashoffset=String(1-e);
            if(q<1) requestAnimationFrame(step); else arrive(t); };
          requestAnimationFrame(step); S.page && S.page();
        } else {
          miss++; rmiss++; S.soft();
          const g=$(`.pl-${k}`,svg); if(g){ g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake'); }
          if(btn){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
          const h='Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+(ramah?'Ketuk titik yang menyala.':`Setelah ${pname(R[r][idx])}, ${B.VOY[r].art.toLowerCase()} dibawa ke ${showGlow()||rmiss>=1?pname(t):'pulau berikutnya'}.`);
          fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><p style="margin:0">${h}</p></div>`; say(h,fb); mark();
        }
      };
      const arrive=k=>{ moving=false; idx++; rmiss=0; bx=P()[k][0]; by=P()[k][1];
        const g=$(`.pl-${k}`,svg); g.classList.add('arrive'); setTimeout(()=>g.classList.remove('arrive'),900); J.celebrate(16);
        if(idx>=R[r].length-1){
          done.add(r); const v=B.VOY[r], t=ramah?v.end.ramah:v.end.other;
          fb.className='fb show ok'; fb.innerHTML=`${A.face(true)}<div class="body"><h4>${t}</h4></div>`; say(t,fb); S.win(); J.celebrate(70);
          svg.classList.add('rt-done-'+r); const fin=r; r=null; mark(); drawSteps(); opts.innerHTML='';
          if(done.size===3) return finish(); drawRoutes();
          const nxk=Object.keys(R).find(x=>!done.has(x)); qp.textContent=ramah?'Pilih benda berikutnya.':'Pilih artefak berikutnya untuk dilayarkan.';
          if(ramah) setTimeout(()=>{ if(!r) start(nxk); },3200);
          return;
        }
        say(pname(k)+(ramah?'!':'. '+(idx===R[r].length-2?'Satu tujuan lagi.':'')),qp); ask(); drawRoutes(); };
      svg.addEventListener('click',e=>{ const g=e.target.closest('.place'); if(!g) return; if(!r){ S.soft(); say(ramah?'Pilih bendanya dulu.':'Pilih dulu artefak yang akan dibawa.',qp); return; } if(g.dataset.p===R[r][idx]) return; go(g.dataset.p); });
      const finish=()=>{
        drawRoutes(); J.celebrate(120); svg.classList.add('all-done');
        qp.innerHTML=ramah?'Semua perahu sudah sampai!':'Ketiga jalur pelayaran sudah lengkap. Lihat garis rutenya di peta!';
        const nav=$('.nav',card); nav.innerHTML='';
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,s,()=>C.peta(st)); };
        nav.appendChild(q); setTimeout(()=>say(ramah?'Hebat! Semua perahu sudah sampai. Ayo main kuis.':'Hebat! Kamu sudah melayarkan ketiga jalur migrasi leluhur. Sekarang, ayo kerjakan kuis.',q),2800);
      };
      drawRoutes(); qp.textContent=ramah?'Pilih benda yang dibawa perahu.':'Pilih artefak yang dibawa, lalu ketuk pulau-pulau sesuai urutan rutenya.';
      N.autoSeq([{text:'Peta Pelayaran. '+qp.textContent,el:qp}]);
      setTimeout(()=>{ if(!r) start('barat'); }, ramah?3600:5200);
    },

    /* ================= STASIUN 2: TEBAK JEJAK SUKU ================= */
    suku(st){
      const f=C.frame(st,'bab5-suku'), cards=st.cards[ramahM()?'ramah':mode()];
      const dio=App.diorama(f.host,'suku',{});
      f.host.appendChild(el('div',{class:'plate'},`<b>Diorama Suku Nusantara</b><span class="pt"> · Pedalaman &amp; Pesisir</span>`));
      const go=C.viewCam(f.host,dio,[[0,0,1600,900],[0,180,860,720],[740,180,860,720]]);
      C.storyRunner(f,cards,c=>go(c.phase||0),`${J.ICON.play} Tebak Jejak Suku`,()=>C.sort(st));
    },

    sort(st){
      const s=App.screen('bab5-sort','contour'), ramah=ramahM(), m=mode(), G=B.GROUP;
      const items=B.SUKU.filter(x=> ramah?x.set==='r' : m==='beginner'?x.set!=='m' : true);
      let left=J.shuffle(items.slice()), sel=null, miss=0, imiss=0;
      const w=el('div',{class:'sort-wrap'}), bins=el('div',{class:'bins'}), side=el('div',{class:'side'}), card=el('div',{class:'card paper'});
      ['proto','deutero'].forEach(g=>{ const b=el('button',{class:'bin bin-'+g,type:'button','data-g':g,'aria-label':`${G[g].name}, ${G[g].where}`},
        `<span class="binhead"><span class="ic">${A.icon[G[g].icon]}</span><span><b>${ramah?G[g].simple:G[g].name}</b><small>${ramah?(g==='proto'?'tinggal di gunung':'tinggal di pantai'):G[g].where}</small></span></span><span class="binlist"></span>`);
        b.onclick=()=>{ if(!sel){ S.soft(); say(ramah?'Pilih gambar suku dulu.':'Pilih dulu satu suku.',qp); return; } S.click(); drop(sel,g); };
        bins.appendChild(b); });
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 5 · Mini-game</span>${mapBtn}</div>
        <h2 style="margin:.1em 0">Tebak Jejak Suku</h2><div class="kicker rk"></div><p class="txt q" aria-live="polite"></p><div class="row rb"></div>
        <div class="tools sort-tools" role="group" aria-label="Suku bangsa"></div><div class="fb" aria-live="polite"></div><div class="row nav" style="justify-content:flex-end"></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      side.appendChild(card); w.append(bins,side); s.appendChild(w); S.ambience('sea');
      const qp=$('.q',card), fb=$('.fb',card), tools=$('.sort-tools',card);
      const intro=ramah?'Ketuk gambar suku. Dengarkan. Lalu ketuk Melayu Tua atau Melayu Muda.':'Ketuk sebuah suku untuk mendengar cirinya, lalu masukkan ke kelompok Proto Melayu atau Deutero Melayu. Kartu juga bisa diseret.';
      const select=it=>{ sel=it; imiss=0; J.$$('.toolcard',tools).forEach(x=>x.classList.toggle('sel',x.dataset.t===it.id)); J.$$('.bin',bins).forEach(b=>b.classList.remove('hint'));
        const t=`Suku ${it.name}. ${it.info}`+(ramah?'':' Termasuk kelompok mana?'); qp.textContent=t; say(t,qp); fb.className='fb'; fb.innerHTML=''; };
      const draw=()=>{ $('.rk',card).textContent=`Sudah dikelompokkan ${items.length-left.length} dari ${items.length}`; tools.innerHTML='';
        left.forEach(it=>{ const b=el('button',{class:'toolcard',type:'button','data-t':it.id,'aria-label':'Suku '+it.name},`<span class="ic">${A.icon[it.icon]}</span><span class="tn">${it.name}</span>`); hook(b,it); tools.appendChild(b); });
        const rb=$('.rb',card); rb.innerHTML=''; rb.appendChild(N.button(()=>({text:qp.textContent,el:qp}),'Dengarkan lagi')); };
      const drop=(it,g)=>{
        if(it.g===g){
          S.ok(); left=left.filter(x=>x!==it); sel=null; J.$$('.bin',bins).forEach(b=>b.classList.remove('hint'));
          const bin=$('.bin-'+g,bins); $('.binlist',bin).insertAdjacentHTML('beforeend',`<span class="chipsuku"><span class="ic">${A.icon[it.icon]}</span>${it.name}</span>`);
          bin.classList.remove('flash'); void bin.offsetWidth; bin.classList.add('flash'); J.celebrate(24);
          const t=ramah?`Tepat! ${it.name} termasuk ${G[g].simple}.`:`Tepat! ${it.name} keturunan ${G[g].name}. ${G[g].hint}`;
          fb.className='fb show ok'; fb.innerHTML=`${A.face(true)}<div class="body"><h4>${t}</h4></div>`; say(t,fb);
          draw(); qp.textContent=left.length?(ramah?'Pilih gambar berikutnya.':'Pilih suku berikutnya.'):'';
          if(!left.length) return setTimeout(finish,1500);
          if(ramah) setTimeout(()=>{ if(!sel&&left.length) select(left[0]); },3000);
        } else {
          miss++; imiss++; S.soft(); const b=$(`.toolcard[data-t="${it.id}"]`,tools); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
          const h='Hampir tepat! Yuk kita dengarkan petunjuknya lagi. '+it.info+' '+(ramah?G[it.g].hintR:G[it.g].hint);
          fb.className='fb show try'; fb.innerHTML=`${A.face(false)}<div class="body"><p style="margin:0">${h}</p></div>`; say(h,fb);
          if(ramah||imiss>=2) $('.bin-'+it.g,bins).classList.add('hint');
        }
      };
      const hook=(b,it)=>{
        let sx=0, sy=0, ghost=null, drag=false;
        b.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; drag=false; try{b.setPointerCapture(e.pointerId);}catch(_){} });
        b.addEventListener('pointermove',e=>{ if(!b.hasPointerCapture||!b.hasPointerCapture(e.pointerId)) return;
          if(!drag && Math.hypot(e.clientX-sx,e.clientY-sy)>10){ drag=true; ghost=el('div',{class:'tool-ghost'},$('.ic',b).innerHTML); document.body.appendChild(ghost); bins.classList.add('dropping'); }
          if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; } });
        const end=e=>{ if(ghost){ ghost.remove(); ghost=null; bins.classList.remove('dropping');
            const bin=J.$$('.bin',bins).find(x=>{ const r=x.getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; });
            if(bin){ sel=it; drop(it,bin.dataset.g); } }
          setTimeout(()=>{ drag=false; },0); };
        b.addEventListener('pointerup',end); b.addEventListener('pointercancel',()=>{ if(ghost){ghost.remove();ghost=null;bins.classList.remove('dropping');} });
        b.addEventListener('click',()=>{ if(!drag){ S.click(); select(it); } });
      };
      const finish=()=>{
        S.win(); J.celebrate(120);
        qp.textContent=ramah?'Semua suku sudah di tempatnya!':'Semua suku sudah dikelompokkan. Hebat!';
        const nav=$('.nav',card); nav.innerHTML='';
        const q=el('button',{class:'btn green big',type:'button'},`${J.ICON.play} Mulai kuis`); q.onclick=()=>{ S.page(); C.quiz(st,s,()=>C.suku(st)); };
        nav.appendChild(q); q.focus({preventScroll:true});
        setTimeout(()=>say(ramah?'Hebat! Semua suku sudah di tempatnya. Ayo main kuis.':'Hebat! Kamu sudah mengelompokkan suku-suku Nusantara. Sekarang, ayo kerjakan kuis.',q),2600);
      };
      draw(); qp.textContent=intro; N.autoSeq([{text:'Tebak Jejak Suku. '+intro,el:qp}]);
      if(ramah) setTimeout(()=>{ if(!sel&&left.length) select(left[0]); },5200);
    },

    /* ================= STASIUN 3: PENUTUP ================= */
    praise(btn){ const t=B.PRAISE[mode()]||B.PRAISE.beginner; S.win(); J.celebrate(140); say(t,btn); },
    penutup(st){
      const s=App.screen('bab5-end','contour'), ramah=ramahM();
      const lines=B.CLOSING[ramah?'ramah':'other'];
      const wrap=el('div',{class:'closing'}), card=el('div',{class:'card paper closing-card'});
      const chs=J.CHAPTERS.map(c=>{ const med={bab1:A.icon.timeline,bab2:A.icon.skull||A.icon.bone,bab3:J.scenes.medal.batu,bab4:J.scenes.medal.api,bab5:J.scenes.medal.peta}[c.id]||A.icon.timeline;
        return `<div class="tl-item"><span class="tl-med">${med}</span><b>Bab ${c.n}</b><small>${c.name}</small></div>`; }).join('<i class="tl-line"></i>');
      card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="kicker">Bab 5 · Penutup Perjalanan</span>${mapBtn}</div>
        <h2>${ramah?'Perjalanan kita selesai!':'Akhir perjalanan: Masa Pra-Aksara, masa penuh kecerdasan'}</h2>
        <div class="timeline5">${chs}</div><div class="closing-lines"></div><div class="row cl-act"></div>`;
      $('[data-act=map]',card).onclick=()=>{ S.click(); C.map(); };
      const cl=$('.closing-lines',card);
      lines.forEach(t=>{ const r=el('div',{class:'cline'}); const p=el('p',{class:'txt'},t); r.append(p,N.button(()=>({text:J.plain(t),el:p}),'Bacakan',true)); cl.appendChild(r); });
      const pr=el('button',{class:'btn big praise',type:'button'},`${J.ICON.retry} Putar suara pujian`); pr.onclick=()=>{ C.praise(pr); };
      const ce=el('button',{class:'btn green big',type:'button'},`${J.ICON.check} Lihat Sertifikat Akhir`); ce.onclick=()=>{ S.page(); C.award('penutup',3); C.complete(); };
      $('.cl-act',card).append(pr,ce);
      wrap.appendChild(card); s.appendChild(wrap); S.ambience('sea');
      N.autoSeq(lines.map((t,i)=>({text:J.plain(t),el:cl.children[i]})));
      setTimeout(()=>{ J.celebrate(60); },600);
    },

    /* ================= SERTIFIKAT AKHIR ================= */
    complete(){
      const s=App.screen('bab5-cert','contour'), m=mode(), ramah=ramahM();
      const pr=App.st.prog[m]||{};
      const rows=J.CHAPTERS.map(c=>{ const st=(pr[c.id]||{stars:{}}).stars, n=Object.values(st).reduce((a,v)=>a+(v||0),0), done=J.chapters[c.id]&&J.chapters[c.id].isDone();
        return {c,n,done}; });
      const total=rows.reduce((a,r)=>a+r.n,0), allDone=rows.every(r=>r.done);
      const date=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
      const nm=App.st.player||'';
      const wr=el('div',{class:'center cert-wrap'}), c=el('div',{class:'card paper cert'});
      c.innerHTML=`<div class="cert-in"><div class="cert-medal">${A.icon.trophy}</div><div class="kicker">Sertifikat Akhir</div>
        <h2>Penjelajah Pra-Aksara Nusantara</h2><p class="cert-sub">Diberikan kepada</p>
        <div class="cert-name"><input type="text" maxlength="40" aria-label="Tulis namamu" placeholder="Tulis namamu di sini" value="${nm.replace(/"/g,'&quot;')}"></div>
        <p class="msg">${ramah?'Kamu sudah menjelajah masa Pra-Aksara. Kamu hebat!':'Atas keberhasilan menjelajah lima ruang pameran masa Pra-Aksara: dari lahirnya bumi, manusia purba, alat batu dan logam, penaklukan api, sampai pelayaran leluhur Nusantara.'}</p>
        <div class="cert-rows">${rows.map(r=>`<div class="crow${r.done?' done':''}"><span>Bab ${r.c.n}</span><b>${r.c.name}</b><span class="cst">${J.star(r.n>0)} ${r.n}</span>${r.done?`<span class="ck">${J.ICON.check}</span>`:'<span class="ck no">belum</span>'}</div>`).join('')}</div>
        <p class="cert-total"><b>${total}</b> bintang · Mode ${J.MODES[m].name} · ${date}</p>
        ${allDone?'':`<p class="cert-note">${ramah?'Masih ada bab yang belum selesai. Ayo coba lagi nanti!':'Masih ada bab yang belum selesai. Selesaikan semua bab untuk sertifikat lengkap.'}</p>`}
        <div class="row cert-act"></div></div>`;
      const inp=$('input',c); inp.addEventListener('input',()=>{ App.st.player=inp.value.trim(); App.save(); });
      const pb=el('button',{class:'btn big praise',type:'button'},`${J.ICON.retry} Putar suara pujian`); pb.onclick=()=>C.praise(pb);
      const pt=el('button',{class:'btn ghost',type:'button'},`${J.ICON.book} Cetak sertifikat`); pt.onclick=()=>{ S.click(); try{ window.print(); }catch(_){ J.toast('Gunakan menu cetak di peramban.'); } };
      const bm=el('button',{class:'btn ghost',type:'button'},`${J.ICON.map} Peta Bab 5`); bm.onclick=()=>{ S.click(); C.map(); };
      const b1=el('button',{class:'btn ghost',type:'button'},`${J.ICON.retry} Jelajah lagi dari Bab 1`); b1.onclick=()=>{ S.page(); App.openChapter('bab1'); };
      $('.cert-act',c).append(pb,pt,bm,b1);
      wr.appendChild(c); s.appendChild(wr); S.win(); J.celebrate(200);
      const t=(ramah?'Sertifikat Akhir. Penjelajah Pra-Aksara Nusantara. ':'Sertifikat Akhir, Penjelajah Pra-Aksara Nusantara. ')+(B.PRAISE[m]||B.PRAISE.beginner);
      N.autoSeq([{text:t,el:c}]);
    }
  };
})(window.JPA);

</script>
<script>JPA.App.init();</script>
</body>
